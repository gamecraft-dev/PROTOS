<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1220" media="(prefers-color-scheme: dark)">
<meta name="description" content="Playbox: a shelf of small puzzle games. First up, Paint Sort: pour paint between vials until each holds one colour.">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>html,body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Playbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Lilita+One&display=swap">
<style>
/* ==========================================================
   PLAYBOX — one shell, many small games.
   The shell owns the home screen, settings, saving, sound and
   the shared sheet/toast UI. Each game is a separate file in
   src/games/ that calls Playbox.register().
   ========================================================== */
:root{
  color-scheme:light;
  --bg:#EEF1F6;
  --bg-2:#E1E6EF;
  --surface:#FFFFFF;
  --surface-2:#F4F6FA;
  --ink:#141A2B;
  --muted:#586079;
  --dim:#8E96AE;
  --line:#D9DFEA;
  --accent:#2B59F0;
  --accent-ink:#FFFFFF;
  --accent-deep:#1B3FB8;
  --accent-soft:#E3EAFE;
  --good:#16935D;
  --bad:#D92F45;
  --hard:#E0413F;
  --hard-deep:#A92A2B;
  --super:#8646E0;
  --super-deep:#5E2BA6;
  --coin:#F4B31B;
  --coin-edge:#C27F06;
  --scrim:rgba(16,22,40,.46);
  --shadow:0 18px 40px -22px rgba(20,32,70,.55);
  --shadow-sm:0 2px 0 var(--line);
  --f-disp:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1220; --bg-2:#080B15; --surface:#181E31; --surface-2:#1F2740;
    --ink:#EDF0F8; --muted:#A2AAC4; --dim:#6B7494; --line:#2A3350;
    --accent:#7090FF; --accent-ink:#0B1024; --accent-deep:#4A63C9; --accent-soft:#1F2A52;
    --good:#3DCB8B; --bad:#FF6275; --hard:#FF5E5B; --hard-deep:#B83533; --super:#B07CFF; --super-deep:#7446BD;
    --coin:#FFC83D; --coin-edge:#B98609;
    --scrim:rgba(0,0,0,.6); --shadow:0 18px 44px -20px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1220; --bg-2:#080B15; --surface:#181E31; --surface-2:#1F2740;
  --ink:#EDF0F8; --muted:#A2AAC4; --dim:#6B7494; --line:#2A3350;
  --accent:#7090FF; --accent-ink:#0B1024; --accent-deep:#4A63C9; --accent-soft:#1F2A52;
  --good:#3DCB8B; --bad:#FF6275; --hard:#FF5E5B; --hard-deep:#B83533; --super:#B07CFF; --super-deep:#7446BD;
  --coin:#FFC83D; --coin-edge:#B98609;
  --scrim:rgba(0,0,0,.6); --shadow:0 18px 44px -20px rgba(0,0,0,.85);
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
body{
  height:100%;margin:0;background:var(--bg);color:var(--ink);
  font:500 15px/1.45 var(--f-body);
  overscroll-behavior:none;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}

#app{position:relative;height:100%;width:100%;max-width:480px;margin:0 auto;overflow:hidden;background:var(--bg)}
@media (min-width:560px) and (min-height:640px){
  body{display:grid;place-items:center;background:var(--bg-2)}
  #app{width:430px;height:min(900px,calc(100% - 40px));border-radius:30px;box-shadow:var(--shadow),0 0 0 1px var(--line)}
}
.view{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.view.enter{animation:viewIn .34s cubic-bezier(.2,.9,.25,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

/* ---------- shared controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;
  padding:15px 20px;font-family:var(--f-disp);font-size:19px;letter-spacing:.01em;line-height:1;
  transition:transform .1s,box-shadow .1s,filter .15s}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 5px 0 var(--accent-deep)}
.btn-hard{background:var(--hard);color:#fff;box-shadow:0 5px 0 var(--hard-deep)}
.btn-super{background:var(--super);color:#fff;box-shadow:0 5px 0 var(--super-deep)}
.btn-ghost{background:var(--surface-2);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn-primary:active,.btn-hard:active,.btn-super:active,.btn-ghost:active{transform:translateY(4px);box-shadow:none}
.btn:disabled{filter:grayscale(.8) opacity(.55);cursor:default;transform:none}
.btn-sm{padding:12px 16px;font-size:16px;border-radius:14px}
.btn-wide{width:100%}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--surface);color:var(--muted);
  display:grid;place-items:center;flex:0 0 auto;box-shadow:var(--shadow-sm);transition:transform .1s}
.icon-btn:active{transform:translateY(2px);box-shadow:none}
.icon-btn svg{width:22px;height:22px}
.coin{display:inline-block;width:18px;height:18px;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 35% 32%,#FFE9A6 0 18%,var(--coin) 38%);
  box-shadow:inset 0 -2px 0 var(--coin-edge),0 0 0 1.5px var(--coin-edge)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px 7px 8px;border-radius:999px;
  background:var(--surface);box-shadow:var(--shadow-sm);font-weight:800;font-size:15px;
  font-variant-numeric:tabular-nums}

/* switches and segmented control */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;
  border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .lab{font-weight:700;font-size:15.5px}
.set-row .hint{font-size:12.5px;color:var(--dim);font-weight:600;margin-top:1px}
.sw{width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:0 0 auto;
  transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"] i{transform:translateX(22px)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;flex:0 0 auto}
.seg button{padding:7px 11px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ---------- sheets + toast ---------- */
#layer{position:absolute;inset:0;z-index:50;pointer-events:none}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .26s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;
  background:var(--surface);border-radius:28px 28px 0 0;
  padding:12px 20px calc(22px + env(safe-area-inset-bottom,0px));
  transform:translateY(104%);transition:transform .36s cubic-bezier(.2,.9,.25,1);
  pointer-events:auto;box-shadow:0 -20px 50px -24px rgba(10,16,40,.6)}
.sheet.on{transform:translateY(0)}
.sheet .grab{width:42px;height:5px;border-radius:999px;background:var(--line);margin:0 auto 14px}
.sheet .eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--accent);margin-bottom:4px}
.sheet h2{font-family:var(--f-disp);font-weight:400;font-size:30px;line-height:1.05;margin:0 0 6px;text-wrap:balance;letter-spacing:.005em}
.sheet .sub{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 12px;max-width:44ch}
.sheet .actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.sheet[data-tone="hard"] .eyebrow{color:var(--hard)}
.sheet[data-tone="super"] .eyebrow{color:var(--super)}
.sheet[data-tone="bad"] .eyebrow{color:var(--bad)}
#toast{position:absolute;left:50%;top:calc(76px + env(safe-area-inset-top,0px));z-index:60;
  transform:translate(-50%,-8px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;
  font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  max-width:86%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- home ---------- */
#home{overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));gap:20px}
.home-top{display:flex;align-items:center;gap:12px}
.mark{font-family:var(--f-disp);font-size:34px;line-height:1;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
.mark-box{width:38px;height:38px;border-radius:11px;background:var(--accent);position:relative;flex:0 0 auto;
  box-shadow:inset 0 -4px 0 var(--accent-deep)}
.mark-box::before,.mark-box::after{content:"";position:absolute;border-radius:50%}
.mark-box::before{width:12px;height:12px;left:7px;top:8px;background:var(--coin)}
.mark-box::after{width:10px;height:10px;right:7px;bottom:10px;background:#fff;opacity:.9;border-radius:3px}
.home-top .spacer{flex:1}
.home-hello{display:flex;flex-direction:column;gap:4px}
.home-hello h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(28px,8.4vw,36px);line-height:1.02;margin:0;text-wrap:balance}
.home-hello p{margin:0;color:var(--muted);font-size:15px;max-width:40ch}
.home-section{display:flex;flex-direction:column;gap:12px}
.home-section[hidden]{display:none}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.section-label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--dim)}
.section-count{font-size:12.5px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}

/* boards: each game is a chunky slab standing on a base in its own colour.
   A game sets --b-* on .board[data-game="its-id"]; the defaults are Playbox blue. */
.board{--b-accent:var(--accent);--b-deep:var(--accent-deep);--b-soft:var(--accent-soft);--b-ink:var(--accent-ink);--b-text:var(--accent);
  position:relative;display:flex;flex-direction:column;min-width:0;border-radius:24px;background:var(--surface);
  text-align:left;box-shadow:0 6px 0 var(--b-deep),0 20px 32px -22px rgba(10,16,40,.55);
  transition:transform .12s,box-shadow .12s;animation:boardIn .5s cubic-bezier(.2,.9,.25,1) backwards;
  animation-delay:calc(var(--i,0) * 70ms)}
.board:active{transform:translateY(4px);box-shadow:0 2px 0 var(--b-deep),0 10px 20px -16px rgba(10,16,40,.5)}
@keyframes boardIn{from{transform:translateY(18px) scale(.97)}to{transform:none}}
.board-art{position:relative;overflow:hidden;border-radius:24px 24px 0 0;aspect-ratio:1/.86;background:var(--b-soft)}
.board-art canvas{position:absolute;inset:0;width:100%;height:100%}
.board-body{display:flex;flex-direction:column;gap:5px;padding:12px 13px 14px;min-width:0;flex:1}
.board-title{font-family:var(--f-disp);font-size:20px;line-height:1.05;text-wrap:balance}
.board-tag{color:var(--muted);font-size:12.5px;line-height:1.35}
.board-foot{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:5px;min-width:0}
.board-chip{display:inline-flex;align-items:center;min-width:0;font-size:12px;font-weight:800;color:var(--b-text);background:var(--b-soft);
  padding:5px 10px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board-cta{display:inline-flex;align-items:center;justify-content:center;gap:7px;margin-left:auto;flex:0 0 auto;
  width:36px;height:36px;border-radius:12px;background:var(--b-accent);color:var(--b-ink);box-shadow:0 3px 0 var(--b-deep)}
.board-cta svg{width:18px;height:18px}
.board-cta .lbl{display:none}
.board-lock{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:rgba(16,22,40,.72);color:#fff}
.board-lock svg{width:16px;height:16px}
.board.soon .board-chip{color:var(--muted);background:var(--surface-2)}
.board.nope{animation:boardNope .4s ease}
@keyframes boardNope{20%{transform:translateX(-6px) rotate(-1deg)}45%{transform:translateX(5px) rotate(.8deg)}70%{transform:translateX(-3px)}100%{transform:none}}

/* the board you're playing gets the big slot */
.board-feature{border-radius:28px}
.board-feature .board-art{aspect-ratio:auto;height:clamp(180px,30dvh,230px);border-radius:28px 28px 0 0}
.board-feature .board-body{gap:6px;padding:16px 18px 18px}
.board-feature .board-title{font-size:30px}
.board-feature .board-tag{font-size:14.5px}
.board-feature .board-chip{font-size:12.5px;padding:6px 11px}
.board-feature .board-cta{width:auto;height:auto;padding:12px 18px 12px 15px;border-radius:15px;box-shadow:0 4px 0 var(--b-deep);
  font-family:var(--f-disp);font-size:18px;line-height:1}
.board-feature .board-cta .lbl{display:inline}

.board-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}
.board-grid .board.wide{grid-column:1/-1}
.board-grid .board.wide .board-art{aspect-ratio:2.1/1}
.home-note{font-size:13.5px;color:var(--dim);text-align:center;margin:4px auto 0;max-width:34ch;line-height:1.5}
.pb-frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.06s!important}
}
</style>
</head>
<body>
<div id="app">
  <section id="home" class="view" aria-label="Playbox home">
    <header class="home-top">
      <div class="mark"><span class="mark-box" aria-hidden="true"></span>Playbox</div>
      <span class="spacer"></span>
      <button class="icon-btn" id="homeSettings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
      </button>
    </header>
    <div class="home-hello">
      <h1 id="homeTitle">Pick a game</h1>
      <p id="homeSub">Short puzzles that remember where you left off.</p>
    </div>
    <section class="home-section" id="featureSection" aria-labelledby="featureLabel">
      <div class="section-head"><span class="section-label" id="featureLabel">Start here</span></div>
      <div id="featureSlot"></div>
    </section>
    <section class="home-section" id="moreSection" aria-labelledby="moreLabel">
      <div class="section-head"><span class="section-label" id="moreLabel">More games</span><span class="section-count" id="moreCount"></span></div>
      <div class="board-grid" id="boardGrid"></div>
    </section>
    <p class="home-note">Your progress in each game is saved on this device.</p>
  </section>
  <section id="stage" class="view" hidden></section>
  <div id="layer">
    <div class="scrim" id="scrim"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script>
/* ==========================================================
   PLAYBOX shell services: store · audio · buzz · ui · registry
   ========================================================== */
(function(){
'use strict';
const $ = s => document.querySelector(s);
const root = document.documentElement;

/* ---------- store: one localStorage key, one sub-object per game ---------- */
const KEY = 'playbox.v1';
function readLS(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function writeLS(d){ try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){} }
const loaded = readLS() || {};
const data = {
  v: 1,
  settings: Object.assign({ sound: true, haptics: true, theme: 'system' }, loaded.settings),
  games: loaded.games && typeof loaded.games === 'object' ? loaded.games : {},
  last: loaded.last || null
};
let saveTimer = 0;
const store = {
  data,
  settings: data.settings,
  game(id){ return data.games[id] || (data.games[id] = {}); },
  save(now){
    clearTimeout(saveTimer);
    if(now) writeLS(data); else saveTimer = setTimeout(() => writeLS(data), 150);
  },
  wipe(){
    for(const k of Object.keys(data.games)) delete data.games[k];
    data.last = null; writeLS(data);
  }
};
window.addEventListener('pagehide', () => writeLS(data));
document.addEventListener('visibilitychange', () => { if(document.hidden) writeLS(data); });

/* ---------- events ---------- */
const handlers = {};
const on = (ev, fn) => { (handlers[ev] = handlers[ev] || new Set()).add(fn); return () => handlers[ev].delete(fn); };
const emit = (ev, x) => { if(handlers[ev]) for(const fn of [...handlers[ev]]) try{ fn(x); }catch(e){ console.error(e); } };

/* ---------- theme ---------- */
const hostTheme = root.getAttribute('data-theme');       // whatever the page was opened with
let settingTheme = false;
function applyTheme(){
  const t = data.settings.theme;
  settingTheme = true;
  if(t === 'light' || t === 'dark') root.setAttribute('data-theme', t);
  else if(hostTheme) root.setAttribute('data-theme', hostTheme);
  else root.removeAttribute('data-theme');
  settingTheme = false;
  emit('theme');
}
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => emit('theme')); }catch(e){}
new MutationObserver(() => { if(!settingTheme) emit('theme'); }).observe(root, { attributes: true, attributeFilter: ['data-theme'] });

/* ---------- audio: tiny synth, everything generated on the fly ---------- */
const audio = (() => {
  let ctx = null, master = null, noiseBuf = null;
  function ensure(){
    if(!data.settings.sound) return null;
    if(!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      try{ ctx = new AC(); }catch(e){ return null; }
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 14; comp.ratio.value = 5;
      comp.attack.value = .002; comp.release.value = .16;
      master = ctx.createGain(); master.gain.value = .7;
      master.connect(comp); comp.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if(ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }
  function env(g, t, peak, attack, dur){
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(.0002, peak), t + attack);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  }
  // a pitched blip: optional glide to f1 and an optional filter
  function tone(o){
    const c = ensure(); if(!c) return;
    const t = c.currentTime + (o.at || 0), dur = o.dur || .12;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f || 440, t);
    if(o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t + (o.glide || dur));
    env(g, t, o.gain == null ? .25 : o.gain, o.attack || .004, dur);
    let node = osc;
    if(o.filter){
      const fl = c.createBiquadFilter();
      fl.type = o.filter; fl.frequency.value = o.ff || 1200; fl.Q.value = o.q || .8;
      osc.connect(fl); node = fl;
    }
    node.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + dur + .05);
  }
  // filtered noise: splashes, pops, whooshes
  function noise(o){
    const c = ensure(); if(!c) return;
    const t = c.currentTime + (o.at || 0), dur = o.dur || .15;
    const src = c.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    src.playbackRate.value = o.rate || 1;
    const fl = c.createBiquadFilter(); fl.type = o.filter || 'bandpass';
    fl.frequency.setValueAtTime(o.f || 1000, t);
    if(o.f1) fl.frequency.exponentialRampToValueAtTime(o.f1, t + dur);
    fl.Q.value = o.q || 1;
    const g = c.createGain(); env(g, t, o.gain == null ? .15 : o.gain, o.attack || .004, dur);
    src.connect(fl); fl.connect(g); g.connect(master);
    src.start(t, Math.random() * .5); src.stop(t + dur + .05);
  }
  // a small glass bell: fundamental plus inharmonic partials
  function bell(f, at, gain){
    gain = gain == null ? .18 : gain;
    tone({ f, at, dur: 1.1, gain, attack: .003 });
    tone({ f: f * 2.76, at, dur: .45, gain: gain * .35, attack: .002 });
    tone({ f: f * 5.4, at, dur: .2, gain: gain * .12, attack: .002 });
  }
  return { ensure, tone, noise, bell, get ctx(){ return ctx; } };
})();
function buzz(p){ if(data.settings.haptics && navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }
const click = () => audio.tone({ f: 900, f1: 1300, dur: .05, gain: .08, type: 'triangle' });

/* ---------- ui: one sheet at a time, plus a toast ---------- */
const sheetEl = $('#sheet'), scrim = $('#scrim'), toastEl = $('#toast');
let sheetClose = null, toastTimer = 0;
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if(attrs) for(const [k, v] of Object.entries(attrs)){
    if(v == null || v === false) continue;
    if(k === 'class') el.className = v;
    else if(k === 'html') el.innerHTML = v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for(const kid of kids.flat()) if(kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
function closeSheet(){
  if(!sheetEl.classList.contains('on')) return;
  sheetEl.classList.remove('on'); scrim.classList.remove('on');
  const cb = sheetClose; sheetClose = null;
  if(cb) cb();
}
/* sheet({eyebrow, title, sub, body, actions:[{label, kind, onClick, keepOpen, disabled}], tone, dismiss, onClose}) */
function sheet(o){
  if(sheetEl.classList.contains('on')){ const cb = sheetClose; sheetClose = null; if(cb) cb(); }
  sheetEl.replaceChildren();
  sheetEl.dataset.tone = o.tone || '';
  sheetEl.append(h('div', { class: 'grab', 'aria-hidden': 'true' }));
  if(o.eyebrow) sheetEl.append(h('div', { class: 'eyebrow' }, o.eyebrow));
  sheetEl.append(h('h2', { id: 'sheetTitle' }, o.title || ''));
  if(o.sub) sheetEl.append(h('p', { class: 'sub' }, o.sub));
  if(o.body) sheetEl.append(o.body);
  if(o.actions && o.actions.length){
    const box = h('div', { class: 'actions' });
    for(const a of o.actions){
      const b = h('button', { class: 'btn btn-wide ' + (a.kind === 'ghost' ? 'btn-ghost btn-sm' : 'btn-' + (a.kind || 'primary')),
        id: a.id, disabled: a.disabled }, a.label);
      b.addEventListener('click', () => { click(); if(!a.keepOpen) closeSheet(); if(a.onClick) a.onClick(); });
      box.append(b);
    }
    sheetEl.append(box);
  }
  sheetClose = o.onClose || null;
  scrim.onclick = o.dismiss === false ? null : closeSheet;
  requestAnimationFrame(() => { sheetEl.classList.add('on'); scrim.classList.add('on'); });
  sheetEl.scrollTop = 0;
  return sheetEl;
}
function toast(msg, ms){
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('on'), ms || 1900);
}
function toggle(label, hint, get, set){
  const sw = h('button', { class: 'sw', role: 'switch', 'aria-checked': String(!!get()), 'aria-label': label }, h('i'));
  sw.addEventListener('click', () => { const v = !get(); set(v); sw.setAttribute('aria-checked', String(v)); click(); });
  return h('div', { class: 'set-row' }, h('div', null, h('div', { class: 'lab' }, label), hint ? h('div', { class: 'hint' }, hint) : null), sw);
}
// the shared settings rows; games append their own rows under these
function settingsRows(){
  const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Theme' });
  for(const [v, lab] of [['system', 'Auto'], ['light', 'Light'], ['dark', 'Dark']]){
    const b = h('button', { 'aria-pressed': String(data.settings.theme === v) }, lab);
    b.addEventListener('click', () => {
      data.settings.theme = v; store.save(); applyTheme(); click();
      for(const x of seg.children) x.setAttribute('aria-pressed', String(x === b));
    });
    seg.append(b);
  }
  return h('div', null,
    toggle('Sound', 'Every sound is synthesised live', () => data.settings.sound, v => { data.settings.sound = v; store.save(); if(v) audio.ensure(); }),
    toggle('Vibration', 'On phones that support it', () => data.settings.haptics, v => { data.settings.haptics = v; store.save(); if(v) buzz(20); }),
    h('div', { class: 'set-row' }, h('div', null, h('div', { class: 'lab' }, 'Theme'), h('div', { class: 'hint' }, 'Auto follows your device')), seg)
  );
}
function openSettings(extra){
  const body = h('div', null, settingsRows(), extra || null);
  const wipe = h('button', { class: 'btn btn-ghost btn-sm btn-wide', style: 'margin-top:14px;color:var(--bad)' }, 'Erase all saved progress');
  wipe.addEventListener('click', () => {
    click();
    sheet({ eyebrow: 'Erase progress', title: 'Start every game from scratch?', tone: 'bad',
      sub: 'Levels, coins and boosters in every Playbox game go back to zero. Settings stay.',
      actions: [
        { label: 'Erase everything', kind: 'hard', onClick: () => { store.wipe(); emit('wipe'); renderHome(); toast('Progress erased'); } },
        { label: 'Keep my progress', kind: 'ghost' }
      ] });
  });
  body.append(wipe);
  sheet({ eyebrow: 'Settings', title: 'Options', body, actions: [{ label: 'Done' }] });
}

/* ---------- registry + navigation ---------- */
const games = [];
let current = null;                              // { def, handle }
const home = $('#home'), stage = $('#stage');

/* A game definition: { id, title, tagline, order, card(el, save), status(save), cta(save), mount(stage, api) }.
   Set soon: true (and leave out mount) for a game that only has a board so far. */
function register(def){ games.push(def); if(booted) renderHome(); }
const PLAY_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
const LOCK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2.5" fill="currentColor" stroke="none"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
function boardFor(g, featured, i){
  const save = g.soon ? {} : store.game(g.id);
  const art = h('div', { class: 'board-art', 'aria-hidden': 'true' });
  try{ g.card && g.card(art, save, { featured }); }catch(e){ console.error(e); }
  if(g.soon) art.append(h('span', { class: 'board-lock', html: LOCK_ICON }));
  // small boards show only the first part of a status ("Level 4 · 120 coins" -> "Level 4")
  let status = g.soon ? 'Coming soon' : g.status ? g.status(save) : '';
  if(!featured) status = status.split(' · ')[0];
  const cta = g.soon ? null : h('span', { class: 'board-cta' },
    h('span', { html: PLAY_ICON, style: 'display:contents' }), h('span', { class: 'lbl' }, g.cta ? g.cta(save) : 'Play'));
  const el = h('button', {
    class: 'board' + (featured ? ' board-feature' : '') + (g.soon ? ' soon' : ''),
    'data-game': g.id, style: `--i:${i}`,
    'aria-label': g.soon ? `${g.title}, coming soon` : `Play ${g.title}`
  },
    art,
    h('div', { class: 'board-body' },
      h('div', { class: 'board-title' }, g.title),
      h('div', { class: 'board-tag' }, g.tagline),
      h('div', { class: 'board-foot' }, status ? h('span', { class: 'board-chip' }, status) : null, cta)));
  el.addEventListener('click', () => {
    click();
    if(!g.soon){ openGame(g.id); return; }
    el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope');
    buzz(12); toast(`${g.title} is coming soon`);
  });
  return el;
}
function renderHome(){
  const list = games.slice().sort((a, b) => (a.order == null ? 99 : a.order) - (b.order == null ? 99 : b.order));
  const ready = list.filter(g => !g.soon);
  const played = data.last && ready.find(g => g.id === data.last);
  const feature = played || ready[0] || null;
  const rest = list.filter(g => g !== feature);

  $('#featureSection').hidden = !feature;
  $('#featureLabel').textContent = played ? 'Jump back in' : 'Start here';
  $('#featureSlot').replaceChildren(...(feature ? [boardFor(feature, true, 0)] : []));

  const grid = $('#boardGrid');
  grid.replaceChildren(...rest.map((g, k) => boardFor(g, false, k + 1)));
  if(rest.length % 2) grid.lastChild.classList.add('wide');     // never leave a board alone in a row
  $('#moreSection').hidden = !rest.length;
  $('#moreLabel').textContent = feature ? 'More games' : 'Games';
  const soon = list.length - ready.length;
  $('#moreCount').textContent = soon ? `${soon} coming soon` : `${rest.length}`;

  $('#homeTitle').textContent = played ? 'Welcome back' : 'Pick a game';
  $('#homeSub').textContent = played ? `${played.title} is right where you left it.` : 'Short puzzles that remember where you left off.';
}
/* ---------- games built elsewhere, run in a frame ----------
   A game that already exists as its own page (elsewhere in the repo) doesn't
   need porting: the build embeds that page as base64 (see build.sh), and
   framedGame() returns a mount() that runs it in a same-origin frame filling the
   stage. `head`/`body` are HTML snippets added before </head> and </body>, the
   place for small bridges into the game. The game leaves by posting
   {playbox: 'exit'} to its parent; exitButton() builds a script that adds a
   back button doing that. */
function decodePage(b64){
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function framedGame(o){
  return function mount(stage, api){
    let html = o.page ? decodePage(o.page)
      : `<p style="font:16px system-ui;color:#fff;padding:24px">${o.title} isn’t built into this page. Run playbox/build.sh.</p>`;
    if(o.head){ const i = html.search(/<\/head>/i); html = i < 0 ? o.head + html : html.slice(0, i) + o.head + html.slice(i); }
    if(o.body){ const i = html.toLowerCase().lastIndexOf('</body>'); html = i < 0 ? html + o.body : html.slice(0, i) + o.body + html.slice(i); }
    const frame = h('iframe', { class: 'pb-frame', title: o.title });
    frame.style.background = o.background || '#000';
    frame.srcdoc = html;
    stage.append(frame);
    const onMessage = e => { if(e.source === frame.contentWindow && e.data && e.data.playbox === 'exit') api.exit(); };
    window.addEventListener('message', onMessage);
    frame.addEventListener('load', () => { try{ frame.contentWindow.focus(); }catch(e){} });
    return { unmount(){ window.removeEventListener('message', onMessage); frame.remove(); } };
  };
}
/* exitButton({ into: CSS selector of the row to put it in, className: the game's own button class, size }) */
function exitButton(o){
  const size = o.size || 22;
  const svg = `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`;
  return '<script>(function(){function add(){' +
    'var row=document.querySelector(' + JSON.stringify(o.into) + ');if(!row||document.getElementById("pbBack"))return;' +
    'var b=document.createElement("button");b.id="pbBack";b.type="button";b.className=' + JSON.stringify(o.className || '') + ';' +
    'b.setAttribute("aria-label","Back to Playbox");b.title="Back to Playbox";b.innerHTML=' + JSON.stringify(svg) + ';' +
    'b.addEventListener("click",function(e){e.stopPropagation();parent.postMessage({playbox:"exit"},"*");});' +
    'row.insertBefore(b,row.firstChild);}' +
    'if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",add);else add();})();<\/script>';
}

function openGame(id, opts){
  const def = games.find(g => g.id === id);
  if(!def || def.soon) return;
  audio.ensure();
  if(current) closeGame(true);
  data.last = id; store.save();
  stage.replaceChildren();
  stage.hidden = false; home.hidden = true;
  stage.classList.remove('enter'); void stage.offsetWidth; stage.classList.add('enter');
  const api = {
    save: store.game(id),
    persist: now => store.save(now),
    audio, buzz, click, ui: { sheet, closeSheet, toast, h, toggle, openSettings },
    settings: data.settings,
    on, exit: () => closeGame()
  };
  current = { def, handle: def.mount(stage, api, opts || {}) || {} };
  try{ history.replaceState(null, '', '#' + id); }catch(e){}
}
function closeGame(silent){
  if(!current) return;
  closeSheet();
  try{ current.handle.unmount && current.handle.unmount(); }catch(e){ console.error(e); }
  current = null;
  stage.replaceChildren(); stage.hidden = true;
  store.save(true);
  if(silent) return;
  home.hidden = false; renderHome();
  home.classList.remove('enter'); void home.offsetWidth; home.classList.add('enter');
  try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
}
$('#homeSettings').addEventListener('click', () => { click(); openSettings(); });
on('theme', () => { if(booted && !home.hidden) renderHome(); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && sheetEl.classList.contains('on')) closeSheet();
});

let booted = false;
function boot(){
  booted = true;
  applyTheme();
  renderHome();
  const want = (location.hash || '').slice(1);
  if(want && games.some(g => g.id === want)) openGame(want);
}
window.Playbox = { register, store, audio, buzz, on, emit, ui: { sheet, closeSheet, toast, h }, boot, openGame, framedGame, exitButton };
})();
</script>
<style>
/* ---------- Car Loop: Roundabout Rush (../roundabout) running inside Playbox ---------- */
/* The game is a night scene, so the board's art uses its palette in both
   themes; the board's chrome follows Playbox's light/dark tokens. */
.board[data-game="car-loop"]{--b-accent:#12935A; --b-deep:#0B6B41; --b-soft:#DDF5E8; --b-ink:#FFFFFF; --b-text:#0B6B41}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .board[data-game="car-loop"]{
    --b-accent:#34C771; --b-deep:#1D8A57; --b-soft:#14301F; --b-ink:#04210F; --b-text:#6FE3A9;
  }
}
:root[data-theme="dark"] .board[data-game="car-loop"]{
  --b-accent:#34C771; --b-deep:#1D8A57; --b-soft:#14301F; --b-ink:#04210F; --b-text:#6FE3A9;
}
</style>
<script>
/* Car Loop is Roundabout Rush, the standalone game in /roundabout. The build
   embeds its finished page (roundabout/index.html) here, and mount() runs it in
   a same-origin frame filling the Playbox stage (Playbox.framedGame). The game
   keeps its own screens and its own save ("roundabout-rush-v1" in localStorage);
   Playbox adds a back button to the game's home screen and reads the save for
   the board's chip.
   The board art is a roundabout seen from above: cars circling the ring and one
   waiting at the stop line for its gap. */
(function(){
'use strict';
const RING_R = 80, RING_r = 44, LANE = 62;
// angle on the ring (radians, clockwise from the right) and colour
const CARS = [[-.38 * Math.PI, '#EF4444'], [-.92 * Math.PI, '#3B82F6'], [.12 * Math.PI, '#F5B82E'], [.78 * Math.PI, '#8B5CF6']];

function car(ctx, x, y, rot, color){
  const L = 25, Wd = 13.5;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.roundRect(-L / 2 + 1.5, -Wd / 2 + 2, L, Wd, 4); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.roundRect(-L / 2, -Wd / 2, L, Wd, 4); ctx.fill();
  ctx.fillStyle = 'rgba(18,26,44,.78)';
  ctx.beginPath(); ctx.roundRect(L / 2 - 9.5, -Wd / 2 + 2, 5, Wd - 4, 1.5); ctx.fill();      // windscreen
  ctx.beginPath(); ctx.roundRect(-L / 2 + 3, -Wd / 2 + 2.5, 3, Wd - 5, 1); ctx.fill();         // rear window
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  ctx.beginPath(); ctx.roundRect(-L / 2 + 7, -Wd / 2 + 2.5, 8, Wd - 5, 2); ctx.fill();         // roof shine
  ctx.restore();
}

function draw(box){
  const cv = document.createElement('canvas');
  box.append(cv);
  requestAnimationFrame(() => {
    const W = box.clientWidth, H = box.clientHeight;
    if(!W || !H) return;
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#16244A'); bg.addColorStop(1, '#0B1222');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    // laid out in a 250 x 236 box; the entry road runs off the bottom edge
    const u = Math.min(W / 250, H / 236);
    ctx.translate(W / 2, H / 2 - 6 * u); ctx.scale(u, u);
    const road = '#323E66';

    // entry road, stop line, waiting car
    const bottom = (H / 2 + 6 * u) / u + 4;
    ctx.fillStyle = road; ctx.fillRect(-18, RING_R - 8, 36, bottom - RING_R + 8);
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(-16, RING_R + 4, 32, 3.5);
    car(ctx, 0, RING_R + 22, -Math.PI / 2, '#F4F4F5');

    // the ring
    ctx.beginPath(); ctx.arc(0, 0, RING_R, 0, Math.PI * 2); ctx.arc(0, 0, RING_r, 0, Math.PI * 2, true);
    ctx.fillStyle = road; ctx.fill('evenodd');
    ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, RING_R - 3.5, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, RING_r + 3.5, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([9, 9]); ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, LANE, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);

    // the island at night, with a dark tree
    ctx.fillStyle = '#0D1830';
    ctx.beginPath(); ctx.arc(0, 0, RING_r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1D4A37';
    for(const [x, y, r] of [[-6, -4, 15], [9, 2, 12], [-1, 9, 11]]){ ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    ctx.beginPath(); ctx.arc(-10, -9, 6, 0, Math.PI * 2); ctx.fill();

    // street lamps around the ring, and a few trees on the verge
    for(const a of [-2.4, -.75, .75, 2.4]){
      const x = Math.cos(a) * (RING_R + 14), y = Math.sin(a) * (RING_R + 14);
      const glow = ctx.createRadialGradient(x, y, 0, x, y, 26);
      glow.addColorStop(0, 'rgba(255,226,150,.30)'); glow.addColorStop(1, 'rgba(255,226,150,0)');
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FFE7A3'; ctx.beginPath(); ctx.arc(x, y, 2.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#1D4A37';
    for(const [x, y, r] of [[-108, -62, 9], [112, -30, 11], [-116, 40, 10], [104, 70, 8]]){ ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

    // cars going round clockwise, the first with speed lines behind it
    CARS.forEach(([a, color], k) => {
      const x = Math.cos(a) * LANE, y = Math.sin(a) * LANE;
      if(k === 0){
        ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        for(const dr of [-4, 4]){
          ctx.beginPath(); ctx.arc(0, 0, LANE + dr, a - .52, a - .3); ctx.stroke();
        }
      }
      car(ctx, x, y, a + Math.PI / 2, color);
    });
  });

<script>
/* Hex Tile Sort is Hexa Stack, the standalone game in /hexa-stack. The build
   embeds its page (hexa-stack/index.html) here and Playbox.framedGame runs it in

  [0, -1, [4, 4, 1]], [1, -1, [1, 1, 1, 1]], [-1, 0, [5, 0, 0]], [0, 0, [3, 3, 3, 0]],

const STORAGE_BRIDGE = '<script>(function(){if(window.storage)return;var p=' + JSON.stringify(STORE_PREFIX) + ';' +
  'window.storage={get:function(k){try{var v=localStorage.getItem(p+k);return Promise.resolve(v==null?null:{key:k,value:v});}catch(e){return Promise.resolve(null);}},' +

  card: draw,
  mount: window.Playbox.framedGame({
    page: GAME_PAGE, title: 'Hex Tile Sort', background: '#0B0722',

/* ---------- Paint Sort: a painter's studio wall, glass vials, a small framed canvas ---------- */
:root{

}

    --ps-glass:rgba(160,186,232,.10);

}
:root[data-theme="dark"]{

<script>
/* ==========================================================
   PAINT SORT — pour paint between vials until each holds one colour.
   0 engine (pure, headless-testable) · 1 pigments · 2 painting
   3 geometry · 4 audio · 5 game · 6 lobby · 7 register
   ========================================================== */
(function(){
'use strict';

// @engine-start ------------------------------------------------------------
// Everything between the engine markers is pure: no DOM, no Playbox. The
// balance probe (tools/probe.mjs) evaluates this slice on its own in Node.

const CAP = 4;                                  // units of paint per vial

function rng32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seedFor(n, salt){
  let h = (0x9E3779B9 ^ Math.imul(n | 0, 0x85EBCA6B) ^ Math.imul((salt | 0) + 1, 0xC2B2AE35)) >>> 0;
  h ^= h >>> 16; h = Math.imul(h, 0x7FEB352D);
  h ^= h >>> 15; h = Math.imul(h, 0x846CA68B);
  h ^= h >>> 16; return h >>> 0;
}
function shuffle(a, r){
  for(let i = a.length - 1; i > 0; i--){ const j = (r() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

/* ---- difficulty curve ----
   Levels come in blocks of ten. Inside a block the heat climbs, spikes at the
   5th level (hard), drops back, climbs again and spikes harder at the 10th
   (super hard). Each block starts a notch above the last one, so the curve is
   a rising sawtooth. RAMP is the in-block shape, PICK chooses which of the
   generated candidates to keep (0 = the most forgiving, 1 = the most punishing). */
const RAMP = [0, .45, .9, 1.35, 2.5, .6, 1.05, 1.5, 1.95, 3.6];
const PICK = [0, .35, .55, .7, 1, 0, .45, .6, .75, 1];
const BLOCK_STEP = 1.15;                        // heat added per block of ten
const MAX_COLOURS = 12;
const K_CAP = [10, 11, 12];                     // colour ceiling per tier keeps the spikes above the ramp forever

function spec(n){
  n = Math.max(1, n | 0);
  const block = Math.floor((n - 1) / 10), pos = (n - 1) % 10;
  const tier = pos === 9 ? 2 : pos === 4 ? 1 : 0;           // 0 normal · 1 hard · 2 super hard
  const heat = block * BLOCK_STEP + RAMP[pos];
  const K = n === 1 ? 3 : Math.min(K_CAP[tier], Math.round(3 + heat));
  // hidden layers start at level 13: on the spikes and two ramp levels per
  // block, and from level 61 on every ramp level except the breathers
  const mysteryOn = n >= 13 && (tier > 0 || pos === 2 || pos === 7 || (block >= 6 && pos !== 0 && pos !== 5));
  const mystery = mysteryOn ? Math.min(.7, .3 + block * .04 + tier * .12) : 0;
  return {
    n, block, pos, tier, heat, K, E: 2, cap: CAP, mystery,
    pick: PICK[pos],
    cands: tier === 2 ? 14 : tier === 1 ? 9 : 4,
    reward: tier === 2 ? 60 : tier === 1 ? 30 : 10
  };
}

/* ---- rules ---- */
function isFull(v, C){
  if(v.length !== C) return false;
  for(let i = 1; i < C; i++) if(v[i] !== v[0]) return false;
  return true;
}
function isSolved(s, C){
  for(const v of s) if(v.length && !isFull(v, C)) return false;
  return true;
}
function runLen(v){
  const c = v[v.length - 1]; let k = 1;
  for(let i = v.length - 2; i >= 0 && v[i] === c; i--) k++;
  return k;
}
// Moves worth considering. Skips pouring a single-colour vial into an empty
// one (it changes nothing) and, with `prune`, tries only the first empty vial.
function listMoves(s, C, prune){
  const out = [];
  for(let i = 0; i < s.length; i++){
    const v = s[i];
    if(!v.length || isFull(v, C)) continue;
    const c = v[v.length - 1], k = runLen(v), whole = k === v.length;
    let emptySeen = false;
    for(let j = 0; j < s.length; j++){
      if(j === i) continue;
      const w = s[j];
      if(w.length >= C) continue;
      if(!w.length){
        if(whole) continue;
        if(prune){ if(emptySeen) continue; emptySeen = true; }
      } else if(w[w.length - 1] !== c) continue;
      out.push([i, j, Math.min(k, C - w.length)]);
    }
  }
  return out;
}
function applyMove(s, m){
  const [i, j, n] = m, ns = s.slice(), c = s[i][s[i].length - 1];
  ns[i] = s[i].slice(0, s[i].length - n);
  ns[j] = s[j].slice();
  for(let k = 0; k < n; k++) ns[j].push(c);
  return ns;
}
// runs of colour minus distinct colours: 0 exactly when solved
function heur(s){
  let segs = 0; const seen = new Set();
  for(const v of s){
    let prev = -1;
    for(const c of v){ if(c !== prev){ segs++; seen.add(c); prev = c; } }
  }
  return segs - seen.size;
}
function keyOf(s){
  const parts = new Array(s.length);
  for(let i = 0; i < s.length; i++){
    let t = ''; for(const c of s[i]) t += String.fromCharCode(97 + c);
    parts[i] = t;
  }
  parts.sort();
  return parts.join('|');
}

/* weighted A*. Returns {ok, path, nodes, exhausted}. `exhausted` with ok=false
   means the position is proven dead; without it the budget simply ran out. */
function solve(start, C, budget, weight){
  budget = budget || 40000; weight = weight || 2.5;
  const s0 = start.map(v => v.slice());
  if(isSolved(s0, C)) return { ok: true, path: [], nodes: 0, exhausted: true };
  const heap = [], seen = new Set([keyOf(s0)]);
  const push = node => {
    heap.push(node); let i = heap.length - 1;
    while(i > 0){ const p = (i - 1) >> 1; if(heap[p].f <= node.f) break; heap[i] = heap[p]; i = p; }
    heap[i] = node;
  };
  const pop = () => {
    const top = heap[0], last = heap.pop();
    if(heap.length){
      let i = 0; const n = heap.length;
      for(;;){
        let l = 2 * i + 1, r = l + 1, m = i;
        if(l < n && heap[l].f < (m === i ? last.f : heap[m].f)) m = l;
        if(r < n && heap[r].f < (m === i ? last.f : heap[m].f)) m = r;
        if(m === i) break;
        heap[i] = heap[m]; i = m;
      }
      heap[i] = last;
    }
    return top;
  };
  push({ s: s0, g: 0, f: weight * heur(s0), parent: null, mv: null });
  let nodes = 0;
  while(heap.length){
    const cur = pop();
    if(++nodes > budget) return { ok: false, path: null, nodes, exhausted: false };
    const moves = listMoves(cur.s, C, true);
    for(const m of moves){
      const ns = applyMove(cur.s, m), k = keyOf(ns);
      if(seen.has(k)) continue;
      seen.add(k);
      const node = { s: ns, g: cur.g + 1, f: 0, parent: cur, mv: m };
      if(isSolved(ns, C)){
        const path = [];
        for(let x = node; x.parent; x = x.parent) path.push(x.mv);
        return { ok: true, path: path.reverse(), nodes, exhausted: true };
      }
      node.f = node.g + weight * heur(ns);
      push(node);
    }
  }
  return { ok: false, path: null, nodes, exhausted: true };
}

/* a casual player with no lookahead: always takes a pour that finishes a
   vial, usually stacks onto matching paint, otherwise pours at random, and
   never immediately undoes its last pour. Returns moves used, or -1 if it got
   stuck or wandered too long. How often this player fails is the level's
   measured difficulty. */
function playout(start, C, r, maxSteps){
  let s = start.map(v => v.slice()), li = -1, lj = -1;
  for(let step = 0; step < maxSteps; step++){
    if(isSolved(s, C)) return step;
    const ms = listMoves(s, C, false).filter(m => !(m[0] === lj && m[1] === li));
    if(!ms.length) return -1;
    let m = null;
    for(const x of ms){
      const w = s[x[1]];
      if(w.length + x[2] === C && (w.length === 0 ? runLen(s[x[0]]) === C : runLen(w) === w.length)){ m = x; break; }
    }
    if(!m){
      const onto = ms.filter(x => s[x[1]].length > 0);
      m = (onto.length && r() < .8) ? onto[(r() * onto.length) | 0] : ms[(r() * ms.length) | 0];
    }
    s = applyMove(s, m); li = m[0]; lj = m[1];
  }
  return -1;
}
/* one-move-deep judgement of a pour: finish a vial, stack a whole run onto
   its match, don't spend empty vials, uncover paint that has somewhere to go */
function rateMove(s, C, x){
  const v = s[x[0]], w = s[x[1]], k = runLen(v);
  let sc = 0;
  if(w.length){
    sc += 2;
    if(x[2] === k) sc += 1;                                    // whole run moves, nothing split
    if(runLen(w) === w.length && w.length + x[2] === C) sc += 3;
  } else {
    sc -= 1.5;
    if(k === v.length) sc -= 3;
  }
  if(x[2] === k && v.length > k){
    const under = v[v.length - k - 1];
    for(let j = 0; j < s.length; j++){
      if(j === x[0] || j === x[1]) continue;
      const u = s[j];
      if(u.length && u.length < C && u[u.length - 1] === under){ sc += .8; break; }
    }
  }
  return sc;
}
/* a steadier player: takes the best-rated pour with a little noise. It keeps
   separating boards after the casual player has stopped winning any. */
function playoutSkilled(start, C, r, maxSteps){
  let s = start.map(v => v.slice()), li = -1, lj = -1;
  for(let step = 0; step < maxSteps; step++){
    if(isSolved(s, C)) return step;
    const ms = listMoves(s, C, false).filter(m => !(m[0] === lj && m[1] === li));
    if(!ms.length) return -1;
    let best = null, bestScore = -1e9;
    for(const x of ms){
      const sc = rateMove(s, C, x) + r() * 1.6;
      if(sc > bestScore){ bestScore = sc; best = x; }
    }
    s = applyMove(s, best); li = best[0]; lj = best[1];
  }
  return -1;
}

function deal(K, E, C, r){
  const pool = [];
  for(let c = 0; c < K; c++) for(let u = 0; u < C; u++) pool.push(c);
  let s = null;
  for(let tries = 0; tries < 60; tries++){
    shuffle(pool, r);
    s = [];
    for(let i = 0; i < K; i++) s.push(pool.slice(i * C, i * C + C));
    if(s.some(v => isFull(v, C))) continue;
    let pairs = 0;
    for(const v of s) for(let i = 1; i < C; i++) if(v[i] === v[i - 1]) pairs++;
    if(pairs > Math.max(1, Math.floor(K * .5))) continue;
    break;
  }
  for(let e = 0; e < E; e++) s.push([]);
  return s;
}

/* Build level n. Deterministic: the same n always yields the same board, on
   every device, so a restart or a reinstall replays the same puzzle. */
function generate(n){
  const sp = spec(n), C = sp.cap;
  const r = rng32(seedFor(n, 7));
  const cands = [];
  let attempts = 0;
  while(cands.length < sp.cands && attempts < sp.cands * 6){
    attempts++;
    const s = deal(sp.K, sp.E, C, r);
    const sol = solve(s, C, 25000);
    if(!sol.ok) continue;
    const R = sp.tier ? 20 : 14, pr = rng32(seedFor(n, 100 + attempts)), steps = 60 + sp.K * 14;
    let casual = 0, skilled = 0;
    for(let i = 0; i < R; i++){
      if(playout(s, C, pr, steps) < 0) casual++;
      if(playoutSkilled(s, C, pr, steps) < 0) skilled++;
    }
    cands.push({ s, casual: casual / R, skilled: skilled / R, fail: (casual + skilled) / (2 * R), len: sol.path.length });
  }
  while(!cands.length){                        // practically unreachable; keeps generate() total
    const s = deal(sp.K, sp.E, C, r), sol = solve(s, C, 300000);
    if(sol.ok) cands.push({ s, casual: 0, skilled: 0, fail: 0, len: sol.path.length });
  }
  cands.sort((a, b) => a.fail - b.fail || a.len - b.len);
  const pick = cands[Math.round(sp.pick * (cands.length - 1))];

  const pr = rng32(seedFor(n, 3));
  const palette = shuffle([...Array(MAX_COLOURS).keys()], pr).slice(0, sp.K);
  const hidden = pick.s.map(v => {
    const keep = v.length ? runLen(v) : 0;
    return v.map((_, i) => sp.mystery > 0 && i < v.length - keep && pr() < sp.mystery);
  });
  return { spec: sp, vials: pick.s, palette, hidden, fail: pick.fail, casual: pick.casual,
    skilled: pick.skilled, len: pick.len, pool: cands.length };
}

function probe(from, to){
  const rows = [];
  for(let n = from; n <= to; n++){
    const t0 = Date.now(), g = generate(n);

    const surf = (bottom) => {
      ctx.beginPath(); ctx.moveTo(x0 - 3, bottom);
      if(amp > .05) for(let x = x0 - 3; x <= x1 + 3; x += 3) ctx.lineTo(x, top + amp * Math.sin(x * k + ph));
      else { ctx.lineTo(x0 - 3, top); ctx.lineTo(x1 + 3, top); }
      ctx.lineTo(x1 + 3, bottom); ctx.closePath();
    };
    for(let i = 0; i < bands.length; i++){
      const b = bands[i], yt = lv[i], yb = i ? lv[i - 1] : y1 + 2;
      if(yb - yt < .05) continue;
      ctx.fillStyle = b.hid ? th.primer : PIGMENTS[b.c].hex;
      if(i === bands.length - 1) { surf(yb + .6); ctx.fill(); }
      else ctx.fillRect(x0 - 3, yt, x1 - x0 + 6, yb - yt + .6);
      if(b.hid){
        ctx.save(); ctx.beginPath(); ctx.rect(x0 - 3, yt, x1 - x0 + 6, yb - yt); ctx.clip();
        ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = w * .07;
        for(let x = x0 - w; x < x1 + w; x += w * .28){ ctx.beginPath(); ctx.moveTo(x, yb); ctx.lineTo(x + (yb - yt), yt); ctx.stroke(); }
        ctx.restore();
      }
    }
    // gloss: paint is thick and shiny, lit from the left
    const ca = Math.cos(ps.a), sa = Math.sin(ps.a);
    const lx = ps.px + (-w / 2 - ps.lx) * ca - (H / 2 - ps.ly) * sa, ly = ps.py + (-w / 2 - ps.lx) * sa + (H / 2 - ps.ly) * ca;
    const rx = ps.px + (w / 2 - ps.lx) * ca - (H / 2 - ps.ly) * sa, ry = ps.py + (w / 2 - ps.lx) * sa + (H / 2 - ps.ly) * ca;
    const gr = ctx.createLinearGradient(lx, ly, rx, ry);
    gr.addColorStop(0, 'rgba(255,255,255,.30)'); gr.addColorStop(.24, 'rgba(255,255,255,.10)');
    gr.addColorStop(.55, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(0,0,0,.20)');
    ctx.fillStyle = gr; surf(y1 + 2); ctx.fill();
    // seams between colours, and a bright meniscus on top
    ctx.fillStyle = 'rgba(0,0,0,.13)';
    for(let i = 0; i < lv.length - 1; i++) ctx.fillRect(x0 - 3, lv[i] - .5, x1 - x0 + 6, 1.2);
    ctx.strokeStyle = 'rgba(255,255,255,.42)'; ctx.lineWidth = Math.max(1.2, w * .045);
    ctx.beginPath();
    if(amp > .05){ for(let x = x0 - 3; x <= x1 + 3; x += 3) x === x0 - 3 ? ctx.moveTo(x, top + 1 + amp * Math.sin(x * k + ph)) : ctx.lineTo(x, top + 1 + amp * Math.sin(x * k + ph)); }
    else { ctx.moveTo(x0 - 3, top + 1); ctx.lineTo(x1 + 3, top + 1); }
    ctx.stroke();
    // question marks on hidden paint, symbols if asked for
    const unitMarks = o.symbols || bands.some(b => b.hid);
    if(unitMarks){
      let before = 0;
      for(const b of bands){
        const whole = Math.floor(b.u + 1e-6);
        for(let u = 0; u < whole; u++){
          if(!b.hid && !o.symbols) break;
          const Y = levelFor(poly, (before + u + .5) * g.unitA, y0 - 1, y1 + 1);
          const X = axisAt(ps, Y);
          if(X == null) continue;
          if(b.hid){
            ctx.fillStyle = 'rgba(255,255,255,.82)'; ctx.font = `${Math.round(w * .46)}px ${o.font}`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', X, Y + w * .02);
          } else {
            ctx.fillStyle = PIGMENTS[b.c].ink; glyph(ctx, b.c, X, Y, w * .34);
          }
        }
        before += b.u;
      }
    }
    ctx.restore();
  }

  // the glass in front: highlights, outline, rim, cork
  ctx.save(); applyPose(ctx, ps);
  ctx.lineCap = 'round'; ctx.strokeStyle = th.hi;
  ctx.globalAlpha = .7; ctx.lineWidth = w * .1;
  ctx.beginPath(); ctx.moveTo(-w * .27, g.head * .7); ctx.lineTo(-w * .27, H - r * 1.1); ctx.stroke();
  ctx.globalAlpha = .45; ctx.lineWidth = w * .05;
  ctx.beginPath(); ctx.moveTo(-w * .1, g.head * .8); ctx.lineTo(-w * .1, g.head + w * .55); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = th.edge; ctx.lineWidth = lw; ctx.lineJoin = 'round';
  outlinePath(ctx, g); ctx.stroke();
  ctx.fillStyle = th.edge; rrect(ctx, -w / 2 - lw * 1.15, -lw * 1.1, w + lw * 2.3, lw * 2, lw); ctx.fill();

}
function drawCork(ctx, w, lift){
  const cw = w * .8, ch = w * .6, y = -w * .36 - lift;
  const gr = ctx.createLinearGradient(-cw / 2, 0, cw / 2, 0);
  gr.addColorStop(0, '#DDAE78'); gr.addColorStop(.45, '#C68D57'); gr.addColorStop(1, '#94623A');
  ctx.fillStyle = gr; rrect(ctx, -cw / 2, y, cw, ch, w * .12); ctx.fill();
  ctx.fillStyle = 'rgba(255,236,200,.45)'; rrect(ctx, -cw / 2 + w * .06, y + w * .05, cw - w * .12, w * .1, w * .05); ctx.fill();
  ctx.fillStyle = 'rgba(90,50,20,.35)';
  for(const [dx, dy] of [[-.2, .3], [.12, .22], [.22, .42], [-.05, .45], [-.24, .5]]){
    ctx.beginPath(); ctx.arc(dx * w, y + dy * w, w * .025, 0, 7); ctx.fill();
  }
}

/* ==================== 4. sound ==================== */
function makeSfx(A){
  const penta = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28];
  const note = (base, semi) => base * Math.pow(2, semi / 12);
  return {
    pick(){ A.tone({ f: 1568, dur: .06, gain: .05, type: 'triangle' }); A.tone({ f: 480, f1: 860, dur: .1, gain: .13 }); },
    drop(){ A.tone({ f: 720, f1: 430, dur: .09, gain: .09 }); },
    bonk(){
      A.tone({ f: 190, f1: 105, dur: .18, gain: .22, type: 'square', filter: 'lowpass', ff: 650 });
      A.tone({ f: 2400, dur: .05, gain: .04, type: 'triangle' });
    },
    tink(){ A.tone({ f: 2093, dur: .14, gain: .07, type: 'triangle' }); A.tone({ f: 3136, dur: .1, gain: .03, type: 'triangle', at: .04 }); },
    // glugs: each bubble is a quick upward chirp, pitched by how full the
    // target is, so a vial audibly "fills up" as it would under a tap
    pour(n, fill0, startMs, durMs){
      const count = Math.max(3, Math.round(durMs / 58));
      for(let k = 0; k < count; k++){
        const frac = (fill0 + n * (k + .5) / count) / CAP;
        const f = 210 * Math.pow(2, frac * 1.45) * (.93 + Math.random() * .14);
        const at = (startMs + k * durMs / count + Math.random() * 16) / 1000;
        A.tone({ f, f1: f * 1.95, glide: .045, dur: .09, gain: .19 + Math.random() * .05, at, attack: .003 });
      }
      A.noise({ filter: 'lowpass', f: 700, f1: 1500, dur: durMs / 1000 + .1, gain: .045, at: startMs / 1000, attack: .06, rate: .55 });
    },
    plop(fill, at){ const f = 260 * Math.pow(2, fill / CAP); A.tone({ f, f1: f * .55, dur: .11, gain: .12, at }); },
    complete(k){
      A.noise({ f: 1700, dur: .05, gain: .3, q: 2.2 });           // cork squeak-pop
      A.tone({ f: 640, f1: 170, dur: .08, gain: .2 });
      const f = note(523.25, penta[Math.min(k, penta.length - 1)]);
      A.bell(f, .07, .15); A.bell(f * 2, .15, .06);
    },
    reveal(){ A.tone({ f: 990, f1: 1480, dur: .12, gain: .07, type: 'triangle' }); A.tone({ f: 1480, dur: .1, gain: .04, type: 'triangle', at: .06 }); },
    undo(){ A.noise({ f: 2600, f1: 480, dur: .22, gain: .12, q: 1.4 }); A.tone({ f: 700, f1: 420, dur: .14, gain: .06 }); },
    hint(){ [0, 4, 7, 12].forEach((s, i) => A.bell(note(880, s), i * .06, .07)); },
    vial(){ A.bell(1318.5, 0, .1); A.bell(1975.5, .08, .06); A.tone({ f: 280, f1: 900, dur: .28, gain: .07 }); },
    win(){
      [0, 4, 7, 12, 16, 19].forEach((s, i) => A.bell(note(523.25, s), i * .085, .15));
      A.noise({ filter: 'highpass', f: 5500, dur: .9, gain: .04, at: .4, attack: .1 });
      A.tone({ f: 130.8, f1: 131, dur: .9, gain: .12, type: 'triangle', at: .5 });
    },
    coin(i){
      A.tone({ f: 1318.5, dur: .06, gain: .05, type: 'square', at: i * .055, filter: 'lowpass', ff: 3800 });
      A.tone({ f: 1975.5, dur: .12, gain: .05, type: 'square', at: i * .055 + .05, filter: 'lowpass', ff: 3800 });
    },
    hard(tier){
      A.tone({ f: 140, f1: 48, dur: .4, gain: .4 }); A.noise({ filter: 'lowpass', f: 400, dur: .2, gain: .2 });
      A.tone({ f: 140, f1: 48, dur: .4, gain: .35, at: .22 }); A.noise({ filter: 'lowpass', f: 400, dur: .2, gain: .18, at: .22 });
      const chord = tier === 2 ? [0, 3, 6, 10] : [0, 3, 7];
      chord.forEach((s, i) => A.tone({ f: note(196, s), dur: 1.1, gain: .07, type: 'sawtooth', filter: 'lowpass', ff: 900, at: .44 + i * .02, attack: .08 }));
    }
  };
}

function mount(stage, api){
  const { h, sheet, closeSheet, toast, toggle } = api.ui;
  const A = api.audio, sfx = makeSfx(A), buzz = api.buzz;
  const S = api.save;
  if(!(S.level >= 1)) S.level = 1;
  if(!(S.coins >= 0)) S.coins = 120;
  S.inv = Object.assign({ hint: 3, vial: 2 }, S.inv);
  S.tips = S.tips || {};
  S.stats = Object.assign({ won: 0, hard: 0, super: 0 }, S.stats);
  if(S.symbols == null) S.symbols = false;

  const el = h('div', { class: 'ps', 'data-tier': '0' });
  el.innerHTML = TEMPLATE;
  stage.append(el);
  const ref = n => el.querySelector(`[data-ref="${n}"]`);
  const bind = (n, v) => el.querySelectorAll(`[data-bind="${n}"]`).forEach(x => { x.textContent = v; });
  const cv = ref('cv'), ctx = cv.getContext('2d'), field = ref('field'), floats = ref('floats');
  const artCv = ref('art'), coachEl = ref('coach'), stuckEl = ref('stuck');
  const FONT = getComputedStyle(document.documentElement).getPropertyValue('--f-disp').trim() || 'sans-serif';

  let view = 'lobby';
  let L = null;                  // the level being played
  let g = null;                  // vial geometry for the current layout
  let vs = [];                   // per-vial visual state
  let anims = [];                // pours in flight
  let parts = [];                // particles
  let sel = -1, kf = -1;         // selected vial, keyboard focus
  let hintMv = null;             // [from, to] from a hint or the tutorial
  let theme = readTheme(el);
  let W = 0, H = 0, dpr = 1, slotW = 0, raf = 0, lastT = 0;
  let art = null, artProg = [], artAnim = {};
  let stuckShown = false, won = false;
  const timers = new Set();
  const later = (fn, ms) => { const id = setTimeout(() => { timers.delete(id); fn(); }, ms); timers.add(id); return id; };
  const cache = new Map();
  const levelData = n => { if(!cache.has(n)) cache.set(n, generate(n)); return cache.get(n); };

  /* ---------- level state ---------- */
  function freshLevel(n){
    const gd = levelData(n), colorOf = [], vials = [], rev = [];
    gd.vials.forEach((v, vi) => {
      const ids = [];
      v.forEach((c, ui) => { const id = colorOf.length; colorOf.push(gd.palette[c]); ids.push(id); if(!gd.hidden[vi][ui]) rev.push(id); });
      vials.push(ids);
    });
    return { n, colorOf, palette: gd.palette.slice(), vials, rev, init: vials.map(v => v.slice()), rev0: rev.slice(),
      hist: [], undos: UNDOS_PER_TRY, moves: 0, extra: false, help: false };
  }
  function hydrate(cur){
    L = Object.assign({}, cur);
    L.sp = spec(cur.n);
    L.revSet = new Set(cur.rev);
    L.won = false;
    art = buildArt(cur.n, L.palette.length);
    artProg = L.palette.map(() => 0); artAnim = {};
    L.doneSet = new Set();
    refreshDone(true);
  }
  function persist(){
    if(L && !L.won){
      S.cur = { n: L.n, colorOf: L.colorOf, palette: L.palette, vials: L.vials, rev: [...L.revSet], init: L.init,
        rev0: L.rev0, hist: L.hist, undos: L.undos, moves: L.moves, extra: L.extra, help: L.help };
    }
    api.persist();
  }
  const col = id => L.colorOf[id];
  const colors = () => L.vials.map(v => v.map(col));
  function vialFull(i){ const v = L.vials[i]; return v.length === CAP && v.every(id => col(id) === col(v[0])); }
  function topRun(i){ const v = L.vials[i]; if(!v.length) return 0; const c = col(v[v.length - 1]); let k = 0; for(let x = v.length - 1; x >= 0 && col(v[x]) === c; x--) k++; return k; }
  function canPour(i, j){
    if(i === j) return false;
    const a = L.vials[i], b = L.vials[j];
    if(!a.length || vialFull(i) || b.length >= CAP) return false;
    return !b.length || col(b[b.length - 1]) === col(a[a.length - 1]);
  }
  function revealTops(){
    const fresh = [];
    L.vials.forEach((v, i) => {
      const k = topRun(i);
      for(let x = v.length - k; x < v.length; x++) if(!L.revSet.has(v[x])){ L.revSet.add(v[x]); fresh.push({ i, id: v[x] }); }
    });
    return fresh;
  }
  function bandsOf(i){
    const out = [];
    for(const id of L.vials[i]){
      const hid = !L.revSet.has(id), c = col(id), last = out[out.length - 1];
      if(last && !hid && !last.hid && last.c === c) last.u++;
      else if(last && hid && last.hid) last.u++;
      else out.push({ c, u: 1, hid });
    }
    return out;
  }
  // which pigments currently sit in a finished vial; paints/unpaints the picture to match
  function refreshDone(instant){
    const done = new Set();
    L.vials.forEach((v, i) => { if(vialFull(i)) done.add(col(v[0])); });
    L.palette.forEach((pig, slot) => {
      if(done.has(pig) && !L.doneSet.has(pig)){ if(instant) artProg[slot] = 1; else artAnim[slot] = now() + 120; }
      if(!done.has(pig)){ artProg[slot] = 0; delete artAnim[slot]; }
    });
    L.doneSet = done;
    renderDots();
    drawEasel();
  }

  /* ---------- layout ---------- */
  function layout(){
    const r = field.getBoundingClientRect();
    W = r.width; H = r.height; dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.max(1, Math.round(W * dpr)); cv.height = Math.max(1, Math.round(H * dpr));
    if(!L) return;
    const count = L.vials.length;
    const rows = count <= 6 || (W > 540 && count <= 8) ? 1 : 2;
    const perRow = Math.ceil(count / rows);
    slotW = (W - 16) / perRow;
    const byW = slotW * (rows === 1 ? .66 : .62);
    const byH = (H - 12) / (rows * 3.95 + (rows - 1) * 1.2 + 1.6);
    const w = Math.max(14, Math.min(60, byW, byH));
    if(!g || Math.abs(g.w - w) > .5) g = makeGeom(w);
    const vialH = g.H + w * .1, gap = w * 1.2, used = rows * vialH + (rows - 1) * gap + w * 1.6;
    const top = Math.max(0, (H - used) / 2) + w * 1.25;
    const counts = rows === 1 ? [count] : [Math.ceil(count / 2), Math.floor(count / 2)];
    let idx = 0;
    counts.forEach((cnt, row) => {
      for(let k = 0; k < cnt; k++, idx++){
