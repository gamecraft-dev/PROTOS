<style>
/* ---------- Paint Sort: a painter's studio wall, glass vials, a small framed canvas ---------- */
:root{
  --ps-wall-a:#EEF3F9; --ps-wall-b:#D3DDEA;
  --ps-hard-a:#FCECE9; --ps-hard-b:#F1C5C0;
  --ps-super-a:#F3EAFD; --ps-super-b:#D8C3F3;
  --ps-glass:rgba(214,227,243,.6);
  --ps-edge:rgba(48,64,100,.62);
  --ps-hi:rgba(255,255,255,.9);
  --ps-floor:rgba(30,44,80,.16);
  --ps-primer:#7A8294;
  --ps-frame:#8A5B36; --ps-frame-2:#5C3A20;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ps-wall-a:#1B2442; --ps-wall-b:#0B0F1C;
    --ps-hard-a:#3B1620; --ps-hard-b:#15080D;
    --ps-super-a:#2C1A4B; --ps-super-b:#110A21;
    --ps-glass:rgba(160,186,232,.10);
    --ps-edge:rgba(198,216,250,.62);
    --ps-hi:rgba(255,255,255,.5);
    --ps-floor:rgba(0,0,0,.4);
    --ps-primer:#5F677B;
    --ps-frame:#8F633F; --ps-frame-2:#4C301B;
  }
}
:root[data-theme="dark"]{
  --ps-wall-a:#1B2442; --ps-wall-b:#0B0F1C;
  --ps-hard-a:#3B1620; --ps-hard-b:#15080D;
  --ps-super-a:#2C1A4B; --ps-super-b:#110A21;
  --ps-glass:rgba(160,186,232,.10);
  --ps-edge:rgba(198,216,250,.62);
  --ps-hi:rgba(255,255,255,.5);
  --ps-floor:rgba(0,0,0,.4);
  --ps-primer:#5F677B;
  --ps-frame:#8F633F; --ps-frame-2:#4C301B;
}
.ps{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;color:var(--ink);
  background:linear-gradient(180deg,var(--ps-wall-a),var(--ps-wall-b))}
.ps[data-tier="1"]{background:linear-gradient(180deg,var(--ps-hard-a),var(--ps-hard-b))}
.ps[data-tier="2"]{background:linear-gradient(180deg,var(--ps-super-a),var(--ps-super-b))}
.ps-lobby,.ps-play{position:absolute;inset:0;display:flex;flex-direction:column}
.ps-bar{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 6px;flex:0 0 auto}
.ps-spacer{flex:1}
.ps-lvl{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.ps-lvl>span:first-child{font-family:var(--f-disp);font-size:24px;line-height:1;white-space:nowrap}
.ps-tier{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;line-height:1;
  padding:4px 7px;border-radius:999px;background:var(--hard);white-space:nowrap}
.ps-tier[data-tier="2"]{background:var(--super)}

/* the easel */
.ps-easel{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 16px 0;flex:0 0 auto}
.ps-frame{position:relative;height:clamp(76px,15.5dvh,142px);aspect-ratio:4/3;max-width:100%;padding:5px;border-radius:5px;
  background:linear-gradient(145deg,var(--ps-frame),var(--ps-frame-2));
  box-shadow:0 12px 22px -12px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.25)}
.ps-frame canvas{display:block;width:100%;height:100%;border-radius:1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.ps-dots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:100%}
.ps-dots i{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--c),0 0 0 1px var(--ps-edge);transition:background .3s,transform .3s}
.ps-dots i.on{background:var(--c);transform:scale(1.15)}
.ps-dots i.blank{box-shadow:inset 0 0 0 2px var(--dim);opacity:.6}
.ps-coach{min-height:40px;display:flex;align-items:center;justify-content:center;text-align:center;
  font-weight:700;color:var(--muted);font-size:14.5px;line-height:1.35;padding:2px 24px;flex:0 0 auto;text-wrap:balance}

/* the vials */
.ps-field{position:relative;flex:1;min-height:0}
.ps-field canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation;outline:none}
.ps-floats{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ps-float{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-disp);font-size:17px;white-space:nowrap;
  color:var(--c);-webkit-text-stroke:5px var(--surface);paint-order:stroke fill;animation:psFloat 1.5s ease-out forwards}
@keyframes psFloat{0%{opacity:0;transform:translate(-50%,-10%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.08)}
  75%{opacity:1;transform:translate(-50%,-120%) scale(1)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}

.ps-stuck{display:flex;align-items:center;gap:8px;margin:0 12px 6px;padding:8px 8px 8px 14px;border-radius:16px;flex:0 0 auto;
  background:var(--surface);box-shadow:var(--shadow);animation:psRise .3s cubic-bezier(.2,.9,.25,1)}
.ps-stuck-t{flex:1;font-weight:800;font-size:14px;color:var(--bad);line-height:1.2}
.ps-stuck .btn{padding:9px 11px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--line)}
@keyframes psRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.ps-tools{display:flex;justify-content:space-around;gap:6px;padding:6px 12px calc(12px + env(safe-area-inset-bottom,0px));flex:0 0 auto}
.ps-tool{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;width:72px}
.ps-tool .ic{width:56px;height:56px;border-radius:19px;background:var(--surface);color:var(--ink);display:grid;place-items:center;
  box-shadow:0 4px 0 var(--line);transition:transform .1s,box-shadow .1s}
.ps-tool .ic svg{width:27px;height:27px}
.ps-tool:active .ic{transform:translateY(4px);box-shadow:none}
.ps-tool .lb{font-size:12px;font-weight:800;color:var(--muted)}
.ps-tool .n{position:absolute;top:-5px;right:2px;min-width:23px;height:23px;padding:0 6px;border-radius:999px;display:grid;place-items:center;
  background:var(--accent);color:var(--accent-ink);font-size:12.5px;font-weight:800;box-shadow:0 0 0 2.5px var(--ps-wall-a);font-variant-numeric:tabular-nums}
.ps-tool .n.buy{background:var(--coin);color:#4A3000}
.ps-tool.used .ic{opacity:.45}
.ps-tool.used .n{display:none}

/* hard level intro */
.ps-intro{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:24px;cursor:pointer;
  background:repeating-linear-gradient(-45deg,rgba(0,0,0,.05) 0 18px,transparent 18px 36px),color-mix(in srgb,var(--hard) 88%,black)}
.ps-intro[data-tier="2"]{background:repeating-linear-gradient(-45deg,rgba(0,0,0,.07) 0 18px,transparent 18px 36px),color-mix(in srgb,var(--super) 85%,black)}
.ps-intro.on{animation:psIntro 2.1s ease forwards}
@keyframes psIntro{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0}}
.ps-intro-card{text-align:center;color:#fff;animation:psSlam .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes psSlam{0%{transform:scale(2.2) rotate(-6deg);opacity:0}60%{opacity:1}100%{transform:none}}
.ps-intro-k{font-family:var(--f-disp);font-size:clamp(40px,12vw,56px);line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.ps-intro-n{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:13px;margin-top:10px;opacity:.85}
.ps-intro-s{font-size:16px;font-weight:600;margin-top:14px;opacity:.95}

/* lobby */
.ps-lobby-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:18px;
  padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.ps-word{font-family:var(--f-disp);font-weight:400;font-size:clamp(40px,12.5vw,54px);line-height:.95;margin:4px 0 0;letter-spacing:.005em}
.ps-word-sort i{font-style:normal;color:var(--c);text-shadow:0 3px 0 color-mix(in srgb,var(--c) 60%,black)}
.ps-next{display:flex;align-items:center;gap:16px;padding:14px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow)}
.ps-frame-next{height:auto;width:44%;flex:0 0 auto}
.ps-next-meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.ps-next-eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.ps-next-eyebrow[data-tier="1"]{color:var(--hard)}

<script>
/* ==========================================================
   PAINT SORT — pour paint between vials until each holds one colour.
   0 engine (pure, headless-testable) · 1 pigments · 2 painting
   3 geometry · 4 audio · 5 game · 6 lobby · 7 register
   ========================================================== */
(function(){
'use strict';

// @engine-start ------------------------------------------------------------
// Everything between the engine markers is pure: no DOM, no Playbox. The
// balance probe (tools/probe.mjs) evaluates this slice on its own in Node.

const CAP = 4;                                  // units of paint per vial

function rng32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seedFor(n, salt){
  let h = (0x9E3779B9 ^ Math.imul(n | 0, 0x85EBCA6B) ^ Math.imul((salt | 0) + 1, 0xC2B2AE35)) >>> 0;
  h ^= h >>> 16; h = Math.imul(h, 0x7FEB352D);
  h ^= h >>> 15; h = Math.imul(h, 0x846CA68B);
  h ^= h >>> 16; return h >>> 0;
}
function shuffle(a, r){
  for(let i = a.length - 1; i > 0; i--){ const j = (r() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

/* ---- difficulty ----
   A level's difficulty is one number, its heat h. The whole part sets the
   colours (3 + h), the fraction picks which of the generated candidates to
   keep (0 = the most forgiving, 1 = the most punishing), so difficulty rises
   smoothly with h. Which heat a level gets is the adaptive model's call
   (Playbox.skill, in the shell): it aims each slot of a block of ten at a
   target win rate for this player, so the 5th level (hard) and the 10th
   (super hard) still spike, relative to how well this player plays.
   baseHeat(n) is the sawtooth a typical new player starts on, and the heat
   used when no model is given (the probe, tests): inside a block it climbs,
   spikes at the 5th, drops back, climbs and spikes harder at the 10th, and
   each block starts a notch above the last. */
const RAMP = [0, .45, .9, 1.35, 2.5, .6, 1.05, 1.5, 1.95, 3.6];
const BLOCK_STEP = 1.15;                        // heat added per block of ten
const MAX_COLOURS = 12;
const HEAT_MAX = MAX_COLOURS - 2;               // 12 colours, most punishing candidate
const BASE_BLOCKS = 4;                          // the typical curve stops climbing after this many blocks
const blockOf = n => Math.min(BASE_BLOCKS, Math.floor((Math.max(1, n | 0) - 1) / 10));
const baseHeat = n => { n = Math.max(1, n | 0); return blockOf(n) * BLOCK_STEP + RAMP[(n - 1) % 10]; };
// how far the model may move a level: never below 2.5 under the start of its
// block of ten (so later levels never fall all the way back to the first ones),
// never above 4 over the block's hardest level
function heatRange(n){
  const start = blockOf(n) * BLOCK_STEP;
  return [Math.max(0, start - 2.5), Math.min(HEAT_MAX, start + RAMP[9] + 4)];
}

function spec(n, h){
  n = Math.max(1, n | 0);
  const block = Math.floor((n - 1) / 10), pos = (n - 1) % 10;
  const tier = pos === 9 ? 2 : pos === 4 ? 1 : 0;           // 0 normal · 1 hard · 2 super hard
  const heat = n === 1 ? 0 : Math.min(HEAT_MAX, Math.max(0, h == null ? baseHeat(n) : +h));
  const K = Math.min(MAX_COLOURS, 3 + Math.floor(heat));
  // hidden layers start at level 13: on the spikes and two ramp levels per
  // block, and from level 61 on every ramp level except the breathers
  const mysteryOn = n >= 13 && (tier > 0 || pos === 2 || pos === 7 || (block >= 6 && pos !== 0 && pos !== 5));
  const mystery = mysteryOn ? Math.min(.7, .3 + block * .04 + tier * .12) : 0;
  return {
    n, block, pos, tier, heat, K, E: 2, cap: CAP, mystery,
    pick: K === MAX_COLOURS ? Math.min(1, heat - (MAX_COLOURS - 3)) : heat - Math.floor(heat),
    cands: tier === 2 ? 10 : tier === 1 ? 8 : 5,
    reward: tier === 2 ? 60 : tier === 1 ? 30 : 10
  };
}

/* ---- rules ---- */
function isFull(v, C){
  if(v.length !== C) return false;
  for(let i = 1; i < C; i++) if(v[i] !== v[0]) return false;
  return true;
}
function isSolved(s, C){
  for(const v of s) if(v.length && !isFull(v, C)) return false;
  return true;
}
function runLen(v){
  const c = v[v.length - 1]; let k = 1;
  for(let i = v.length - 2; i >= 0 && v[i] === c; i--) k++;
  return k;
}
// Moves worth considering. Skips pouring a single-colour vial into an empty
// one (it changes nothing) and, with `prune`, tries only the first empty vial.
function listMoves(s, C, prune){
  const out = [];
  for(let i = 0; i < s.length; i++){
    const v = s[i];
    if(!v.length || isFull(v, C)) continue;
    const c = v[v.length - 1], k = runLen(v), whole = k === v.length;
    let emptySeen = false;
    for(let j = 0; j < s.length; j++){
      if(j === i) continue;
      const w = s[j];
      if(w.length >= C) continue;
      if(!w.length){
        if(whole) continue;
        if(prune){ if(emptySeen) continue; emptySeen = true; }
      } else if(w[w.length - 1] !== c) continue;
      out.push([i, j, Math.min(k, C - w.length)]);
    }
  }
  return out;
}
function applyMove(s, m){
  const [i, j, n] = m, ns = s.slice(), c = s[i][s[i].length - 1];
  ns[i] = s[i].slice(0, s[i].length - n);
  ns[j] = s[j].slice();
  for(let k = 0; k < n; k++) ns[j].push(c);
  return ns;
}
// runs of colour minus distinct colours: 0 exactly when solved
function heur(s){
  let segs = 0; const seen = new Set();
  for(const v of s){
    let prev = -1;
    for(const c of v){ if(c !== prev){ segs++; seen.add(c); prev = c; } }
  }
  return segs - seen.size;
}
function keyOf(s){
  const parts = new Array(s.length);
  for(let i = 0; i < s.length; i++){
    let t = ''; for(const c of s[i]) t += String.fromCharCode(97 + c);
    parts[i] = t;
  }
  parts.sort();
  return parts.join('|');
}

/* weighted A*. Returns {ok, path, nodes, exhausted}. `exhausted` with ok=false
   means the position is proven dead; without it the budget simply ran out. */
function solve(start, C, budget, weight){
  budget = budget || 40000; weight = weight || 2.5;
  const s0 = start.map(v => v.slice());
  if(isSolved(s0, C)) return { ok: true, path: [], nodes: 0, exhausted: true };
  const heap = [], seen = new Set([keyOf(s0)]);
  const push = node => {
    heap.push(node); let i = heap.length - 1;
    while(i > 0){ const p = (i - 1) >> 1; if(heap[p].f <= node.f) break; heap[i] = heap[p]; i = p; }
    heap[i] = node;
  };
  const pop = () => {
    const top = heap[0], last = heap.pop();
    if(heap.length){
      let i = 0; const n = heap.length;
      for(;;){
        let l = 2 * i + 1, r = l + 1, m = i;
        if(l < n && heap[l].f < (m === i ? last.f : heap[m].f)) m = l;
        if(r < n && heap[r].f < (m === i ? last.f : heap[m].f)) m = r;
        if(m === i) break;
        heap[i] = heap[m]; i = m;
      }
      heap[i] = last;
    }
    return top;
  };
  push({ s: s0, g: 0, f: weight * heur(s0), parent: null, mv: null });
  let nodes = 0;
  while(heap.length){
    const cur = pop();
    if(++nodes > budget) return { ok: false, path: null, nodes, exhausted: false };
    const moves = listMoves(cur.s, C, true);
    for(const m of moves){
      const ns = applyMove(cur.s, m), k = keyOf(ns);
      if(seen.has(k)) continue;
      seen.add(k);
      const node = { s: ns, g: cur.g + 1, f: 0, parent: cur, mv: m };
      if(isSolved(ns, C)){
        const path = [];
        for(let x = node; x.parent; x = x.parent) path.push(x.mv);
        return { ok: true, path: path.reverse(), nodes, exhausted: true };
      }
      node.f = node.g + weight * heur(ns);
      push(node);
    }
  }
  return { ok: false, path: null, nodes, exhausted: true };
}

/* a casual player with no lookahead: always takes a pour that finishes a
   vial, usually stacks onto matching paint, otherwise pours at random, and
   never immediately undoes its last pour. Returns moves used, or -1 if it got
   stuck or wandered too long. How often this player fails is the level's
   measured difficulty. */
function playout(start, C, r, maxSteps){
  let s = start.map(v => v.slice()), li = -1, lj = -1;
  for(let step = 0; step < maxSteps; step++){
    if(isSolved(s, C)) return step;
    const ms = listMoves(s, C, false).filter(m => !(m[0] === lj && m[1] === li));
    if(!ms.length) return -1;
    let m = null;
    for(const x of ms){
      const w = s[x[1]];
      if(w.length + x[2] === C && (w.length === 0 ? runLen(s[x[0]]) === C : runLen(w) === w.length)){ m = x; break; }
    }
    if(!m){
      const onto = ms.filter(x => s[x[1]].length > 0);
      m = (onto.length && r() < .8) ? onto[(r() * onto.length) | 0] : ms[(r() * ms.length) | 0];
    }
    s = applyMove(s, m); li = m[0]; lj = m[1];
  }
  return -1;
}
/* one-move-deep judgement of a pour: finish a vial, stack a whole run onto
   its match, don't spend empty vials, uncover paint that has somewhere to go */
function rateMove(s, C, x){
  const v = s[x[0]], w = s[x[1]], k = runLen(v);
  let sc = 0;
  if(w.length){
    sc += 2;
    if(x[2] === k) sc += 1;                                    // whole run moves, nothing split
    if(runLen(w) === w.length && w.length + x[2] === C) sc += 3;
  } else {
    sc -= 1.5;
    if(k === v.length) sc -= 3;
  }
  if(x[2] === k && v.length > k){
    const under = v[v.length - k - 1];
    for(let j = 0; j < s.length; j++){
      if(j === x[0] || j === x[1]) continue;
      const u = s[j];
      if(u.length && u.length < C && u[u.length - 1] === under){ sc += .8; break; }
    }
  }
  return sc;
}
/* a steadier player: takes the best-rated pour with a little noise. It keeps
   separating boards after the casual player has stopped winning any. */
function playoutSkilled(start, C, r, maxSteps){
  let s = start.map(v => v.slice()), li = -1, lj = -1;
  for(let step = 0; step < maxSteps; step++){
    if(isSolved(s, C)) return step;
    const ms = listMoves(s, C, false).filter(m => !(m[0] === lj && m[1] === li));
    if(!ms.length) return -1;
    let best = null, bestScore = -1e9;
    for(const x of ms){
      const sc = rateMove(s, C, x) + r() * 1.6;
      if(sc > bestScore){ bestScore = sc; best = x; }
    }
    s = applyMove(s, best); li = best[0]; lj = best[1];
  }
  return -1;
}

function deal(K, E, C, r){
  const pool = [];
  for(let c = 0; c < K; c++) for(let u = 0; u < C; u++) pool.push(c);
  let s = null;
  for(let tries = 0; tries < 60; tries++){
    shuffle(pool, r);
    s = [];
    for(let i = 0; i < K; i++) s.push(pool.slice(i * C, i * C + C));
    if(s.some(v => isFull(v, C))) continue;
    let pairs = 0;
    for(const v of s) for(let i = 1; i < C; i++) if(v[i] === v[i - 1]) pairs++;
    if(pairs > Math.max(1, Math.floor(K * .5))) continue;
    break;
  }
  for(let e = 0; e < E; e++) s.push([]);
  return s;
}

/* Build level n. Deterministic: the same n always yields the same board, on
   every device, so a restart or a reinstall replays the same puzzle. */
function generate(n, h){
  const sp = spec(n, h), C = sp.cap;
  const r = rng32(seedFor(n, 7 + Math.round(sp.heat * 20)));
  const cands = [];
  let attempts = 0;
  while(cands.length < sp.cands && attempts < sp.cands * 6){
    attempts++;
    const s = deal(sp.K, sp.E, C, r);
    const sol = solve(s, C, 25000);
    if(!sol.ok) continue;
    const R = sp.tier ? 20 : 14, pr = rng32(seedFor(n, 100 + attempts)), steps = 60 + sp.K * 14;
    let casual = 0, skilled = 0;
    for(let i = 0; i < R; i++){
      if(playout(s, C, pr, steps) < 0) casual++;
      if(playoutSkilled(s, C, pr, steps) < 0) skilled++;
    }
    cands.push({ s, casual: casual / R, skilled: skilled / R, fail: (casual + skilled) / (2 * R), len: sol.path.length });
  }
  while(!cands.length){                        // practically unreachable; keeps generate() total
    const s = deal(sp.K, sp.E, C, r), sol = solve(s, C, 300000);
    if(sol.ok) cands.push({ s, casual: 0, skilled: 0, fail: 0, len: sol.path.length });
  }
  cands.sort((a, b) => a.fail - b.fail || a.len - b.len);
  const pick = cands[Math.round(sp.pick * (cands.length - 1))];

  const pr = rng32(seedFor(n, 3));
  const palette = shuffle([...Array(MAX_COLOURS).keys()], pr).slice(0, sp.K);
  const hidden = pick.s.map(v => {
    const keep = v.length ? runLen(v) : 0;
    return v.map((_, i) => sp.mystery > 0 && i < v.length - keep && pr() < sp.mystery);
  });
  return { spec: sp, vials: pick.s, palette, hidden, fail: pick.fail, casual: pick.casual,
    skilled: pick.skilled, len: pick.len, pool: cands.length };
}

function probe(from, to){
  const rows = [];
  for(let n = from; n <= to; n++){
    const t0 = Date.now(), g = generate(n);
    const hid = g.hidden.reduce((a, v) => a + v.filter(Boolean).length, 0);
    rows.push({ n, tier: g.spec.tier, K: g.spec.K, heat: +g.spec.heat.toFixed(2),
      fail: +g.fail.toFixed(2), casual: +g.casual.toFixed(2), skilled: +g.skilled.toFixed(2),
      len: g.len, hidden: hid, pool: g.pool, ms: Date.now() - t0 });
  }
  return rows;
}
// @engine-end --------------------------------------------------------------

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOutSine = t => -(Math.cos(Math.PI * t) - 1) / 2;
const easeInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutBack = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function easeOutBounce(t){
  const n = 7.5625, d = 2.75;
  if(t < 1 / d) return n * t * t;
  if(t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
  if(t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375;
  return n * (t -= 2.625 / d) * t + .984375;
}
const now = () => performance.now();

/* ==================== 1. pigments ==================== */
// Real artists' pigments. The name shows when a vial of it is finished.
const PIGMENTS = [
  { name: 'Cadmium Red',       hex: '#E23A3F' },
  { name: 'Cadmium Orange',    hex: '#F5862B' },
  { name: 'Hansa Yellow',      hex: '#F7CF36' },
  { name: 'Sap Green',         hex: '#45A646' },
  { name: 'Viridian',          hex: '#10A08F' },
  { name: 'Cerulean',          hex: '#3AAEEA' },
  { name: 'Ultramarine',       hex: '#3448D0' },
  { name: 'Dioxazine Violet',  hex: '#7D44CF' },
  { name: 'Quinacridone Rose', hex: '#E0489B' },
  { name: 'Burnt Sienna',      hex: '#9A5431' },
  { name: 'Titanium White',    hex: '#F3F1EA' },
  { name: "Payne's Grey",      hex: '#343B4D' }
];
function rgbOf(hex){ const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(hex, amt){                      // amt > 0 toward white, < 0 toward black
  const c = rgbOf(hex), t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  return `rgb(${c.map(x => Math.round(x + (t - x) * p)).join(',')})`;
}
for(const p of PIGMENTS){
  const [r, g, b] = rgbOf(p.hex);
  p.light = mix(p.hex, .32); p.dark = mix(p.hex, -.28);
  p.ink = (r * .299 + g * .587 + b * .114) > 150 ? 'rgba(30,30,40,.72)' : 'rgba(255,255,255,.9)';
}
// colour-blind symbols, one per pigment
function glyph(ctx, k, x, y, s){
  ctx.beginPath();
  const star = (pts, ro, ri) => {
    for(let i = 0; i < pts * 2; i++){
      const a = -Math.PI / 2 + i * Math.PI / pts, rr = i % 2 ? ri : ro;
      i ? ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
  };
  switch(k){
    case 0: ctx.arc(x, y, s * .46, 0, 7); break;
    case 1: ctx.moveTo(x, y - s * .55); ctx.lineTo(x + s * .55, y + s * .42); ctx.lineTo(x - s * .55, y + s * .42); ctx.closePath(); break;
    case 2: ctx.rect(x - s * .4, y - s * .4, s * .8, s * .8); break;
    case 3: ctx.moveTo(x, y - s * .6); ctx.lineTo(x + s * .48, y); ctx.lineTo(x, y + s * .6); ctx.lineTo(x - s * .48, y); ctx.closePath(); break;
    case 4: star(5, s * .6, s * .26); break;
    case 5: ctx.rect(x - s * .16, y - s * .55, s * .32, s * 1.1); ctx.rect(x - s * .55, y - s * .16, s * 1.1, s * .32); break;
    case 6: star(4, s * .62, s * .18); break;
    case 7: star(6, s * .55, s * .48); break;
    case 8: ctx.arc(x, y, s * .5, 0, 7); ctx.arc(x, y, s * .26, 0, 7, true); break;
    case 9: ctx.rect(x - s * .55, y - s * .16, s * 1.1, s * .32); break;
    case 10: ctx.arc(x - s * .3, y, s * .22, 0, 7); ctx.moveTo(x + s * .52, y); ctx.arc(x + s * .3, y, s * .22, 0, 7); break;
    default: ctx.arc(x, y, s * .5, Math.PI, 0); ctx.closePath();
  }
  ctx.fill('evenodd');
}

/* ==================== 2. painting ==================== */
// Every level comes with an abstract picture, one shape per pigment. It starts
// as a pencil underdrawing; each finished vial brushes its colour in.
const ART_W = 400, ART_H = 300;
function makeShape(kind, R){
  const p = new Path2D();

      return [p, bbOf(pts)];

    case 'dots': {
      const cx = R(70, 330), cy = R(60, 230), cnt = 5 + ((R(0, 4)) | 0), pts = [];
      for(let i = 0; i < cnt; i++){
        const a = R(0, 6.3), d = R(0, 46), rr = R(6, 12), x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d;

      const cx = R(80, 320), cy = R(70, 220), n = 9, pts = [];

}
function buildArt(n, K){
  const r = rng32(seedFor(n, 11)), R = (a, b) => a + r() * (b - a);
  const ground = new Path2D(); ground.rect(0, 0, ART_W, ART_H);
  const shapes = [{ path: ground, bb: [0, 0, ART_W, ART_H], rule: 'nonzero', ground: true }];
  const big = shuffle(['hill', 'arch', 'stripe', 'block', 'peak', 'wave'], r);
  const small = shuffle(['sun', 'ring', 'leaf', 'dots', 'blob', 'sun2'], r);
  const nBig = Math.min(K - 1, 1 + Math.floor((K - 1) * .45));
  const kinds = [];
  for(let i = 0; i < nBig; i++) kinds.push(big[i % big.length]);
  for(let i = 0; kinds.length < K - 1; i++) kinds.push(small[i % small.length]);
  for(const k of kinds){ const [path, bb, rule] = makeShape(k, R); shapes.push({ path, bb, rule: rule || 'nonzero' }); }
  const slots = shuffle([...Array(K).keys()], r);
  shapes.forEach((s, i) => {
    s.slot = slots[i];
    s.streaks = [];
    for(let k = 0; k < 10; k++) s.streaks.push([r(), r(), R(.35, .9), R(1.2, 3.4), r() < .5]);
  });

}
let toothCanvas = null;
function tooth(ctx){
  if(!toothCanvas){
    toothCanvas = document.createElement('canvas'); toothCanvas.width = toothCanvas.height = 8;
    const t = toothCanvas.getContext('2d');
    t.fillStyle = 'rgba(90,80,60,.07)';
    t.fillRect(0, 0, 8, 1); t.fillRect(0, 4, 8, 1); t.fillRect(2, 0, 1, 8); t.fillRect(6, 0, 1, 8);

function brushIn(ctx, s, hex, p){
  const [x, y, w, h] = s.bb, N = Math.max(2, Math.min(7, Math.round(h / 34)));

  ctx.lineCap = 'round'; ctx.strokeStyle = hex; ctx.lineWidth = band * 1.4 + 6;
  for(let i = 0; i < N; i++){

    if(q <= 0) continue;

    const x0 = ltr ? x - 14 : x + w + 14, x1 = x0 + (ltr ? 1 : -1) * (w + 28) * e;
    ctx.beginPath(); ctx.moveTo(x0, yy); ctx.quadraticCurveTo((x0 + x1) / 2, yy + (ltr ? -5 : 5), x1, yy); ctx.stroke();

/* prog[slot]: 0 = pencil only, 1 = fully painted */
function drawArt(ctx, cw, ch, art, palette, prog){
  ctx.save();

  ctx.fillStyle = '#F3F0E8'; ctx.fillRect(0, 0, ART_W, ART_H);
  ctx.fillStyle = tooth(ctx); ctx.fillRect(0, 0, ART_W, ART_H);
  for(const s of art){
    const p = prog[s.slot] || 0;
    if(p <= 0) continue;
    const pig = PIGMENTS[palette[s.slot]];
    ctx.save(); ctx.clip(s.path, s.rule);
    if(p >= 1){ ctx.fillStyle = pig.hex; ctx.fillRect(s.bb[0] - 2, s.bb[1] - 2, s.bb[2] + 4, s.bb[3] + 4); }
    else brushIn(ctx, s, pig.hex, p);
    // dry-brush streaks give the flat fill some texture
    ctx.lineCap = 'round';
    for(const [u, v, len, lw, light] of s.streaks){
      const [x, y, w, h] = s.bb, sx = x + u * w * .7, sy = y + v * h;
      ctx.strokeStyle = light ? pig.light : pig.dark;
      ctx.globalAlpha = .28 * Math.min(1, p * 1.2); ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + len * w * .5, sy + (v - .5) * 3); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

  ctx.lineJoin = 'round';

    const p = prog[s.slot] || 0;
    if(p >= 1 || s.ground) continue;
    ctx.globalAlpha = .55 * (1 - p); ctx.strokeStyle = '#5F6474'; ctx.lineWidth = 1.5;

function paintCanvas(cv, art, palette, prog){
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const w = Math.max(1, cv.clientWidth), h = Math.max(1, cv.clientHeight);
  if(cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)){ cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawArt(ctx, w, h, art, palette, prog);

/* ==================== 3. vial geometry ==================== */
/* A vial is a tube with a round bottom, drawn in local coordinates with the
   mouth centre at (0,0) and y pointing down. Liquid is drawn in world space
   with a flat surface, so when a vial tilts the paint stays level and slides
   toward the lip, as it would in a real glass. Volumes are areas. */
function areaBelow(p, Y){
  const out = [], n = p.length / 2;
  for(let i = 0; i < n; i++){
    const ax = p[2 * i], ay = p[2 * i + 1], j = (i + 1) % n, bx = p[2 * j], by = p[2 * j + 1];
    const ain = ay >= Y, bin = by >= Y;
    if(ain) out.push(ax, ay);
    if(ain !== bin){ const t = (Y - ay) / (by - ay); out.push(ax + (bx - ax) * t, Y); }
  }
  let s = 0; const m = out.length / 2;
  for(let i = 0; i < m; i++){ const j = (i + 1) % m; s += out[2 * i] * out[2 * j + 1] - out[2 * j] * out[2 * i + 1]; }
  return Math.abs(s) / 2;
}
function levelFor(p, V, lo, hi){                 // surface height holding volume V
  for(let k = 0; k < 22; k++){ const mid = (lo + hi) / 2; if(areaBelow(p, mid) > V) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}
function makeGeom(w){
  const r = w / 2, head = w * .5, unitH = w * .8;
  const H = head + r + (CAP * w * unitH - Math.PI * r * r / 2) / w;
  const pts = [-w / 2, 0, w / 2, 0, w / 2, H - r];
  const N = 16;
  for(let k = 1; k < N; k++){ const a = k / N * Math.PI; pts.push(r * Math.cos(a), H - r + r * Math.sin(a)); }
  pts.push(-w / 2, H - r);

  const table = [];
  for(let d = 0; d <= 125; d++){
    const a = d * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a), q = [];
    for(let i = 0; i < pts.length; i += 2){ const x = pts[i] - w / 2, y = pts[i + 1]; q.push(x * ca - y * sa, x * sa + y * ca); }
    table.push(areaBelow(q, 0));
  }
  return { w, r, head, H, unitA: w * unitH, pts, table };
}
function capAt(g, ang){
  const d = Math.abs(ang) * 180 / Math.PI;
  if(d >= 125) return 0;
  const i = Math.floor(d), f = d - i;
  return g.table[i] * (1 - f) + g.table[i + 1] * f;
}
function angleFor(g, V){
  const t = g.table;
  if(V >= t[0]) return 0;
  for(let d = 0; d < t.length - 1; d++){
    if(t[d + 1] <= V){ const f = (t[d] - V) / (t[d] - t[d + 1] || 1); return (d + f) * Math.PI / 180; }
  }
  return 125 * Math.PI / 180;
}
function worldPoly(g, ps){
  const ca = Math.cos(ps.a), sa = Math.sin(ps.a), out = new Array(g.pts.length);
  for(let i = 0; i < g.pts.length; i += 2){
    const x = g.pts[i] - ps.lx, y = g.pts[i + 1] - ps.ly;
    out[i] = ps.px + x * ca - y * sa; out[i + 1] = ps.py + x * sa + y * ca;
  }

}
function applyPose(ctx, ps){ ctx.translate(ps.px, ps.py); if(ps.a) ctx.rotate(ps.a); ctx.translate(-ps.lx, -ps.ly); }
function interiorPath(ctx, g){
  const w = g.w, r = g.r;
  ctx.beginPath(); ctx.moveTo(-w / 2, 0); ctx.lineTo(-w / 2, g.H - r);
  ctx.arc(0, g.H - r, r, Math.PI, 0, true); ctx.lineTo(w / 2, 0); ctx.closePath();
}
function outlinePath(ctx, g){
  const w = g.w, r = g.r;
  ctx.beginPath(); ctx.moveTo(-w / 2, 0); ctx.lineTo(-w / 2, g.H - r);
  ctx.arc(0, g.H - r, r, Math.PI, 0, true); ctx.lineTo(w / 2, 0);

function rrect(ctx, x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();

function axisAt(ps, Y){                           // where the vial's centre line crosses height Y
  const ca = Math.cos(ps.a), sa = Math.sin(ps.a);
  if(Math.abs(ca) < .4) return null;
  const s = ps.ly + (Y - ps.py + ps.lx * sa) / ca;

function readTheme(el){

    primer: v('--ps-primer'), accent: v('--accent'), ink: v('--ink'), surface: v('--surface') };

/* bands: [{c: pigment, u: units (may be fractional), hid}] bottom to top.
   o: {theme, base (device px ratio), t, wob, symbols, selected, cork (px above rest, or null), shadow} */
function drawVial(ctx, g, ps, bands, o){
  const w = g.w, H = g.H, r = g.r, th = o.theme, lw = Math.max(1.6, w * .075);

    ctx.restore();

    ctx.save(); ctx.shadowColor = th.accent; ctx.shadowBlur = w * .5; ctx.strokeStyle = th.accent; ctx.lineWidth = lw * 1.8;

    ctx.save(); ctx.shadowColor = o.glow; ctx.shadowBlur = w * .9 * o.glowAmt; ctx.fillStyle = th.glass;

    for(let i = 0; i < poly.length; i += 2){
      x0 = Math.min(x0, poly[i]); x1 = Math.max(x1, poly[i]); y0 = Math.min(y0, poly[i + 1]); y1 = Math.max(y1, poly[i + 1]);
    }
    ctx.save();
    applyPose(ctx, ps); interiorPath(ctx, g);
    ctx.setTransform(o.base, 0, 0, o.base, 0, 0);
    ctx.clip();
    const lv = []; let acc = 0;
    for(const b of bands){ acc += b.u; lv.push(levelFor(poly, acc * g.unitA, y0 - 1, y1 + 1)); }
    const top = lv[lv.length - 1];
    const amp = Math.min(w * .09, o.wob || 0), k = Math.PI * 2 / (w * 1.15), ph = o.t * .011;
    const surf = (bottom) => {
      ctx.beginPath(); ctx.moveTo(x0 - 3, bottom);
      if(amp > .05) for(let x = x0 - 3; x <= x1 + 3; x += 3) ctx.lineTo(x, top + amp * Math.sin(x * k + ph));
      else { ctx.lineTo(x0 - 3, top); ctx.lineTo(x1 + 3, top); }
      ctx.lineTo(x1 + 3, bottom); ctx.closePath();
    };
    for(let i = 0; i < bands.length; i++){
      const b = bands[i], yt = lv[i], yb = i ? lv[i - 1] : y1 + 2;
      if(yb - yt < .05) continue;

      if(i === bands.length - 1) { surf(yb + .6); ctx.fill(); }
      else ctx.fillRect(x0 - 3, yt, x1 - x0 + 6, yb - yt + .6);
      if(b.hid){
        ctx.save(); ctx.beginPath(); ctx.rect(x0 - 3, yt, x1 - x0 + 6, yb - yt); ctx.clip();
        ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = w * .07;
        for(let x = x0 - w; x < x1 + w; x += w * .28){ ctx.beginPath(); ctx.moveTo(x, yb); ctx.lineTo(x + (yb - yt), yt); ctx.stroke(); }
        ctx.restore();

    // gloss: paint is thick and shiny, lit from the left
    const ca = Math.cos(ps.a), sa = Math.sin(ps.a);
    const lx = ps.px + (-w / 2 - ps.lx) * ca - (H / 2 - ps.ly) * sa, ly = ps.py + (-w / 2 - ps.lx) * sa + (H / 2 - ps.ly) * ca;
    const rx = ps.px + (w / 2 - ps.lx) * ca - (H / 2 - ps.ly) * sa, ry = ps.py + (w / 2 - ps.lx) * sa + (H / 2 - ps.ly) * ca;

    gr.addColorStop(0, 'rgba(255,255,255,.30)'); gr.addColorStop(.24, 'rgba(255,255,255,.10)');

    for(let i = 0; i < lv.length - 1; i++) ctx.fillRect(x0 - 3, lv[i] - .5, x1 - x0 + 6, 1.2);
    ctx.strokeStyle = 'rgba(255,255,255,.42)'; ctx.lineWidth = Math.max(1.2, w * .045);

    if(amp > .05){ for(let x = x0 - 3; x <= x1 + 3; x += 3) x === x0 - 3 ? ctx.moveTo(x, top + 1 + amp * Math.sin(x * k + ph)) : ctx.lineTo(x, top + 1 + amp * Math.sin(x * k + ph)); }

        const whole = Math.floor(b.u + 1e-6);
        for(let u = 0; u < whole; u++){
          if(!b.hid && !o.symbols) break;
          const Y = levelFor(poly, (before + u + .5) * g.unitA, y0 - 1, y1 + 1);

function drawCork(ctx, w, lift){
  const cw = w * .8, ch = w * .6, y = -w * .36 - lift;

  gr.addColorStop(0, '#DDAE78'); gr.addColorStop(.45, '#C68D57'); gr.addColorStop(1, '#94623A');

/* ==================== 4. sound ==================== */
function makeSfx(A){
  const penta = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28];
  const note = (base, semi) => base * Math.pow(2, semi / 12);
  return {
    pick(){ A.tone({ f: 1568, dur: .06, gain: .05, type: 'triangle' }); A.tone({ f: 480, f1: 860, dur: .1, gain: .13 }); },
    drop(){ A.tone({ f: 720, f1: 430, dur: .09, gain: .09 }); },
    bonk(){
      A.tone({ f: 190, f1: 105, dur: .18, gain: .22, type: 'square', filter: 'lowpass', ff: 650 });
      A.tone({ f: 2400, dur: .05, gain: .04, type: 'triangle' });
    },
    tink(){ A.tone({ f: 2093, dur: .14, gain: .07, type: 'triangle' }); A.tone({ f: 3136, dur: .1, gain: .03, type: 'triangle', at: .04 }); },
    // glugs: each bubble is a quick upward chirp, pitched by how full the
    // target is, so a vial audibly "fills up" as it would under a tap
    pour(n, fill0, startMs, durMs){
      const count = Math.max(3, Math.round(durMs / 58));
      for(let k = 0; k < count; k++){
        const frac = (fill0 + n * (k + .5) / count) / CAP;
        const f = 210 * Math.pow(2, frac * 1.45) * (.93 + Math.random() * .14);
        const at = (startMs + k * durMs / count + Math.random() * 16) / 1000;
        A.tone({ f, f1: f * 1.95, glide: .045, dur: .09, gain: .19 + Math.random() * .05, at, attack: .003 });
      }
      A.noise({ filter: 'lowpass', f: 700, f1: 1500, dur: durMs / 1000 + .1, gain: .045, at: startMs / 1000, attack: .06, rate: .55 });
    },
    plop(fill, at){ const f = 260 * Math.pow(2, fill / CAP); A.tone({ f, f1: f * .55, dur: .11, gain: .12, at }); },
    complete(k){
      A.noise({ f: 1700, dur: .05, gain: .3, q: 2.2 });           // cork squeak-pop
      A.tone({ f: 640, f1: 170, dur: .08, gain: .2 });
      const f = note(523.25, penta[Math.min(k, penta.length - 1)]);
      A.bell(f, .07, .15); A.bell(f * 2, .15, .06);
    },
    reveal(){ A.tone({ f: 990, f1: 1480, dur: .12, gain: .07, type: 'triangle' }); A.tone({ f: 1480, dur: .1, gain: .04, type: 'triangle', at: .06 }); },
    undo(){ A.noise({ f: 2600, f1: 480, dur: .22, gain: .12, q: 1.4 }); A.tone({ f: 700, f1: 420, dur: .14, gain: .06 }); },
    hint(){ [0, 4, 7, 12].forEach((s, i) => A.bell(note(880, s), i * .06, .07)); },
    vial(){ A.bell(1318.5, 0, .1); A.bell(1975.5, .08, .06); A.tone({ f: 280, f1: 900, dur: .28, gain: .07 }); },
    win(){
      [0, 4, 7, 12, 16, 19].forEach((s, i) => A.bell(note(523.25, s), i * .085, .15));
      A.noise({ filter: 'highpass', f: 5500, dur: .9, gain: .04, at: .4, attack: .1 });
      A.tone({ f: 130.8, f1: 131, dur: .9, gain: .12, type: 'triangle', at: .5 });
    },
    coin(i){
      A.tone({ f: 1318.5, dur: .06, gain: .05, type: 'square', at: i * .055, filter: 'lowpass', ff: 3800 });
      A.tone({ f: 1975.5, dur: .12, gain: .05, type: 'square', at: i * .055 + .05, filter: 'lowpass', ff: 3800 });
    },
    hard(tier){
      A.tone({ f: 140, f1: 48, dur: .4, gain: .4 }); A.noise({ filter: 'lowpass', f: 400, dur: .2, gain: .2 });
      A.tone({ f: 140, f1: 48, dur: .4, gain: .35, at: .22 }); A.noise({ filter: 'lowpass', f: 400, dur: .2, gain: .18, at: .22 });
      const chord = tier === 2 ? [0, 3, 6, 10] : [0, 3, 7];
      chord.forEach((s, i) => A.tone({ f: note(196, s), dur: 1.1, gain: .07, type: 'sawtooth', filter: 'lowpass', ff: 900, at: .44 + i * .02, attack: .08 }));
    }
  };
}

  /* ---------- playing ---------- */
  function tapVial(i){

      if(!L.vials[i].length){ v.shake = 1; sfx.tink(); kick(); return; }

      sel = -1; sfx.drop();

  function pour(i, j){
    const before = bandsOf(i), beforeDst = bandsOf(j);

    const n = Math.min(topRun(i), CAP - d0), pig = col(L.vials[i][v0 - 1]);

  function finishPour(an){

  /* ---------- boosters ---------- */

  function hint(){

          gentler ? { label: 'Mix a gentler board', kind: 'ghost', onClick: () => { gaveUp(); S.cur = null; startLevel(L.n, true); } } : null,

  function buy(kind){
    const price = PRICES[kind];

      undo: ['Out of undos', `Take back 5 more pours on this try.`, 'Buy 5 undos'],
      hint: ['Out of hints', 'A hint points at one pour that still leads to a finished board.', 'Buy a hint'],
      vial: ['Out of spare vials', 'An empty vial gives you room to park paint. One per level.', 'Buy a vial']
    }[kind];
    const short = S.coins < price;
    sheet({ eyebrow: 'Boosters', title: info[0],

      actions: [

  /* ---------- dead ends ---------- */

    const s = colors();
    let dead = !listMoves(s, CAP, false).length;

  function showStuck(){

  /* ---------- tutorial + coach line ---------- */

    else if(L.n === 1 && !S.tips.tut){
      if(L.moves < 3 && !anims.length){

      } else if(L.moves >= 3) hintMv = null;

      else if(L.moves === 0) msg = 'Tap a vial to pick it up.';

      else msg = 'Every finished vial paints part of the picture above.';

  /* ---------- particles ---------- */
  function sparkle(x, y, c, count, power){

      const a = Math.random() * Math.PI * 2, sp = (.08 + Math.random() * .22) * power;
      parts.push({ kind: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - .08, life: 0, max: 500 + Math.random() * 400,

  }

  /* ---------- the frame loop ---------- */
  function kick(){ if(!raf && view === 'play' && !document.hidden) { lastT = 0; raf = requestAnimationFrame(frame); } }

    if(anims.length || parts.length || hintMv || kf >= 0) return true;

    for(const k in artAnim) if(t - artAnim[k] < 1000) return true;
    for(const v of vs){
      if(Math.abs(v.lift - (vs.indexOf(v) === sel ? g.w * .5 : 0)) > .2 || v.shake > 0 || v.wob > .06) return true;
      if(Math.abs(v.dx - v.x) > .3 || Math.abs(v.dy - v.y) > .3) return true;
      if(v.cork && t - v.cork < 700) return true;
      if(v.hop && t - v.hop < 460) return true;
      if(v.pop && t - v.pop < 400) return true;

  function step(t, dt){
    if(!L || !g) return;
    const w = g.w;
    vs.forEach((v, i) => {
      const target = i === sel ? w * .5 : 0;
      if(!v.busy) v.lift += (target - v.lift) * Math.min(1, dt * .022);
      v.shake = Math.max(0, v.shake - dt / 320);

      if(flowing){
        const b = vs[an.j], recv = poured(an, e - an.lag), sy = surfaceY(an.j, an.d0 + recv);

        }

        ctx.beginPath(); ctx.arc(p.r * .95, p.r * .3, p.r * .28, 0, 7); ctx.arc(-p.r * .7, -p.r * .6, p.r * .2, 0, 7); ctx.fill();

  }

  /* ---------- easel ---------- */
  function drawEasel(){ if(L && art && view === 'play') paintCanvas(artCv, art, L.palette, artProg); }
  function renderDots(){
    const box = ref('dots'); box.replaceChildren();
    if(!L) return;
    L.palette.forEach(pig => box.append(h('i', { class: L.doneSet.has(pig) ? 'on' : null, style: `--c:${PIGMENTS[pig].hex}`, title: PIGMENTS[pig].name })));
  }

  /* ---------- HUD ---------- */
  function updateHud(){
    bind('coins', S.coins);
    if(!L) return;
    bind('lvl', `Level ${L.n}`);
    const tierEl = ref('tier');
    tierEl.hidden = !L.sp.tier; tierEl.textContent = TIER_NAME[L.sp.tier]; tierEl.dataset.tier = L.sp.tier;
    const setN = (n, v, buyable) => { const b = ref(n); b.textContent = v > 0 ? v : '+'; b.classList.toggle('buy', !(v > 0) && buyable); };
    setN('undoN', L.undos, true); setN('hintN', S.inv.hint, true); setN('vialN', L.extra ? 0 : S.inv.vial, !L.extra);
    ref('vialN').closest('.ps-tool').classList.toggle('used', L.extra);
  }

  /* ---------- screens ---------- */
  function showView(which){
    view = which;
    ref('lobby').hidden = which !== 'lobby';
    ref('play').hidden = which !== 'play';
    el.dataset.tier = which === 'play' && L ? L.sp.tier : 0;
    if(which === 'lobby') renderLobby();
  }
  function startLevel(n, fresh){
    closeSheet();
    won = false; sel = -1; hintMv = null; anims = []; parts = []; kf = -1;
    floats.replaceChildren(); hideStuck();
    const resume = !fresh && S.cur && S.cur.n === n;
    showView('play');
    el.dataset.tier = spec(n).tier;
    coachEl.textContent = resume ? '' : 'Mixing paint…';
    bind('lvl', `Level ${n}`);
    later(() => {
      hydrate(resume ? S.cur : freshLevel(n));
      vs = []; g = null;
      layout();
      vs.forEach((v, k) => { v.pop = now() + k * 35; });
      updateHud(); persist(); coach(); drawEasel(); kick();
      if(!resume && L.sp.tier) intro(L.sp.tier);
      else if(!resume && L.sp.mystery && !S.tips.mystery) mysteryTip();
      checkStuckSoon();
    }, resume ? 0 : 40);
  }
  function intro(tier){
    const box = ref('intro');
    ref('introK').textContent = tier === 2 ? 'Super hard level' : 'Hard level';
    ref('introN').textContent = `Level ${L.n}`;
    ref('introS').textContent = `${L.sp.K} colours${L.sp.mystery ? ', some hidden' : ''}. Worth ${L.sp.reward} coins.`;
    box.dataset.tier = tier; box.hidden = false;
    box.classList.remove('on'); void box.offsetWidth; box.classList.add('on');
    sfx.hard(tier); buzz([30, 60, 30]);
    const done = () => { box.hidden = true; box.onclick = null; if(L.sp.mystery && !S.tips.mystery) mysteryTip(); };
    box.onclick = done;
    later(() => { if(!box.hidden) done(); }, 2100);
  }
  function mysteryTip(){
    S.tips.mystery = true; persist();
    sheet({ eyebrow: 'New', title: 'Hidden paint',
      sub: 'Grey layers with a question mark are paint you can’t see yet. Pour off whatever sits on top and the colour shows.',
      actions: [{ label: 'Got it' }] });
  }
  function showWin(){
    if(!L || view !== 'play') return;
    const sp = L.sp, next = spec(L.n + 1);
    const frame = h('div', { class: 'ps-frame ps-frame-win' }, h('canvas'));
    const coinsEl = h('b', null, '+0');
    const body = h('div', { class: 'ps-win' },
      frame,
      h('div', { class: 'ps-win-cap' }, `Study No. ${L.n}`, h('span', null, ` · ${L.palette.length} pigments · ${L.moves} pours`)),
      h('div', { class: 'ps-win-coins' }, h('i', { class: 'coin' }), coinsEl, h('span', null, L.clean ? ' incl. 5 for no boosters' : ''))
    );
    const nextKind = next.tier === 2 ? 'super' : next.tier === 1 ? 'hard' : 'primary';
    sheet({ eyebrow: sp.tier ? `${TIER_NAME[sp.tier]} level beaten` : `Level ${L.n} complete`,
      title: sp.tier === 2 ? 'Masterpiece.' : sp.tier === 1 ? 'That was a tough one.' : ['Lovely.', 'Clean pours.', 'Framed.', 'Gallery ready.'][L.n % 4],
      tone: sp.tier === 2 ? 'super' : sp.tier === 1 ? 'hard' : '', body, dismiss: false,
      actions: [
        { label: next.tier ? `Next: ${TIER_NAME[next.tier].toLowerCase()} level ${L.n + 1}` : `Next level`, kind: nextKind, onClick: () => startLevel(S.level, true) },
        { label: 'Back to levels', kind: 'ghost', onClick: () => { showView('lobby'); } }
      ] });
    requestAnimationFrame(() => paintCanvas(frame.firstChild, art, L.palette, L.palette.map(() => 1)));
    const total = sp.reward + (L.clean ? 5 : 0);
    let shown = 0; const stepN = Math.max(1, Math.round(total / 12));
    const tick = () => {
      shown = Math.min(total, shown + stepN); coinsEl.textContent = `+${shown}`;
      sfx.coin(0);
      if(shown < total) later(tick, 55);
    };
    later(tick, 350);
    updateHud();
  }
  function menu(){
    const body = h('div', null,
      toggle('Colour symbols', 'Adds a shape to every colour of paint', () => S.symbols, v => { S.symbols = v; persist(); kick(); }),
      toggle('Sound', 'Glugs, pops and chimes', () => api.settings.sound, v => { api.settings.sound = v; api.persist(); if(v) A.ensure(); }),
      toggle('Vibration', 'On phones that support it', () => api.settings.haptics, v => { api.settings.haptics = v; api.persist(); }));
    sheet({ eyebrow: `Level ${L ? L.n : S.level}`, title: 'Paused', body,
      actions: [
        { label: 'Resume' },
        { label: 'How to play', kind: 'ghost', onClick: howTo },
        { label: 'Restart level', kind: 'ghost', onClick: () => restart(true) },
        { label: 'Back to levels', kind: 'ghost', onClick: () => showView('lobby') }
      ] });
  }
  function howTo(){
    const row = (t, d) => h('div', { class: 'ps-how' }, h('div', { class: 'ps-how-t' }, t), h('div', { class: 'ps-how-d' }, d));
    sheet({ eyebrow: 'How to play', title: 'Sort the paint',
      body: h('div', null,
        row('Tap a vial, then tap another', 'The top colour pours across. It lands only on the same colour, or in an empty vial, and only as much as fits.'),
        row('Fill a vial with one colour', 'It gets corked, and that pigment paints its part of the picture above.'),
        row('Grey paint is hidden', 'A question mark hides a colour until the paint above it has been poured off.'),
        row('Boosters', 'Undo takes back a pour (5 per try). A hint points at a pour that still wins. An extra vial gives you room, once per level.'),
        row('Hard levels', 'Levels 5 and 10 of every ten are harder, then the next level eases off. They pay 30 and 60 coins.')),
      actions: [{ label: 'Got it' }] });
  }

  /* ---------- lobby ---------- */
  function renderLobby(){
    bind('coins', S.coins);
    const n = S.level, resume = S.cur && S.cur.n === n;
    const heat = resume ? S.cur.h : heatFor(n), sp = spec(n, heat);
    bind('nextEyebrow', sp.tier ? `Up next · ${TIER_NAME[sp.tier]}` : 'Up next');
    ref('lobby').querySelector('.ps-next-eyebrow').dataset.tier = sp.tier;
    bind('nextTitle', `Study No. ${n}`);
    bind('nextSub', `${sp.K} colours · ${sp.K + 2} vials${sp.mystery ? ' · some hidden' : ''}`);
    const pal = resume ? S.cur.palette : null;
    const box = ref('nextDots'); box.replaceChildren();
    for(let k = 0; k < sp.K; k++) box.append(h('i', { style: pal ? `--c:${PIGMENTS[pal[k]].hex}` : null, class: pal ? null : 'blank' }));
    requestAnimationFrame(() => {
      const nextArt = buildArt(n, sp.K);
      paintCanvas(ref('nextArt'), nextArt, pal || [...Array(sp.K).keys()], []);
    });
    const go = ref('go');
    go.className = 'btn btn-wide ps-go ' + (sp.tier === 2 ? 'btn-super' : sp.tier === 1 ? 'btn-hard' : 'btn-primary');
    go.innerHTML = `${IC.play}<span>${resume ? 'Continue' : 'Play'} level ${n}</span>`;
    const block = Math.floor((n - 1) / 10);
    bind('blockLabel', `Levels ${block * 10 + 1}–${block * 10 + 10}`);
    bind('lobbyNote', S.stats.won
      ? `${S.stats.won} painting${S.stats.won === 1 ? '' : 's'} finished · ${S.stats.hard + S.stats.super} hard level${S.stats.hard + S.stats.super === 1 ? '' : 's'} beaten`
      : 'Every level is mixed fresh on your device, to suit how you play. Levels 5 and 10 of each ten are the hard ones.');
    renderRoad(n);
    if(!resume) later(() => levelData(n, heat), 120);   // have the board ready before Play is tapped
  }
  function renderRoad(n){
    const svg = ref('road'), block = Math.floor((n - 1) / 10), first = block * 10 + 1;
    const X = p => 22 + p * (296 / 9), Y = p => 104 - (1 - SK.TARGET[p]) / .64 * 76;
    const ns = 'http://www.w3.org/2000/svg', mk = (tag, a) => { const e = document.createElementNS(ns, tag); for(const k in a) e.setAttribute(k, a[k]); return e; };
    svg.replaceChildren();
    const pts = SK.TARGET.map((_, p) => `${X(p)},${Y(p)}`);
    svg.append(mk('polyline', { points: pts.join(' '), class: 'rd-line' }));
    const doneP = n - first;
    if(doneP > 0) svg.append(mk('polyline', { points: pts.slice(0, doneP + 1).join(' '), class: 'rd-done' }));
    RAMP.forEach((_, p) => {
      const lv = first + p, tier = p === 9 ? 2 : p === 4 ? 1 : 0, r = tier === 2 ? 13 : tier === 1 ? 11.5 : 9;
      const state = lv < n ? 'done' : lv === n ? 'now' : 'todo';
      if(state === 'now') svg.append(mk('circle', { cx: X(p), cy: Y(p), r: r + 6, class: 'rd-pulse' }));
      svg.append(mk('circle', { cx: X(p), cy: Y(p), r, class: `rd-node rd-${state} rd-t${tier}` }));
      const num = mk('text', { x: X(p), y: Y(p) + 24 + (tier ? 3 : 0), class: `rd-num${state === 'now' ? ' rd-num-now' : ''}` });
      num.textContent = lv; svg.append(num);
      if(state === 'done'){
        svg.append(mk('path', { d: `M${X(p) - 4} ${Y(p)} l3 3 l5.5 -6`, class: 'rd-check' }));
      }
    });
  }

  /* ---------- input ---------- */
  function hitVial(x, y){
    if(!g) return -1;
    let best = -1, bd = 1e9;
    vs.forEach((v, i) => {
      const top = v.dy - v.lift - g.w * .9, bot = v.dy + g.H + g.w * .35;
      if(y < top || y > bot) return;
      const d = Math.abs(x - v.dx);
      if(d < slotW / 2 && d < bd){ bd = d; best = i; }
    });
    return best;
  }
  cv.addEventListener('pointerdown', e => {
    if(e.button > 0) return;
    const r = cv.getBoundingClientRect();
    kf = -1;
    const i = hitVial(e.clientX - r.left, e.clientY - r.top);
    if(i >= 0) tapVial(i);
    else if(sel >= 0){ sel = -1; sfx.drop(); coach(); kick(); }
  });
  const KEYMAP = '1234567890-=';
  function onKey(e){
    if(view !== 'play' || !L || e.metaKey || e.ctrlKey || e.altKey) return;
    if(document.querySelector('#sheet.on')) return;
    const k = e.key.toLowerCase(), idx = KEYMAP.indexOf(k);
    if(idx >= 0 && idx < vs.length){ tapVial(idx); e.preventDefault(); return; }
    if(k === 'arrowright' || k === 'arrowleft'){ kf = kf < 0 ? (sel >= 0 ? sel : 0) : (kf + (k === 'arrowright' ? 1 : -1) + vs.length) % vs.length; kick(); e.preventDefault(); }
    else if((k === 'enter' || k === ' ') && kf >= 0){ tapVial(kf); e.preventDefault(); }
    else if(k === 'u') undo(); else if(k === 'h') hint(); else if(k === 'r') restart(true);
    else if(k === 'escape' && sel >= 0){ sel = -1; sfx.drop(); kick(); }
  }
  document.addEventListener('keydown', onKey);
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if(!b) return;
    const act = b.dataset.act;
    A.ensure();
    if(act !== 'undo' && act !== 'vial') api.click();
    switch(act){
      case 'home': api.exit(); break;
      case 'settings': api.ui.openSettings(h('div', null,
        toggle('Colour symbols', 'Adds a shape to every colour of paint', () => S.symbols, v => { S.symbols = v; persist(); }),
        h('button', { class: 'btn btn-ghost btn-sm btn-wide', style: 'margin-top:12px', onclick: () => { api.click(); howTo(); } }, 'How to play Paint Sort'))); break;
      case 'play': startLevel(S.level, false); break;
      case 'lobby': showView('lobby'); break;
      case 'menu': menu(); break;
      case 'undo': undo(); break;
      case 'hint': hint(); break;
      case 'vial': addVial(); break;
      case 'restart': restart(true); break;
    }
  });
  const ro = new ResizeObserver(() => { if(view === 'play'){ layout(); kick(); } });
  ro.observe(field);
  const offTheme = api.on('theme', () => { theme = readTheme(el); if(view === 'play'){ drawEasel(); kick(); } else renderLobby(); });
  const offWipe = api.on('wipe', () => { api.exit(); });
  const onVis = () => { if(!document.hidden) kick(); };
  document.addEventListener('visibilitychange', onVis);

  window.__ps = Object.assign(window.__ps || {}, {
    state: () => L && colors(), level: () => L && L.n, tap: tapVial, undo, hint, addVial, restart: () => restart(false),
    solveNow: () => L && solve(colors(), CAP, 200000), view: () => view, idle: () => !anims.length,
    save: () => JSON.parse(JSON.stringify({ level: S.level, coins: S.coins, inv: S.inv, stats: S.stats })),
    skill: () => Object.assign({ tries: S.tries }, S.skill), heatFor, heat: () => L && L.h,
    setSkill: (mu, sd) => { S.skill = Object.assign(SK.create(SKILL), { mu, sd: sd || S.skill.sd }); api.persist(); },     // dev
    play: n => { if(n){ S.level = n; S.cur = null; } startLevel(S.level, false); }     // dev: jump to a level
  });

  showView('lobby');
  return {
    unmount(){
      persist();
      cancelAnimationFrame(raf); raf = 0;
      for(const id of timers) clearTimeout(id);
      ro.disconnect(); offTheme(); offWipe();
      document.removeEventListener('keydown', onKey);
      document.removeEventListener('visibilitychange', onVis);
    }
  };
}

/* ==================== 6. the shelf card ==================== */
function drawCard(box){
  const cv = document.createElement('canvas');
  box.classList.add('ps-card-art');
  box.append(cv);
  requestAnimationFrame(() => {
    const W = box.clientWidth, H = box.clientHeight;
    if(!W || !H) return;
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = W * dpr; cv.height = H * dpr;
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const theme = readTheme(document.documentElement);
    const w = Math.min(36, W / 11), g = makeGeom(w), y = H - g.H - w * .55;
    const o = { theme, base: dpr, t: 0, wob: 0, font: 'sans-serif' };
    const B = (...a) => a.map(([c, u]) => ({ c, u, hid: false }));
    const vials = [
      [.1, B([6, 1], [0, 1], [2, 1], [6, 1])],
      [.24, B([2, 1], [8, 1], [0, 1])],
      [.62, B([0, 2], [2, 1.35])],
      [.78, B([6, 4])],
      [.91, B([8, 2], [3, 1])]
    ];
    for(const [fx, bands] of vials){
      const x = W * fx;
      drawVial(ctx, g, { px: x, py: y, lx: 0, ly: 0, a: 0 }, bands, Object.assign({}, o, {
        shadow: 1, shadowX: x, shadowY: y + g.H + w * .16, cork: fx === .78 ? 0 : null }));
    }
    // the vial mid-pour, and its stream
    const tx = W * .62, lipX = tx - w * .1, lipY = y - w * .62, ang = 1.18;
    const sy = y + g.H - (g.H - g.head) * (3.35 / CAP) * .98;
    ctx.lineCap = 'round'; ctx.strokeStyle = PIGMENTS[2].hex; ctx.lineWidth = w * .2;
    ctx.beginPath(); ctx.moveTo(lipX, lipY); ctx.quadraticCurveTo(lipX + w * .06, lipY + (sy - lipY) * .3, tx - w * .08, sy); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.38)'; ctx.lineWidth = w * .05;
    ctx.beginPath(); ctx.moveTo(lipX - w * .05, lipY + 3); ctx.lineTo(tx - w * .12, sy - 3); ctx.stroke();
    ctx.fillStyle = PIGMENTS[2].hex;
    for(const [dx, dy, r] of [[-.35, -.25, .07], [.28, -.4, .05], [.18, -.12, .045]]){ ctx.beginPath(); ctx.arc(tx + dx * w, sy + dy * w, r * w, 0, 7); ctx.fill(); }
    drawVial(ctx, g, { px: lipX, py: lipY, lx: w / 2, ly: 0, a: ang }, B([3, 1], [2, .7]), o);
  });
}

/* ==================== 7. register ==================== */
window.__ps = Object.assign(window.__ps || {}, { spec, generate, solve, probe });
window.Playbox.register({
  id: 'paint-sort',
  title: 'Paint Sort',
  tagline: 'Pour paint between vials until each one holds a single colour.',
  order: 1,
  status: s => s.level > 1 ? `Level ${s.level} · ${s.coins} coins` : 'New · 120 coins to start',
  cta: s => s.level > 1 || s.cur ? 'Continue' : 'Play',
  card: drawCard,
  mount
});
})();
</script>

<script>
(function(){
  const start = () => window.Playbox.boot();
  const hot = window.claude && window.claude.hot;
  if(hot && hot.ready) hot.ready(start); else start();
})();
</script>
