<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1220" media="(prefers-color-scheme: dark)">
<meta name="description" content="Playbox: a shelf of small puzzle games. First up, Paint Sort: pour paint between vials until each holds one colour.">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>html,body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Playbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Lilita+One&display=swap">
<style>
/* ==========================================================
   PLAYBOX — one shell, many small games.
   The shell owns the home screen, settings, saving, sound and
   the shared sheet/toast UI. Each game is a separate file in
   src/games/ that calls Playbox.register().
   ========================================================== */
:root{
  color-scheme:light;
  --bg:#EEF1F6;
  --bg-2:#E1E6EF;
  --surface:#FFFFFF;
  --surface-2:#F4F6FA;
  --ink:#141A2B;
  --muted:#586079;
  --dim:#8E96AE;
  --line:#D9DFEA;
  --accent:#2B59F0;
  --accent-ink:#FFFFFF;
  --accent-deep:#1B3FB8;
  --accent-soft:#E3EAFE;
  --good:#16935D;
  --bad:#D92F45;
  --hard:#E0413F;
  --hard-deep:#A92A2B;
  --super:#8646E0;
  --super-deep:#5E2BA6;
  --coin:#F4B31B;
  --coin-edge:#C27F06;
  --scrim:rgba(16,22,40,.46);
  --shadow:0 18px 40px -22px rgba(20,32,70,.55);
  --shadow-sm:0 2px 0 var(--line);
  --f-disp:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1220; --bg-2:#080B15; --surface:#181E31; --surface-2:#1F2740;
    --ink:#EDF0F8; --muted:#A2AAC4; --dim:#6B7494; --line:#2A3350;
    --accent:#7090FF; --accent-ink:#0B1024; --accent-deep:#4A63C9; --accent-soft:#1F2A52;
    --good:#3DCB8B; --bad:#FF6275; --hard:#FF5E5B; --hard-deep:#B83533; --super:#B07CFF; --super-deep:#7446BD;
    --coin:#FFC83D; --coin-edge:#B98609;
    --scrim:rgba(0,0,0,.6); --shadow:0 18px 44px -20px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1220; --bg-2:#080B15; --surface:#181E31; --surface-2:#1F2740;
  --ink:#EDF0F8; --muted:#A2AAC4; --dim:#6B7494; --line:#2A3350;
  --accent:#7090FF; --accent-ink:#0B1024; --accent-deep:#4A63C9; --accent-soft:#1F2A52;
  --good:#3DCB8B; --bad:#FF6275; --hard:#FF5E5B; --hard-deep:#B83533; --super:#B07CFF; --super-deep:#7446BD;
  --coin:#FFC83D; --coin-edge:#B98609;
  --scrim:rgba(0,0,0,.6); --shadow:0 18px 44px -20px rgba(0,0,0,.85);
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
body{
  height:100%;margin:0;background:var(--bg);color:var(--ink);
  font:500 15px/1.45 var(--f-body);
  overscroll-behavior:none;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}

#app{position:relative;height:100%;width:100%;max-width:480px;margin:0 auto;overflow:hidden;background:var(--bg)}
@media (min-width:560px) and (min-height:640px){
  body{display:grid;place-items:center;background:var(--bg-2)}
  #app{width:430px;height:min(900px,calc(100% - 40px));border-radius:30px;box-shadow:var(--shadow),0 0 0 1px var(--line)}
}
.view{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.view.enter{animation:viewIn .34s cubic-bezier(.2,.9,.25,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

/* ---------- shared controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;
  padding:15px 20px;font-family:var(--f-disp);font-size:19px;letter-spacing:.01em;line-height:1;
  transition:transform .1s,box-shadow .1s,filter .15s}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 5px 0 var(--accent-deep)}
.btn-hard{background:var(--hard);color:#fff;box-shadow:0 5px 0 var(--hard-deep)}
.btn-super{background:var(--super);color:#fff;box-shadow:0 5px 0 var(--super-deep)}
.btn-ghost{background:var(--surface-2);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn-primary:active,.btn-hard:active,.btn-super:active,.btn-ghost:active{transform:translateY(4px);box-shadow:none}
.btn:disabled{filter:grayscale(.8) opacity(.55);cursor:default;transform:none}
.btn-sm{padding:12px 16px;font-size:16px;border-radius:14px}
.btn-wide{width:100%}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--surface);color:var(--muted);
  display:grid;place-items:center;flex:0 0 auto;box-shadow:var(--shadow-sm);transition:transform .1s}
.icon-btn:active{transform:translateY(2px);box-shadow:none}
.icon-btn svg{width:22px;height:22px}
.coin{display:inline-block;width:18px;height:18px;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 35% 32%,#FFE9A6 0 18%,var(--coin) 38%);
  box-shadow:inset 0 -2px 0 var(--coin-edge),0 0 0 1.5px var(--coin-edge)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px 7px 8px;border-radius:999px;
  background:var(--surface);box-shadow:var(--shadow-sm);font-weight:800;font-size:15px;
  font-variant-numeric:tabular-nums}

/* switches and segmented control */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;
  border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .lab{font-weight:700;font-size:15.5px}
.set-row .hint{font-size:12.5px;color:var(--dim);font-weight:600;margin-top:1px}
.sw{width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:0 0 auto;
  transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"] i{transform:translateX(22px)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;flex:0 0 auto}
.seg button{padding:7px 11px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ---------- sheets + toast ---------- */
#layer{position:absolute;inset:0;z-index:50;pointer-events:none}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .26s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;
  background:var(--surface);border-radius:28px 28px 0 0;
  padding:12px 20px calc(22px + env(safe-area-inset-bottom,0px));
  transform:translateY(104%);transition:transform .36s cubic-bezier(.2,.9,.25,1);
  pointer-events:auto;box-shadow:0 -20px 50px -24px rgba(10,16,40,.6)}
.sheet.on{transform:translateY(0)}
.sheet .grab{width:42px;height:5px;border-radius:999px;background:var(--line);margin:0 auto 14px}
.sheet .eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--accent);margin-bottom:4px}
.sheet h2{font-family:var(--f-disp);font-weight:400;font-size:30px;line-height:1.05;margin:0 0 6px;text-wrap:balance;letter-spacing:.005em}
.sheet .sub{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 12px;max-width:44ch}
.sheet .actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.sheet[data-tone="hard"] .eyebrow{color:var(--hard)}
.sheet[data-tone="super"] .eyebrow{color:var(--super)}
.sheet[data-tone="bad"] .eyebrow{color:var(--bad)}
#toast{position:absolute;left:50%;top:calc(76px + env(safe-area-inset-top,0px));z-index:60;
  transform:translate(-50%,-8px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;
  font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  max-width:86%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- home ---------- */
#home{overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));gap:20px}
.home-top{display:flex;align-items:center;gap:12px}
.mark{font-family:var(--f-disp);font-size:34px;line-height:1;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
.mark-box{width:38px;height:38px;border-radius:11px;background:var(--accent);position:relative;flex:0 0 auto;
  box-shadow:inset 0 -4px 0 var(--accent-deep)}
.mark-box::before,.mark-box::after{content:"";position:absolute;border-radius:50%}
.mark-box::before{width:12px;height:12px;left:7px;top:8px;background:var(--coin)}
.mark-box::after{width:10px;height:10px;right:7px;bottom:10px;background:#fff;opacity:.9;border-radius:3px}
.home-top .spacer{flex:1}
.home-hello{display:flex;flex-direction:column;gap:4px}
.home-hello h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(28px,8.4vw,36px);line-height:1.02;margin:0;text-wrap:balance}
.home-hello p{margin:0;color:var(--muted);font-size:15px;max-width:40ch}
.home-section{display:flex;flex-direction:column;gap:12px}
.home-section[hidden]{display:none}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.section-label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--dim)}
.section-count{font-size:12.5px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}

/* boards: each game is a chunky slab standing on a base in its own colour.
   A game sets --b-* on .board[data-game="its-id"]; the defaults are Playbox blue. */
.board{--b-accent:var(--accent);--b-deep:var(--accent-deep);--b-soft:var(--accent-soft);--b-ink:var(--accent-ink);--b-text:var(--accent);
  position:relative;display:flex;flex-direction:column;min-width:0;border-radius:24px;background:var(--surface);
  text-align:left;box-shadow:0 6px 0 var(--b-deep),0 20px 32px -22px rgba(10,16,40,.55);
  transition:transform .12s,box-shadow .12s;animation:boardIn .5s cubic-bezier(.2,.9,.25,1) backwards;
  animation-delay:calc(var(--i,0) * 70ms)}
.board:active{transform:translateY(4px);box-shadow:0 2px 0 var(--b-deep),0 10px 20px -16px rgba(10,16,40,.5)}
@keyframes boardIn{from{transform:translateY(18px) scale(.97)}to{transform:none}}
.board-art{position:relative;overflow:hidden;border-radius:24px 24px 0 0;aspect-ratio:1/.86;background:var(--b-soft)}
.board-art canvas{position:absolute;inset:0;width:100%;height:100%}
.board-body{display:flex;flex-direction:column;gap:5px;padding:12px 13px 14px;min-width:0;flex:1}
.board-title{font-family:var(--f-disp);font-size:20px;line-height:1.05;text-wrap:balance}
.board-tag{color:var(--muted);font-size:12.5px;line-height:1.35}
.board-foot{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:5px;min-width:0}
.board-chip{display:inline-flex;align-items:center;min-width:0;font-size:12px;font-weight:800;color:var(--b-text);background:var(--b-soft);
  padding:5px 10px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board-cta{display:inline-flex;align-items:center;justify-content:center;gap:7px;margin-left:auto;flex:0 0 auto;
  width:36px;height:36px;border-radius:12px;background:var(--b-accent);color:var(--b-ink);box-shadow:0 3px 0 var(--b-deep)}
.board-cta svg{width:18px;height:18px}
.board-cta .lbl{display:none}
.board-lock{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:rgba(16,22,40,.72);color:#fff}
.board-lock svg{width:16px;height:16px}
.board.soon .board-chip{color:var(--muted);background:var(--surface-2)}
.board.nope{animation:boardNope .4s ease}
@keyframes boardNope{20%{transform:translateX(-6px) rotate(-1deg)}45%{transform:translateX(5px) rotate(.8deg)}70%{transform:translateX(-3px)}100%{transform:none}}

/* the board you're playing gets the big slot */
.board-feature{border-radius:28px}
.board-feature .board-art{aspect-ratio:auto;height:clamp(180px,30dvh,230px);border-radius:28px 28px 0 0}
.board-feature .board-body{gap:6px;padding:16px 18px 18px}
.board-feature .board-title{font-size:30px}
.board-feature .board-tag{font-size:14.5px}
.board-feature .board-chip{font-size:12.5px;padding:6px 11px}
.board-feature .board-cta{width:auto;height:auto;padding:12px 18px 12px 15px;border-radius:15px;box-shadow:0 4px 0 var(--b-deep);
  font-family:var(--f-disp);font-size:18px;line-height:1}
.board-feature .board-cta .lbl{display:inline}

.board-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}
.board-grid .board.wide{grid-column:1/-1}
.board-grid .board.wide .board-art{aspect-ratio:2.1/1}
.home-note{font-size:13.5px;color:var(--dim);text-align:center;margin:4px auto 0;max-width:34ch;line-height:1.5}
.pb-frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.06s!important}
}
</style>
</head>
<body>
<div id="app">
  <section id="home" class="view" aria-label="Playbox home">
    <header class="home-top">
      <div class="mark"><span class="mark-box" aria-hidden="true"></span>Playbox</div>
      <span class="spacer"></span>
      <button class="icon-btn" id="homeSettings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
      </button>
    </header>
    <div class="home-hello">
      <h1 id="homeTitle">Pick a game</h1>
      <p id="homeSub">Short puzzles that remember where you left off.</p>
    </div>
    <section class="home-section" id="featureSection" aria-labelledby="featureLabel">
      <div class="section-head"><span class="section-label" id="featureLabel">Start here</span></div>
      <div id="featureSlot"></div>
    </section>
    <section class="home-section" id="moreSection" aria-labelledby="moreLabel">
      <div class="section-head"><span class="section-label" id="moreLabel">More games</span><span class="section-count" id="moreCount"></span></div>
      <div class="board-grid" id="boardGrid"></div>
    </section>
    <p class="home-note">Your progress in each game is saved on this device.</p>
  </section>
  <section id="stage" class="view" hidden></section>
  <div id="layer">
    <div class="scrim" id="scrim"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script>
/* ==========================================================
   PLAYBOX shell services: store · audio · buzz · ui · registry
   ========================================================== */
(function(){
'use strict';
const $ = s => document.querySelector(s);
const root = document.documentElement;

/* ---------- store: one localStorage key, one sub-object per game ---------- */
const KEY = 'playbox.v1';
function readLS(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function writeLS(d){ try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){} }
const loaded = readLS() || {};
const data = {
  v: 1,
  settings: Object.assign({ sound: true, haptics: true, theme: 'system' }, loaded.settings),
  games: loaded.games && typeof loaded.games === 'object' ? loaded.games : {},
  last: loaded.last || null
};
let saveTimer = 0;
const store = {
  data,
  settings: data.settings,
  game(id){ return data.games[id] || (data.games[id] = {}); },
  save(now){
    clearTimeout(saveTimer);
    if(now) writeLS(data); else saveTimer = setTimeout(() => writeLS(data), 150);
  },
  wipe(){
    for(const k of Object.keys(data.games)) delete data.games[k];
    data.last = null; writeLS(data);
  }
};
window.addEventListener('pagehide', () => writeLS(data));
document.addEventListener('visibilitychange', () => { if(document.hidden) writeLS(data); });

/* ---------- events ---------- */
const handlers = {};
const on = (ev, fn) => { (handlers[ev] = handlers[ev] || new Set()).add(fn); return () => handlers[ev].delete(fn); };
const emit = (ev, x) => { if(handlers[ev]) for(const fn of [...handlers[ev]]) try{ fn(x); }catch(e){ console.error(e); } };

/* ---------- theme ---------- */
const hostTheme = root.getAttribute('data-theme');       // whatever the page was opened with
let settingTheme = false;
function applyTheme(){
  const t = data.settings.theme;
  settingTheme = true;
  if(t === 'light' || t === 'dark') root.setAttribute('data-theme', t);
  else if(hostTheme) root.setAttribute('data-theme', hostTheme);
  else root.removeAttribute('data-theme');
  settingTheme = false;
  emit('theme');
}
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => emit('theme')); }catch(e){}
new MutationObserver(() => { if(!settingTheme) emit('theme'); }).observe(root, { attributes: true, attributeFilter: ['data-theme'] });

/* ---------- audio: tiny synth, everything generated on the fly ---------- */
const audio = (() => {
  let ctx = null, master = null, noiseBuf = null;
  function ensure(){
    if(!data.settings.sound) return null;
    if(!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      try{ ctx = new AC(); }catch(e){ return null; }
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 14; comp.ratio.value = 5;
      comp.attack.value = .002; comp.release.value = .16;
      master = ctx.createGain(); master.gain.value = .7;
      master.connect(comp); comp.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if(ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }
  function env(g, t, peak, attack, dur){
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(.0002, peak), t + attack);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  }
  // a pitched blip: optional glide to f1 and an optional filter
  function tone(o){
    const c = ensure(); if(!c) return;
    const t = c.currentTime + (o.at || 0), dur = o.dur || .12;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f || 440, t);
    if(o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t + (o.glide || dur));
    env(g, t, o.gain == null ? .25 : o.gain, o.attack || .004, dur);
    let node = osc;
    if(o.filter){
      const fl = c.createBiquadFilter();
      fl.type = o.filter; fl.frequency.value = o.ff || 1200; fl.Q.value = o.q || .8;
      osc.connect(fl); node = fl;
    }
    node.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + dur + .05);
  }
  // filtered noise: splashes, pops, whooshes
  function noise(o){
    const c = ensure(); if(!c) return;
    const t = c.currentTime + (o.at || 0), dur = o.dur || .15;
    const src = c.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    src.playbackRate.value = o.rate || 1;
    const fl = c.createBiquadFilter(); fl.type = o.filter || 'bandpass';
    fl.frequency.setValueAtTime(o.f || 1000, t);
    if(o.f1) fl.frequency.exponentialRampToValueAtTime(o.f1, t + dur);
    fl.Q.value = o.q || 1;
    const g = c.createGain(); env(g, t, o.gain == null ? .15 : o.gain, o.attack || .004, dur);
    src.connect(fl); fl.connect(g); g.connect(master);
    src.start(t, Math.random() * .5); src.stop(t + dur + .05);
  }
  // a small glass bell: fundamental plus inharmonic partials
  function bell(f, at, gain){
    gain = gain == null ? .18 : gain;
    tone({ f, at, dur: 1.1, gain, attack: .003 });
    tone({ f: f * 2.76, at, dur: .45, gain: gain * .35, attack: .002 });
    tone({ f: f * 5.4, at, dur: .2, gain: gain * .12, attack: .002 });
  }
  return { ensure, tone, noise, bell, get ctx(){ return ctx; } };
})();
function buzz(p){ if(data.settings.haptics && navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }
const click = () => audio.tone({ f: 900, f1: 1300, dur: .05, gain: .08, type: 'triangle' });

/* ---------- skill: adaptive difficulty shared by every game ----------
   The same model is copied into hexa-stack/index.html and
   roundabout/src/app.html, which also run on their own; keep the copies equal. */
// @skill-start ---------------------------------------------------------------
/* A Bayesian estimate of how good this player is, used to pick the heat of
   every level so each slot of the sawtooth is won about as often as it should
   be, whoever is playing.

   Model. Skill θ lives on the game's own heat scale. A player whose θ equals a
   level's heat h wins it half the time:      P(win | θ, h) = Φ((θ − h) / β).
   The belief about θ is a Gaussian N(mu, sd²), starting from a wide prior.

   Learning, after each attempt: assumed-density filtering, i.e. the Gaussian
   whose mean and variance match prior × probit likelihood exactly (the update
   TrueSkill uses):
       c = √(β² + sd²),  t = ±(mu − h)/c   (+ for a win, − for a loss)
       v = φ(t)/Φ(t),    w = v(v + t)
       mu ← mu ± v·sd²/c,   sd² ← sd²·(1 − w·sd²/c²)
   How cleanly a level was won (q, 0..1, 0.5 = "just about") is a second,
   noisier reading of θ: x = h + β·Φ⁻¹(q), folded in with a Kalman step of
   noise 1.5β. Skill drifts as people practise, so sd² grows by τ² first.

   Choosing a level. The posterior predictive chance of winning heat h is
       P(win | h) = Φ((mu − h) / √(β² + sd²)),
   so the heat that gives a target win rate p is
       h = mu − Φ⁻¹(p)·√(β² + sd²).
   The sawtooth is a list of target win rates: high on ordinary levels, about a
   coin flip on the 5th level of every ten, lower still on the 10th. While the
   game is unsure (a new player, large sd) the gaps widen on both sides. Every
   failed try at a level eases its target for the next try (mercy). */
const SKILL_TARGET = [.9, .86, .82, .78, .5, .88, .84, .8, .76, .36];
const SKILL_MERCY = .6;            // each failed try keeps this share of the target's miss chance
function skillPhi(x){              // standard normal CDF (Abramowitz–Stegun 7.1.26 on erf)
  const z = Math.abs(x) / Math.SQRT2, t = 1 / (1 + .3275911 * z);
  const e = 1 - t * (.254829592 + t * (-.284496736 + t * (1.421413741 + t * (-1.453152027 + t * 1.061405429)))) * Math.exp(-z * z);
  return x >= 0 ? .5 * (1 + e) : .5 * (1 - e);
}
const skillPdf = x => Math.exp(-x * x / 2) / 2.5066282746310002;
function skillPhiInv(p){           // inverse normal CDF (Acklam), p clamped to (1e-9, 1 − 1e-9)
  p = Math.min(1 - 1e-9, Math.max(1e-9, p));
  const a = [-39.69683028665376, 220.9460984245205, -275.9285104469687, 138.357751867269, -30.66479806614716, 2.506628277459239];
  const b = [-54.47609879822406, 161.5858368580409, -155.6989798598866, 66.80131188771972, -13.28068155288572];
  const c = [-.007784894002430293, -.3223964580411365, -2.400758277161838, -2.549732539343734, 4.374664141464968, 2.938163982698783];
  const d = [.007784695709041462, .3224671290700398, 2.445134137142996, 3.754408661907416];
  if(p < .02425){ const q = Math.sqrt(-2 * Math.log(p)); return (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1); }
  if(p > 1 - .02425){ const q = Math.sqrt(-2 * Math.log(1 - p)); return -(((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1); }
  const q = p - .5, r = q * q;
  return (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q / (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1);
}
// cfg: { beta, mu0, sd0, drift }
function skillNew(cfg){ return { mu: cfg.mu0, sd: cfg.sd0, n: 0 }; }
function skillValid(s){ return !!s && isFinite(s.mu) && isFinite(s.sd) && s.sd > 0; }
function skillChance(s, h, cfg){ return skillPhi((s.mu - h) / Math.sqrt(cfg.beta * cfg.beta + s.sd * s.sd)); }
function skillTarget(pos, fails){ return 1 - (1 - SKILL_TARGET[pos]) * Math.pow(SKILL_MERCY, fails || 0); }
function skillHeat(s, p, cfg){ return s.mu - skillPhiInv(p) * Math.sqrt(cfg.beta * cfg.beta + s.sd * s.sd); }
function skillObserve(s, h, won, cfg){
  const b = cfg.beta, v0 = s.sd * s.sd + cfg.drift * cfg.drift;
  const c = Math.sqrt(b * b + v0), y = won ? 1 : -1, t = y * (s.mu - h) / c;
  const P = skillPhi(t), v = P > 1e-12 ? skillPdf(t) / P : -t, w = v * (v + t);
  s.mu += y * v0 / c * v;
  s.sd = Math.sqrt(v0 * Math.max(.02, 1 - v0 / (c * c) * w));
  s.n = (s.n | 0) + 1;
  return s;
}
function skillObserveQuality(s, h, q, cfg){
  const x = h + cfg.beta * skillPhiInv(Math.min(.97, Math.max(.03, q)));
  // a reading pinned at either end only says "at least" (or "at most") x
  if((q >= .95 && x < s.mu) || (q <= .05 && x > s.mu)) return s;
  const nu = 1.5 * cfg.beta, v0 = s.sd * s.sd, K = v0 / (v0 + nu * nu);
  s.mu += K * (x - s.mu); s.sd = Math.sqrt(v0 * (1 - K));
  return s;
}
// @skill-end -----------------------------------------------------------------
const skill = { TARGET: SKILL_TARGET, MERCY: SKILL_MERCY, create: skillNew, valid: skillValid, chance: skillChance,
  target: skillTarget, heat: skillHeat, observe: skillObserve, quality: skillObserveQuality, Phi: skillPhi, PhiInv: skillPhiInv };

/* ---------- ui: one sheet at a time, plus a toast ---------- */
const sheetEl = $('#sheet'), scrim = $('#scrim'), toastEl = $('#toast');
let sheetClose = null, toastTimer = 0;
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if(attrs) for(const [k, v] of Object.entries(attrs)){
    if(v == null || v === false) continue;
    if(k === 'class') el.className = v;
    else if(k === 'html') el.innerHTML = v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for(const kid of kids.flat()) if(kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
function closeSheet(){
  if(!sheetEl.classList.contains('on')) return;
  sheetEl.classList.remove('on'); scrim.classList.remove('on');
  const cb = sheetClose; sheetClose = null;
  if(cb) cb();
}
/* sheet({eyebrow, title, sub, body, actions:[{label, kind, onClick, keepOpen, disabled}], tone, dismiss, onClose}) */
function sheet(o){
  if(sheetEl.classList.contains('on')){ const cb = sheetClose; sheetClose = null; if(cb) cb(); }
  sheetEl.replaceChildren();
  sheetEl.dataset.tone = o.tone || '';
  sheetEl.append(h('div', { class: 'grab', 'aria-hidden': 'true' }));
  if(o.eyebrow) sheetEl.append(h('div', { class: 'eyebrow' }, o.eyebrow));
  sheetEl.append(h('h2', { id: 'sheetTitle' }, o.title || ''));
  if(o.sub) sheetEl.append(h('p', { class: 'sub' }, o.sub));
  if(o.body) sheetEl.append(o.body);
  if(o.actions && o.actions.length){
    const box = h('div', { class: 'actions' });
    for(const a of o.actions){
      const b = h('button', { class: 'btn btn-wide ' + (a.kind === 'ghost' ? 'btn-ghost btn-sm' : 'btn-' + (a.kind || 'primary')),
        id: a.id, disabled: a.disabled }, a.label);
      b.addEventListener('click', () => { click(); if(!a.keepOpen) closeSheet(); if(a.onClick) a.onClick(); });
      box.append(b);
    }
    sheetEl.append(box);
  }
  sheetClose = o.onClose || null;
  scrim.onclick = o.dismiss === false ? null : closeSheet;
  requestAnimationFrame(() => { sheetEl.classList.add('on'); scrim.classList.add('on'); });
  sheetEl.scrollTop = 0;
  return sheetEl;
}
function toast(msg, ms){
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('on'), ms || 1900);
}
function toggle(label, hint, get, set){
  const sw = h('button', { class: 'sw', role: 'switch', 'aria-checked': String(!!get()), 'aria-label': label }, h('i'));
  sw.addEventListener('click', () => { const v = !get(); set(v); sw.setAttribute('aria-checked', String(v)); click(); });
  return h('div', { class: 'set-row' }, h('div', null, h('div', { class: 'lab' }, label), hint ? h('div', { class: 'hint' }, hint) : null), sw);
}
// the shared settings rows; games append their own rows under these
function settingsRows(){
  const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Theme' });
  for(const [v, lab] of [['system', 'Auto'], ['light', 'Light'], ['dark', 'Dark']]){
    const b = h('button', { 'aria-pressed': String(data.settings.theme === v) }, lab);
    b.addEventListener('click', () => {
      data.settings.theme = v; store.save(); applyTheme(); click();
      for(const x of seg.children) x.setAttribute('aria-pressed', String(x === b));
    });
    seg.append(b);
  }
  return h('div', null,
    toggle('Sound', 'Every sound is synthesised live', () => data.settings.sound, v => { data.settings.sound = v; store.save(); if(v) audio.ensure(); }),
    toggle('Vibration', 'On phones that support it', () => data.settings.haptics, v => { data.settings.haptics = v; store.save(); if(v) buzz(20); }),
    h('div', { class: 'set-row' }, h('div', null, h('div', { class: 'lab' }, 'Theme'), h('div', { class: 'hint' }, 'Auto follows your device')), seg)
  );
}
function openSettings(extra){
  const body = h('div', null, settingsRows(), extra || null);
  const wipe = h('button', { class: 'btn btn-ghost btn-sm btn-wide', style: 'margin-top:14px;color:var(--bad)' }, 'Erase all saved progress');
  wipe.addEventListener('click', () => {
    click();
    sheet({ eyebrow: 'Erase progress', title: 'Start every game from scratch?', tone: 'bad',
      sub: 'Levels, coins and boosters in every Playbox game go back to zero. Settings stay.',
      actions: [
        { label: 'Erase everything', kind: 'hard', onClick: () => { store.wipe(); emit('wipe'); renderHome(); toast('Progress erased'); } },
        { label: 'Keep my progress', kind: 'ghost' }
      ] });
  });
  body.append(wipe);
  sheet({ eyebrow: 'Settings', title: 'Options', body, actions: [{ label: 'Done' }] });
}

/* ---------- registry + navigation ---------- */
const games = [];
let current = null;                              // { def, handle }
const home = $('#home'), stage = $('#stage');

/* A game definition: { id, title, tagline, order, card(el, save), status(save), cta(save), mount(stage, api) }.
   Set soon: true (and leave out mount) for a game that only has a board so far. */
function register(def){ games.push(def); if(booted) renderHome(); }
const PLAY_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
const LOCK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2.5" fill="currentColor" stroke="none"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
function boardFor(g, featured, i){
  const save = g.soon ? {} : store.game(g.id);
  const art = h('div', { class: 'board-art', 'aria-hidden': 'true' });
  try{ g.card && g.card(art, save, { featured }); }catch(e){ console.error(e); }
  if(g.soon) art.append(h('span', { class: 'board-lock', html: LOCK_ICON }));
  // small boards show only the first part of a status ("Level 4 · 120 coins" -> "Level 4")
  let status = g.soon ? 'Coming soon' : g.status ? g.status(save) : '';
  if(!featured) status = status.split(' · ')[0];
  const cta = g.soon ? null : h('span', { class: 'board-cta' },
    h('span', { html: PLAY_ICON, style: 'display:contents' }), h('span', { class: 'lbl' }, g.cta ? g.cta(save) : 'Play'));
  const el = h('button', {
    class: 'board' + (featured ? ' board-feature' : '') + (g.soon ? ' soon' : ''),
    'data-game': g.id, style: `--i:${i}`,
    'aria-label': g.soon ? `${g.title}, coming soon` : `Play ${g.title}`
  },
    art,
    h('div', { class: 'board-body' },
      h('div', { class: 'board-title' }, g.title),
      h('div', { class: 'board-tag' }, g.tagline),
      h('div', { class: 'board-foot' }, status ? h('span', { class: 'board-chip' }, status) : null, cta)));
  el.addEventListener('click', () => {
    click();
    if(!g.soon){ openGame(g.id); return; }
    el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope');
    buzz(12); toast(`${g.title} is coming soon`);
  });
  return el;
}
function renderHome(){
  const list = games.slice().sort((a, b) => (a.order == null ? 99 : a.order) - (b.order == null ? 99 : b.order));
  const ready = list.filter(g => !g.soon);
  const played = data.last && ready.find(g => g.id === data.last);
  const feature = played || ready[0] || null;
  const rest = list.filter(g => g !== feature);

  $('#featureSection').hidden = !feature;
  $('#featureLabel').textContent = played ? 'Jump back in' : 'Start here';
  $('#featureSlot').replaceChildren(...(feature ? [boardFor(feature, true, 0)] : []));

  const grid = $('#boardGrid');
  grid.replaceChildren(...rest.map((g, k) => boardFor(g, false, k + 1)));
  if(rest.length % 2) grid.lastChild.classList.add('wide');     // never leave a board alone in a row
  $('#moreSection').hidden = !rest.length;
  $('#moreLabel').textContent = feature ? 'More games' : 'Games';
  const soon = list.length - ready.length;
  $('#moreCount').textContent = soon ? `${soon} coming soon` : `${rest.length}`;

  $('#homeTitle').textContent = played ? 'Welcome back' : 'Pick a game';
  $('#homeSub').textContent = played ? `${played.title} is right where you left it.` : 'Short puzzles that remember where you left off.';
}
/* ---------- games built elsewhere, run in a frame ----------
   A game that already exists as its own page (elsewhere in the repo) doesn't
   need porting: the build embeds that page as base64 (see build.sh), and
   framedGame() returns a mount() that runs it in a same-origin frame filling the
   stage. `head`/`body` are HTML snippets added before </head> and </body>, the
   place for small bridges into the game. The game leaves by posting
   {playbox: 'exit'} to its parent; exitButton() builds a script that adds a
   back button doing that. */
function decodePage(b64){
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function framedGame(o){
  return function mount(stage, api){
    let html = o.page ? decodePage(o.page)
      : `<p style="font:16px system-ui;color:#fff;padding:24px">${o.title} isn’t built into this page. Run playbox/build.sh.</p>`;
    if(o.head){ const i = html.search(/<\/head>/i); html = i < 0 ? o.head + html : html.slice(0, i) + o.head + html.slice(i); }
    if(o.body){ const i = html.toLowerCase().lastIndexOf('</body>'); html = i < 0 ? html + o.body : html.slice(0, i) + o.body + html.slice(i); }
    const frame = h('iframe', { class: 'pb-frame', title: o.title });
    frame.style.background = o.background || '#000';
    frame.srcdoc = html;
    stage.append(frame);
    const onMessage = e => { if(e.source === frame.contentWindow && e.data && e.data.playbox === 'exit') api.exit(); };
    window.addEventListener('message', onMessage);
    frame.addEventListener('load', () => { try{ frame.contentWindow.focus(); }catch(e){} });
    return { unmount(){ window.removeEventListener('message', onMessage); frame.remove(); } };
  };
}
/* exitButton({ into: CSS selector of the row to put it in, className: the game's own button class, size }) */
function exitButton(o){
  const size = o.size || 22;
  const svg = `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`;
  return '<script>(function(){function add(){' +
    'var row=document.querySelector(' + JSON.stringify(o.into) + ');if(!row||document.getElementById("pbBack"))return;' +
    'var b=document.createElement("button");b.id="pbBack";b.type="button";b.className=' + JSON.stringify(o.className || '') + ';' +
    'b.setAttribute("aria-label","Back to Playbox");b.title="Back to Playbox";b.innerHTML=' + JSON.stringify(svg) + ';' +
    'b.addEventListener("click",function(e){e.stopPropagation();parent.postMessage({playbox:"exit"},"*");});' +
    'row.insertBefore(b,row.firstChild);}' +
    'if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",add);else add();})();<\/script>';
}

function openGame(id, opts){
  const def = games.find(g => g.id === id);
  if(!def || def.soon) return;
  audio.ensure();
  if(current) closeGame(true);
  data.last = id; store.save();
  stage.replaceChildren();
  stage.hidden = false; home.hidden = true;
  stage.classList.remove('enter'); void stage.offsetWidth; stage.classList.add('enter');
  const api = {
    save: store.game(id),
    persist: now => store.save(now),
    audio, buzz, click, skill, ui: { sheet, closeSheet, toast, h, toggle, openSettings },
    settings: data.settings,
    on, exit: () => closeGame()
  };
  current = { def, handle: def.mount(stage, api, opts || {}) || {} };
  try{ history.replaceState(null, '', '#' + id); }catch(e){}
}
function closeGame(silent){
  if(!current) return;
  closeSheet();
  try{ current.handle.unmount && current.handle.unmount(); }catch(e){ console.error(e); }
  current = null;
  stage.replaceChildren(); stage.hidden = true;
  store.save(true);
  if(silent) return;
  home.hidden = false; renderHome();
  home.classList.remove('enter'); void home.offsetWidth; home.classList.add('enter');
  try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
}
$('#homeSettings').addEventListener('click', () => { click(); openSettings(); });
on('theme', () => { if(booted && !home.hidden) renderHome(); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && sheetEl.classList.contains('on')) closeSheet();
});

let booted = false;
function boot(){
  booted = true;
  applyTheme();
  renderHome();
  const want = (location.hash || '').slice(1);
  if(want && games.some(g => g.id === want)) openGame(want);
}
window.Playbox = { register, store, audio, buzz, on, emit, ui: { sheet, closeSheet, toast, h }, boot, openGame, framedGame, exitButton, skill };
})();
</script>

<script>
/* ==========================================================
   CAKE SORT — drop plates of cake slices onto the counter;
   matching slices fly together until six make a whole cake.
   0 engine (pure, headless-testable) · 1 cakes · 2 drawing
   3 sound · 4 game · 5 board art · 6 register
   ========================================================== */
(function(){
'use strict';

// @engine-start ------------------------------------------------------------
// Everything between the engine markers is pure: no DOM, no Playbox. The
// balance probe (tools/cake-probe.mjs) evaluates this slice on its own in Node.

const CAP = 6;                                  // slices in a whole cake
const COLS = 4, ROWS = 5, CELLS = COLS * ROWS;  // the counter
const TRAY = 3;                                 // plates offered at a time
const BLOCKED = -1;                             // a cell with a cake stand on it
// the level where each cake first joins the menu (index = cake type)
const UNLOCK_AT = [1, 1, 1, 3, 5, 8, 12, 16, 21, 27];

/* Mulberry32 with its state in an object, so a level in progress (and every
   undo snapshot) can store exactly where the plate dealer has got to. */
function rngNext(st){
  st.s = (st.s + 0x6D2B79F5) | 0;
  let t = Math.imul(st.s ^ (st.s >>> 15), 1 | st.s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function seedFor(n, salt){
  let h = (0x9E3779B9 ^ Math.imul(n | 0, 0x85EBCA6B) ^ Math.imul((salt | 0) + 1, 0xC2B2AE35)) >>> 0;
  h ^= h >>> 16; h = Math.imul(h, 0x7FEB352D);
  h ^= h >>> 15; h = Math.imul(h, 0x846CA68B);
  h ^= h >>> 16; return h >>> 0;
}
function shuffle(a, rs){
  for(let i = a.length - 1; i > 0; i--){ const j = (rngNext(rs) * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

/* ---- difficulty ----
   Every knob of a level follows one number, its heat h. Which heat a level
   gets is the adaptive model's call (Playbox.skill, in the shell): it aims
   each slot of a block of ten at a target win rate for this player, so the
   5th level (hard) and the 10th (super hard) still spike, relative to how
   well this player plays. baseHeat(n) is the sawtooth a typical new player
   starts on, and the heat used when no model is given (the probe, tests). */
const RAMP = [0, .4, .8, 1.2, 2.4, .5, .9, 1.3, 1.7, 3.4];
const BLOCK_STEP = .6;
const HEAT_MAX = 10;
const STAND_WORTH = .5;                         // heat one cake stand is worth; the other knobs give it back
const BASE_BLOCKS = 8;                          // the typical curve stops climbing after this many blocks
const blockOf = n => Math.min(BASE_BLOCKS, Math.floor((Math.max(1, n | 0) - 1) / 10));
const baseHeat = n => { n = Math.max(1, n | 0); return blockOf(n) * BLOCK_STEP + RAMP[(n - 1) % 10]; };
// how far the model may move a level: never below 2.5 under the start of its
// block of ten (so later levels never fall all the way back to the first ones),
// never above 4 over the block's hardest level
function heatRange(n){ const start = blockOf(n) * BLOCK_STEP; return [Math.max(0, start - 2.5), Math.min(HEAT_MAX, start + RAMP[9] + 4)]; }

function spec(n, h){
  n = Math.max(1, n | 0);
  const block = Math.floor((n - 1) / 10), pos = (n - 1) % 10;
  const tier = pos === 9 ? 2 : pos === 4 ? 1 : 0;           // 0 normal · 1 hard · 2 super hard
  const heat = Math.min(HEAT_MAX, Math.max(0, h == null ? baseHeat(n) : +h));
  const pool = UNLOCK_AT.filter(u => u <= n).length;
  // cake stands come with heat; a hard level always has one and a super-hard
  // level two. Each stand spends STAND_WORTH of the heat; the rest drives the
  // other knobs, so the level's overall difficulty still follows h smoothly.
  const blocked = n < 4 ? 0 : Math.min(4, Math.max(tier, heat >= 3.5 ? 1 + Math.floor((heat - 3.5) / 2) : 0));
  const k = Math.max(0, heat - blocked * STAND_WORTH);
  return {
    n, block, pos, tier, heat, pool, blocked,
    K: n === 1 ? 3 : Math.max(3, Math.min(pool, 8, Math.round(3.2 + k * .5))),
    goal: n === 1 ? 3 : Math.max(5, Math.min(26, Math.round(6 + k * 2.2))),
    pre: n < 3 ? 0 : Math.min(6, 2 + Math.floor(k * .8)),
    mix: Math.min(.7, .28 + k * .07),                       // chance a plate holds a second cake
    mix3: Math.min(.3, Math.max(0, k - 1.5) * .07),         // and a third
    help: Math.max(.3, .64 - k * .06),                      // chance a new plate's cake is one already out
    big: Math.min(.5, .12 + k * .05),                       // chance of a 4- or 5-slice plate
    reward: tier === 2 ? 60 : tier === 1 ? 30 : 10
  };
}

/* ---- board helpers ---- */
const isPlate = v => Array.isArray(v);
function neighbours(c){
  const x = c % COLS, y = (c / COLS) | 0, out = [];
  if(y > 0) out.push(c - COLS);
  if(x > 0) out.push(c - 1);
  if(x < COLS - 1) out.push(c + 1);
  if(y < ROWS - 1) out.push(c + COLS);
  return out;
}
function countOf(p, f){ let k = 0; for(const x of p) if(x === f) k++; return k; }
function kindsOf(p){ const out = []; for(const x of p) if(!out.includes(x)) out.push(x); return out; }
const isCake = p => p.length === CAP && p.every(x => x === p[0]);
// slices of f leave from the end of their group and arrive after it, so each
// plate keeps every cake type in one run of neighbouring slots
function takeSlices(p, f, k){
  for(let i = p.length - 1; i >= 0 && k > 0; i--) if(p[i] === f){ p.splice(i, 1); k--; }
}
function addSlices(p, f, k){
  const at = p.lastIndexOf(f);
  const ins = Array(k).fill(f);
  if(at < 0) p.push(...ins); else p.splice(at + 1, 0, ...ins);
}
const emptyCells = cells => { const out = []; for(let c = 0; c < CELLS; c++) if(cells[c] === null) out.push(c); return out; };

/* ---- the sort ----
   A plate that changes looks at each cake type it holds. Among itself and the
   neighbours holding the same cake, the plate that can end up with the most
   slices of it becomes the gathering point, and the slices on the plates next
   to it fly over, smallest groups first, as far as there is room. A transfer
   happens only if it leaves more slices together than any plate that gives
   them up had, so the sort always settles. Six slices of one cake make a
   whole cake, which is served (taken off the board); a plate left empty goes
   too. Every plate a transfer touches is checked again, so sorting chains. */
function bestGather(cells, c){
  const p = cells[c];
  let best = null;
  for(const f of kindsOf(p)){
    const cands = [c];
    for(const n of neighbours(c)) if(isPlate(cells[n]) && cells[n].includes(f)) cands.push(n);
    if(cands.length < 2) continue;
    for(const d of cands){
      const pd = cells[d], cd = countOf(pd, f), room = CAP - pd.length;
      if(room <= 0) continue;
      let srcs = [];
      for(const n of neighbours(d)){
        const q = cells[n];
        if(isPlate(q) && !isCake(q)){ const k = countOf(q, f); if(k) srcs.push([n, k]); }
      }
      srcs.sort((a, b) => a[1] - b[1] || a[0] - b[0]);
      let from, final;
      for(;;){
        from = []; let left = room;
        for(const [n, k] of srcs){ if(!left) break; const take = Math.min(k, left); from.push([n, take, k]); left -= take; }
        final = cd + room - left;
        const keep = srcs.filter(([, k]) => k < final);
        if(keep.length === srcs.length) break;
        srcs = keep;
      }
      if(!from.length) continue;
      const others = pd.length - cd;
      const cake = final === CAP && others === 0;
      const moved = final - cd;
      // completes a cake > most slices together > fewest other cakes on the
      // gathering plate > fewest slices flown > the plate that changed
      const key = [cake ? 1 : 0, final, -others, -moved, d === c ? 1 : 0];
      if(!best || cmpKey(key, best.key) > 0) best = { key, f, d, from: from.map(([n, take]) => [n, take]) };
    }
  }
  return best;
}
function cmpKey(a, b){ for(let i = 0; i < a.length; i++) if(a[i] !== b[i]) return a[i] - b[i]; return 0; }

/* Settle the board after the plate at `start` changed. Mutates `cells` and
   returns the steps in the order they should play: each step is one gathering
   ({d, f, from: [[cell, slices]], cake, emptied}). */
function resolve(cells, start){
  const steps = [], queue = [start];
  let guard = 0;
  while(queue.length && guard < 400){
    const c = queue.shift();
    for(;;){
      if(++guard > 400) break;
      if(!isPlate(cells[c]) || isCake(cells[c])) break;
      const g = bestGather(cells, c);
      if(!g) break;
      const touched = [g.d];
      for(const [n, k] of g.from){ takeSlices(cells[n], g.f, k); addSlices(cells[g.d], g.f, k); touched.push(n); }
      const step = { d: g.d, f: g.f, from: g.from, cake: false, emptied: [] };
      for(const [n] of g.from) if(!cells[n].length){ cells[n] = null; step.emptied.push(n); }
      if(isCake(cells[g.d])){ step.cake = true; cells[g.d] = null; }
      steps.push(step);
      for(const t of touched) if(t !== c && isPlate(cells[t]) && !queue.includes(t)) queue.push(t);
      if(!isPlate(cells[c])) break;
    }
  }
  return steps;
}

/* ---- dealing plates ---- */
function makePlate(cells, sp, flv, rs){
  const r = () => rngNext(rs);
  let n;
  const u = r();
  if(u < sp.big) n = r() < .7 ? 4 : 5;
  else n = u < sp.big + (1 - sp.big) * .22 ? 1 : u < sp.big + (1 - sp.big) * .62 ? 2 : 3;
  let kinds = 1;
  if(n >= 2 && r() < sp.mix) kinds = 2;
  if(n >= 3 && kinds === 2 && r() < sp.mix3) kinds = 3;
  // what's already out, weighted by how many slices of it there are
  const out = new Map();
  for(const p of cells) if(isPlate(p)) for(const f of p) out.set(f, (out.get(f) || 0) + 1);
  const chosen = [];
  while(chosen.length < kinds){
    let f = -1;
    if(out.size && r() < sp.help){
      let tot = 0; for(const [g, k] of out) if(!chosen.includes(g)) tot += k;
      let x = r() * tot;
      for(const [g, k] of out){ if(chosen.includes(g)) continue; x -= k; if(x < 0){ f = g; break; } }
    }
    if(f < 0){ const left = flv.filter(g => !chosen.includes(g)); f = left[(r() * left.length) | 0]; }
    chosen.push(f);
  }
  const counts = chosen.map(() => 1);
  for(let k = kinds; k < n; k++) counts[(r() * kinds) | 0]++;
  const plate = [];
  chosen.forEach((f, i) => { for(let k = 0; k < counts[i]; k++) plate.push(f); });
  return plate;
}
function deal(L){
  if(L.tray.some(Boolean)) return false;
  for(let t = 0; t < TRAY; t++) L.tray[t] = makePlate(L.cells, L.sp, L.flv, L.rs);
  return true;
}

/* Build level n: which cakes are on the menu, the cake stands in the way, a
   few plates already out, and the first tray. Deterministic per level number,
   so a restart replays the same opening (the plates after that follow from
   where you put things). */
function newLevel(n, h){
  const sp = spec(n, h), rs = { s: seedFor(n, 11 + Math.round(sp.heat * 20)) | 0 };
  const pool = UNLOCK_AT.map((u, f) => u <= n ? f : -1).filter(f => f >= 0);
  const newest = pool.filter(f => UNLOCK_AT[f] === n && n > 1);
  const rest = shuffle(pool.filter(f => !newest.includes(f)), rs);
  const flv = newest.concat(rest).slice(0, sp.K).sort((a, b) => a - b);
  const cells = Array(CELLS).fill(null);
  // cake stands: never in the bottom row, never two side by side

function botMove(L, skill, rand){

    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(x => Math.round(x + (t - x) * k));
    v = `rgb(${c[0]},${c[1]},${c[2]})`;

      ctx.beginPath(); ctx.ellipse(cx - R * .06, cy - ry * .06, R * .66, ry * .62, 0, Math.PI * 1.08, Math.PI * 1.62); ctx.stroke();

      for(const k of [.36, .7]){ ctx.beginPath(); ctx.ellipse(cx, cy, R * k, ry * k, 0, 0, TAU); ctx.stroke(); }

/* side shading: darker toward both edges of the cake, a little light on the left */
function sideShade(ctx, x, R){
  const g = ctx.createLinearGradient(x - R, 0, x + R, 0);
  g.addColorStop(0, 'rgba(0,0,0,.2)'); g.addColorStop(.3, 'rgba(255,255,255,.06)');
  g.addColorStop(.6, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.3)');

}
/* a porcelain plate centred at (x, y) */
function drawPlate(ctx, x, y, pr, th){
  const ry = pr * SQ;
  ctx.fillStyle = th.shadow; ell(ctx, x + pr * .05, y + ry * .26, pr * 1.02, ry * 1.02); ctx.fill();
  ctx.fillStyle = th.plateEdge; ell(ctx, x, y + pr * .075, pr, ry); ctx.fill();
  ctx.fillStyle = th.plate; ell(ctx, x, y, pr, ry); ctx.fill();
  ctx.strokeStyle = th.plateLine; ctx.lineWidth = Math.max(1, pr * .035); ell(ctx, x, y, pr * .87, ry * .87); ctx.stroke();

/* slices given as [cake, start angle], drawn back to front */
function drawSlices(ctx, x, y, R, list, th, flame){
  const H = R * CAKE_H;
  list.sort((p, q) => Math.sin(p[1] + SEG / 2) - Math.sin(q[1] + SEG / 2));
  const o = { edge: th.edge, sideShade: sideShade(ctx, x, R), flame };

/* a glass cloche on a stand, with a cupcake inside: a cell nothing can go on */
function drawCloche(ctx, x, y, pr, th){
  const ry = pr * SQ;
  ctx.fillStyle = th.shadow; ell(ctx, x + pr * .05, y + ry * .2, pr * .86, ry * .86); ctx.fill();
  ctx.fillStyle = th.plateEdge; ell(ctx, x, y + pr * .07, pr * .82, ry * .82); ctx.fill();
  ctx.fillStyle = th.plate; ell(ctx, x, y, pr * .82, ry * .82); ctx.fill();

  const cy = y - pr * .02, w = pr * .3;
  ctx.fillStyle = '#F6A8C2';
  ctx.beginPath(); ctx.moveTo(x - w, cy - w * 1.05); ctx.lineTo(x + w, cy - w * 1.05); ctx.lineTo(x + w * .74, cy); ctx.lineTo(x - w * .74, cy); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = Math.max(.6, pr * .025);

  ctx.fillStyle = '#FFF4F8'; ell(ctx, x, cy - w * 1.15, w * 1.1, w * .5); ctx.fill();
  ell(ctx, x, cy - w * 1.55, w * .8, w * .42); ctx.fill();
  ell(ctx, x, cy - w * 1.9, w * .45, w * .3); ctx.fill();
  ctx.fillStyle = '#E3263D'; ell(ctx, x, cy - w * 2.2, w * .24, w * .24); ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = Math.max(1, pr * .07); ctx.lineCap = 'round';

  ctx.fillStyle = th.plateEdge; ell(ctx, x, y - dh - pr * .06, pr * .1, pr * .08); ctx.fill();

/* a whole cake on a plate, for icons and the lobby; rot turns it */
function drawWholeCake(ctx, x, y, pr, f, th, rot){
  drawPlate(ctx, x, y, pr, th);

  for(let i = 0; i < 6; i++) list.push([f, slotAngle(i) + (rot || 0)]);

}

/* ==================== 3. sound ==================== */
function makeSfx(A){
  const penta = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28];
  const note = (base, semi) => base * Math.pow(2, semi / 12);
  return {
    pick(){ A.tone({ f: 1760, dur: .05, gain: .05, type: 'triangle' }); A.tone({ f: 520, f1: 780, dur: .08, gain: .1 }); },
    drop(){ A.tone({ f: 640, f1: 420, dur: .08, gain: .08 }); },
    // porcelain on the counter: a bright knock with a short ring
    place(){
      A.noise({ f: 2600, dur: .05, gain: .16, q: 3 });
      A.tone({ f: 340, f1: 230, dur: .1, gain: .18 });
      A.tone({ f: 2350, dur: .22, gain: .035, type: 'triangle', at: .01 });
    },
    // a slice takes off: a soft rising whoosh
    whoosh(at){ A.noise({ filter: 'bandpass', f: 500, f1: 2600, dur: .26, gain: .06, q: 1.2, at, attack: .05 }); },
    // and lands: a plucked note that climbs as the plate fills
    land(k, at){
      const f = note(392, penta[clamp(k, 0, penta.length - 1)]);
      A.tone({ f, f1: f * 1.01, dur: .16, gain: .13, type: 'triangle', at });
      A.tone({ f: f * 2, dur: .08, gain: .04, at });
      A.noise({ filter: 'lowpass', f: 900, dur: .05, gain: .05, at });
    },
    // the turntable spins
    spin(at){ A.tone({ f: 260, f1: 620, dur: .3, gain: .035, type: 'triangle', at, attack: .04 }); },
    cake(combo){
      const base = note(523.25, penta[clamp(combo, 0, 6)]);
      [0, 4, 7, 12].forEach((s, i) => A.bell(note(base, s), i * .06, .12));
      A.noise({ filter: 'highpass', f: 6000, dur: .5, gain: .05, at: .05, attack: .04 });
    },
    served(){ A.tone({ f: 1318.5, dur: .06, gain: .05, type: 'square', filter: 'lowpass', ff: 3800 }); A.tone({ f: 1975.5, dur: .12, gain: .05, type: 'square', at: .05, filter: 'lowpass', ff: 3800 }); },
    empty(at){ A.tone({ f: 980, f1: 340, dur: .07, gain: .08, at }); },
    deal(){ [0, 1, 2].forEach(i => { A.noise({ f: 1400 + i * 300, f1: 2400, dur: .07, gain: .05, q: 2, at: i * .07 }); A.tone({ f: 700 + i * 90, dur: .05, gain: .04, at: i * .07 + .02 }); }); },
    bonk(){ A.tone({ f: 190, f1: 105, dur: .18, gain: .2, type: 'square', filter: 'lowpass', ff: 650 }); },
    smash(){
      A.tone({ f: 150, f1: 55, dur: .22, gain: .3 });
      for(let k = 0; k < 6; k++) A.noise({ filter: 'highpass', f: 3500 + k * 600, dur: .05 + k * .015, gain: .1, at: k * .025 });
      A.noise({ filter: 'lowpass', f: 900, dur: .2, gain: .14 });
    },
    undo(){ A.noise({ f: 2600, f1: 480, dur: .22, gain: .12, q: 1.4 }); A.tone({ f: 700, f1: 420, dur: .14, gain: .06 }); },
    refresh(){ [0, 1, 2].forEach(i => A.noise({ f: 900, f1: 2600, dur: .12, gain: .07, q: 1.5, at: i * .08 })); },
    win(){
      [0, 4, 7, 12, 16, 19].forEach((s, i) => A.bell(note(523.25, s), i * .085, .15));
      A.noise({ filter: 'highpass', f: 5500, dur: .9, gain: .04, at: .4, attack: .1 });
      A.tone({ f: 130.8, f1: 131, dur: .9, gain: .12, type: 'triangle', at: .5 });
    },
    full(){ [7, 4, 0].forEach((s, i) => A.tone({ f: note(330, s), dur: .22, gain: .08, type: 'triangle', at: i * .12 })); },
    coin(i){
      A.tone({ f: 1318.5, dur: .06, gain: .05, type: 'square', at: i * .055, filter: 'lowpass', ff: 3800 });
      A.tone({ f: 1975.5, dur: .12, gain: .05, type: 'square', at: i * .055 + .05, filter: 'lowpass', ff: 3800 });
    },
    unlock(){ [0, 7, 12, 16, 19, 24].forEach((s, i) => A.bell(note(659.25, s), i * .07, .1)); },
    hard(tier){
      A.tone({ f: 140, f1: 48, dur: .4, gain: .4 }); A.noise({ filter: 'lowpass', f: 400, dur: .2, gain: .2 });
      A.tone({ f: 140, f1: 48, dur: .4, gain: .35, at: .22 }); A.noise({ filter: 'lowpass', f: 400, dur: .2, gain: .18, at: .22 });
      const chord = tier === 2 ? [0, 3, 6, 10] : [0, 3, 7];
      chord.forEach((s, i) => A.tone({ f: note(196, s), dur: 1.1, gain: .07, type: 'sawtooth', filter: 'lowpass', ff: 900, at: .44 + i * .02, attack: .08 }));
    }
  };
}

  /* One queue of steps for the whole counter. The engine settles a placement

  let queue = [], playing = false, gen = 0;

  }

  /* ---------- HUD ---------- */

    bind('lobbyNote', S.stats.cakes
      ? `${S.stats.cakes} cake${S.stats.cakes === 1 ? '' : 's'} baked · ${S.stats.won} level${S.stats.won === 1 ? '' : 's'} cleared`
      : 'Drag plates of cake slices onto the counter. Matching slices fly together into whole cakes.');
    ref('lobby').querySelector('.cs-lobby-note').append(h('span', { class: 'cs-tuned' }, ' Levels adjust to how you play.'));
  }

  /* ---------- input ---------- */
  const pt = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  function hitTray(x, y){
    let best = -1, bd = pr * 1.35;
    trayXs.forEach((tx, i) => { if(!L.tray[i] || inFlight(i)) return; const d = Math.hypot(tx - x, (trayY - y) / .85); if(d < bd){ bd = d; best = i; } });
    return best;
  }
  function hitCell(x, y){
    for(let c = 0; c < CELLS; c++){
      const dx = (x - cellX(c)) / (cw * .5), dy = (y - cellY(c) + pr * .2) / (rp * .5);
      if(Math.abs(dx) <= 1 && Math.abs(dy) <= 1) return c;
    }
    return -1;
  }
  cv.addEventListener('pointerdown', e => {
    if(view !== 'play' || !L || e.button > 0 || L.won) return;
    A.ensure();
    const [x, y] = pt(e);
    if(hammer){
      const c = hitCell(x, y);
      if(c >= 0 && isPlate(L.cells[c])) smash(c);
      return;
    }
    if(busy) return;
    const t = hitTray(x, y);
    if(t >= 0){
      kc = -1;
      drag = { t, x: trayXs[t], y: trayY, sx: x, sy: y, ox: trayXs[t] - x, oy: trayY - y, moved: false, target: -1, wasSel: sel === t };
      sel = -1;
      try{ cv.setPointerCapture(e.pointerId); }catch(err){}
      sfx.pick(); buzz(5); kick();
      return;
    }
    if(sel >= 0){
      const c = hitCell(x, y);
      if(c >= 0 && L.cells[c] === null) putDown(sel, c, trayXs[sel], trayY, cw * .16);
      else { sel = -1; sfx.drop(); }
      kick();
    }
  });
  cv.addEventListener('pointermove', e => {
    if(!drag) return;
    const [x, y] = pt(e);
    if(!drag.moved && Math.hypot(x - drag.sx, y - drag.sy) > 8) drag.moved = true;
    if(!drag.moved) return;
    // the plate rides above the finger so it stays visible
    drag.x = x + drag.ox * .3; drag.y = y - cw * .45 + drag.oy * .3;
    const tg = emptyTarget(drag.x, drag.y + cw * .15);
    if(tg !== drag.target){ drag.target = tg; if(tg >= 0) A.tone({ f: 1200, dur: .03, gain: .025, type: 'triangle' }); }
    kick();
  });
  const endDrag = e => {
    if(!drag) return;
    const d = drag; drag = null;
    try{ cv.releasePointerCapture(e.pointerId); }catch(err){}
    if(!d.moved){ sel = d.wasSel ? -1 : d.t; if(sel >= 0) kc = -1; kick(); return; }   // a tap picks the plate up
    if(d.target >= 0) putDown(d.t, d.target, d.x, d.y, cw * .2);
    else {                                                                              // back to the tray
      movers.push({ t: d.t, x0: d.x, y0: d.y, x1: trayXs[d.t], y1: trayY, lift: cw * .2, t0: now(), dur: 180, done: () => {} });
      sfx.drop();
    }
    kick();
  };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  function onKey(e){
    if(view !== 'play' || !L || e.metaKey || e.ctrlKey || e.altKey || L.won) return;
    if(document.querySelector('#sheet.on')) return;
    const k = e.key.toLowerCase();
    if(k === '1' || k === '2' || k === '3'){
      const t = +k - 1;
      if(L.tray[t] && !busy && !inFlight(t)){ sel = sel === t ? -1 : t; if(sel >= 0){ sfx.pick(); if(kc < 0) kc = L.cells.indexOf(null); } kick(); }
      e.preventDefault(); return;
    }
    if(k.startsWith('arrow')){
      if(kc < 0) kc = 0;
      else {
        const x = kc % COLS, y = (kc / COLS) | 0;
        if(k === 'arrowleft' && x > 0) kc--; if(k === 'arrowright' && x < COLS - 1) kc++;
        if(k === 'arrowup' && y > 0) kc -= COLS; if(k === 'arrowdown' && y < ROWS - 1) kc += COLS;
      }
      kick(); e.preventDefault(); return;
    }
    if((k === 'enter' || k === ' ') && kc >= 0){
      if(hammer){ if(isPlate(L.cells[kc])) smash(kc); }
      else if(sel >= 0 && L.cells[kc] === null) putDown(sel, kc, trayXs[sel], trayY, cw * .16);
      e.preventDefault(); return;
    }
    if(k === 'u') undo(); else if(k === 'h') toggleHammer(); else if(k === 'n') refresh();
    else if(k === 'escape'){ if(hammer) setHammer(false); else if(sel >= 0){ sel = -1; kick(); } }
  }
  document.addEventListener('keydown', onKey);
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if(!b) return;
    const act = b.dataset.act;
    A.ensure();
    api.click();
    switch(act){
      case 'home': api.exit(); break;
      case 'settings': api.ui.openSettings(h('button', { class: 'btn btn-ghost btn-sm btn-wide', style: 'margin-top:12px', onclick: () => { api.click(); howTo(); } }, 'How to play Cake Sort')); break;
      case 'play': startLevel(S.level, false); break;
      case 'lobby': persist(); showView('lobby'); break;
      case 'menu': menu(); break;
      case 'undo': undo(); break;
      case 'hammer': toggleHammer(); break;
      case 'refresh': refresh(); break;
    }
  });
  const ro = new ResizeObserver(() => { if(view === 'play' && L){ layout(); } });
  ro.observe(playEl); ro.observe(field);
  const offTheme = api.on('theme', () => {
    theme = readTheme(el); sprites.clear();
    if(view === 'play' && L){ buildBg(); menuChips(ref('menuRow'), L.flv, shown); kick(); } else renderLobby();
  });
  const offWipe = api.on('wipe', () => { api.exit(); });
  const onVis = () => { if(!document.hidden) kick(); };
  document.addEventListener('visibilitychange', onVis);

  window.__cs = Object.assign(window.__cs || {}, {
    state: () => L && { cells: L.cells.map(p => isPlate(p) ? p.slice() : p), tray: L.tray.map(p => p && p.slice()), baked: L.baked, goal: L.sp.goal },
    level: () => L && L.n, view: () => view, won: () => !!(L && L.won),
    idle: () => !sorting() && !flyers.length && !served.length && !movers.length,
    sorting: () => sorting(),
    canPlace: (t, c) => !!(L && !busy && L.tray[t] && !inFlight(t) && free(c)),
    place: (t, c) => { if(L && !busy && L.tray[t] && !inFlight(t) && free(c)){ putDown(t, c, trayXs[t], trayY, 0); return true; } return false; },
    undo, hammer: c => { if(L && isPlate(L.cells[c])){ smash(c); } }, refresh,
    where: () => ({ tray: trayXs.map(x => [x, trayY]), cells: L ? L.cells.map((_, c) => [cellX(c), cellY(c)]) : [] }),
    save: () => JSON.parse(JSON.stringify({ level: S.level, coins: S.coins, inv: S.inv, stats: S.stats, baked: S.baked })),
    skill: () => Object.assign({ tries: S.tries }, S.skill), heatFor, heat: () => L && L.h,
    setSkill: (mu, sd) => { S.skill = Object.assign(SK.create(SKILL), { mu, sd: sd || S.skill.sd }); api.persist(); },     // dev
    play: n => { if(n){ S.level = Math.max(1, n); S.cur = null; } startLevel(S.level, !!n); }
  });

  showView('lobby');
  return {
    unmount(){
      persist();
      cancelAnimationFrame(raf); raf = 0;
      for(const id of timers) clearTimeout(id);
      ro.disconnect(); offTheme(); offWipe();
      document.removeEventListener('keydown', onKey);
      document.removeEventListener('visibilitychange', onVis);
    }
  };
}

/* ==================== 5. the shelf card ==================== */
function drawCard(box){
  const cv = document.createElement('canvas');
  box.classList.add('cs-card-art');
  box.append(cv);
  requestAnimationFrame(() => {
    const W = box.clientWidth, H = box.clientHeight;
    if(!W || !H) return;
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const th = readTheme(document.documentElement);
    // a strip of tablecloth
    const top = H * .34;
    ctx.fillStyle = th.cloth; ctx.fillRect(0, top, W, H - top);
    ctx.fillStyle = th.check;
    const st = Math.max(8, W / 22);
    for(let x = 0; x < W; x += st * 2) ctx.fillRect(x, top, st, H - top);
    for(let y = top; y < H; y += st * 2) ctx.fillRect(0, y, W, st);
    ctx.fillStyle = 'rgba(0,0,0,.06)'; ctx.fillRect(0, top, W, 3);
    const pr = Math.min(W / 7.4, H / 3.3);
    const plates = [
      [.17, .62, [2, 2, 2, 0]],
      [.5, .74, [0, 0, 0, 0, 0, 0], true],
      [.83, .62, [1, 1, 1, 1, 4]],
    ];
    for(const [fx, fy, fs] of plates){
      const x = W * fx, y = H * fy;
      drawPlate(ctx, x, y, pr, th);
      drawSlices(ctx, x, y, pr * CAKE_R, fs.map((f, i) => [f, slotAngle(i) + (fs.length === 6 ? .25 : 0)]), th);
    }
    // a strawberry slice spinning through the air, with a trail
    const sx = W * .32, sy = H * .3, R = pr * CAKE_R * 1.08;
    ctx.strokeStyle = th.accent; ctx.globalAlpha = .45; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.setLineDash([2, 7]);
    ctx.beginPath(); ctx.moveTo(W * .17 + pr * .5, H * .5); ctx.quadraticCurveTo(W * .2, H * .2, sx - R * .3, sy - R * .2); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(sx + R * .2, sy - R * .3, R * 1.05, Math.PI * 1.05, Math.PI * 1.6); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2; ctx.stroke();
    drawSlices(ctx, sx - R * .35, sy, R, [[2, -2.2]], th);
    // sparkles over the whole cake
    ctx.fillStyle = '#FFD45A';
    for(const [dx, dy, s] of [[.36, .4, 1], [.64, .36, .8], [.57, .26, .55]]){
      const x = W * dx, y = H * dy, r = pr * .14 * s;
      ctx.beginPath();
      for(let k = 0; k < 8; k++){ const rr = k % 2 ? r * .35 : r, a = k * Math.PI / 4; k ? ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.moveTo(x + rr, y); }
      ctx.closePath(); ctx.fill();
    }
  });
}

/* ==================== 6. register ==================== */
window.__cs = Object.assign(window.__cs || {}, { spec, newLevel, place, resolve, probe });
window.Playbox.register({
  id: 'cake-sort',
  title: 'Cake Sort',
  tagline: 'Slide plates together until every slice joins a whole cake.',
  order: 4,
  status: s => s.level > 1 ? `Level ${s.level} · ${(s.stats && s.stats.cakes) || 0} cakes` : 'New · 10 cakes to discover',
  cta: s => s.level > 1 || s.cur ? 'Continue' : 'Play',
  card: drawCard,
  mount
});
})();
</script>

<script>
/* Car Loop is Roundabout Rush, the standalone game in /roundabout. The build
   embeds its finished page (roundabout/index.html) here, and mount() runs it in
   a same-origin frame filling the Playbox stage (Playbox.framedGame). The game
   keeps its own screens and its own save ("roundabout-rush-v1" in localStorage);
   Playbox adds a back button to the game's home screen and reads the save for
   the board's chip.
   The board art is a roundabout seen from above: cars circling the ring and one
   waiting at the stop line for its gap. */
(function(){
'use strict';
const RING_R = 80, RING_r = 44, LANE = 62;
// angle on the ring (radians, clockwise from the right) and colour
const CARS = [[-.38 * Math.PI, '#EF4444'], [-.92 * Math.PI, '#3B82F6'], [.12 * Math.PI, '#F5B82E'], [.78 * Math.PI, '#8B5CF6']];

function car(ctx, x, y, rot, color){
  const L = 25, Wd = 13.5;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.roundRect(-L / 2 + 1.5, -Wd / 2 + 2, L, Wd, 4); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.roundRect(-L / 2, -Wd / 2, L, Wd, 4); ctx.fill();
  ctx.fillStyle = 'rgba(18,26,44,.78)';
  ctx.beginPath(); ctx.roundRect(L / 2 - 9.5, -Wd / 2 + 2, 5, Wd - 4, 1.5); ctx.fill();      // windscreen
  ctx.beginPath(); ctx.roundRect(-L / 2 + 3, -Wd / 2 + 2.5, 3, Wd - 5, 1); ctx.fill();         // rear window
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  ctx.beginPath(); ctx.roundRect(-L / 2 + 7, -Wd / 2 + 2.5, 8, Wd - 5, 2); ctx.fill();         // roof shine
  ctx.restore();
}

function draw(box){
  const cv = document.createElement('canvas');
  box.append(cv);
  requestAnimationFrame(() => {
    const W = box.clientWidth, H = box.clientHeight;
    if(!W || !H) return;
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#16244A'); bg.addColorStop(1, '#0B1222');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    // laid out in a 250 x 236 box; the entry road runs off the bottom edge
    const u = Math.min(W / 250, H / 236);
    ctx.translate(W / 2, H / 2 - 6 * u); ctx.scale(u, u);
    const road = '#323E66';

    // entry road, stop line, waiting car
    const bottom = (H / 2 + 6 * u) / u + 4;
    ctx.fillStyle = road; ctx.fillRect(-18, RING_R - 8, 36, bottom - RING_R + 8);
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(-16, RING_R + 4, 32, 3.5);
    car(ctx, 0, RING_R + 22, -Math.PI / 2, '#F4F4F5');

    // the ring
    ctx.beginPath(); ctx.arc(0, 0, RING_R, 0, Math.PI * 2); ctx.arc(0, 0, RING_r, 0, Math.PI * 2, true);
    ctx.fillStyle = road; ctx.fill('evenodd');
    ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, RING_R - 3.5, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, RING_r + 3.5, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([9, 9]); ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, LANE, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);

    // the island at night, with a dark tree
    ctx.fillStyle = '#0D1830';
    ctx.beginPath(); ctx.arc(0, 0, RING_r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1D4A37';
    for(const [x, y, r] of [[-6, -4, 15], [9, 2, 12], [-1, 9, 11]]){ ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    ctx.beginPath(); ctx.arc(-10, -9, 6, 0, Math.PI * 2); ctx.fill();

    // street lamps around the ring, and a few trees on the verge
    for(const a of [-2.4, -.75, .75, 2.4]){
      const x = Math.cos(a) * (RING_R + 14), y = Math.sin(a) * (RING_R + 14);
      const glow = ctx.createRadialGradient(x, y, 0, x, y, 26);
      glow.addColorStop(0, 'rgba(255,226,150,.30)'); glow.addColorStop(1, 'rgba(255,226,150,0)');
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FFE7A3'; ctx.beginPath(); ctx.arc(x, y, 2.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#1D4A37';
    for(const [x, y, r] of [[-108, -62, 9], [112, -30, 11], [-116, 40, 10], [104, 70, 8]]){ ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

    // cars going round clockwise, the first with speed lines behind it
    CARS.forEach(([a, color], k) => {
      const x = Math.cos(a) * LANE, y = Math.sin(a) * LANE;
      if(k === 0){
        ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        for(const dr of [-4, 4]){
          ctx.beginPath(); ctx.arc(0, 0, LANE + dr, a - .52, a - .3); ctx.stroke();
        }
      }
      car(ctx, x, y, a + Math.PI / 2, color);
    });
  });
}

<style>
/* ---------- Hex Tile Sort: Hexa Stack (../hexa-stack) running inside Playbox ---------- */
/* The game itself is dark plum with gold, so the board's art uses that palette
   in both themes; the board's chrome follows Playbox's light/dark tokens. */

    --b-accent:#FFC94A; --b-deep:#A86A0A; --b-soft:#3A2A10; --b-ink:#1A0B3B; --b-text:#FFD27A;
  }

}
</style>
<script>
/* Hex Tile Sort is Hexa Stack, the standalone game in /hexa-stack. The build
   embeds its page (hexa-stack/index.html) here and Playbox.framedGame runs it in
   a frame filling the stage. Two small bridges go into the page:
   - window.storage, which the game uses to keep its best score, backed by this
     device's localStorage (outside Claude the game would otherwise forget it);
   - a back button at the start of the game's header, in its own button style.
   The board art: stacks of hex tiles on a seven-cell board, one tile flipping
   across between two stacks of the same colour. */
(function(){
'use strict';
// the game's own colours: [top face, side]
const TILES = [['#FF5C63', '#B8353B'], ['#37D07A', '#1F8A4E'], ['#FFB522', '#B57A0B'],
               ['#A466FF', '#6C3BC0'], ['#26C0F2', '#147FA6'], ['#FF63B4', '#B53A7B']];
const R = 36, SQ = .6, T = 7, GAP = 1.07;           // hex radius, vertical squash, tile thickness
// axial cell -> stack, bottom to top
const STACKS = [
  [0, -1, [4, 4, 1]], [1, -1, [1, 1, 1, 1]], [-1, 0, [5, 0, 0]], [0, 0, [3, 3, 3, 0]],
  [1, 0, [2, 4, 4]], [-1, 1, []], [0, 1, [5, 5, 2, 2, 2]]
];

function hex(ctx, cx, cy, r, sq){
  ctx.beginPath();
  for(let k = 0; k < 6; k++){
    const a = Math.PI / 3 * k, x = cx + r * Math.cos(a), y = cy + r * Math.sin(a) * sq;
    k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}
function cellXY(q, r){ return [1.5 * R * q * GAP, Math.sqrt(3) * R * (r + q / 2) * GAP * SQ]; }

function draw(box){
  const cv = document.createElement('canvas');
  box.append(cv);
  requestAnimationFrame(() => {
    const W = box.clientWidth, H = box.clientHeight;
    if(!W || !H) return;
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#3A1B6E'); bg.addColorStop(.55, '#1C0E45'); bg.addColorStop(1, '#0B0722');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    // the drawing is laid out in a 270 x 230 box, centred and scaled to fit
    const u = Math.min(W / 270, H / 230);
    ctx.translate(W / 2 - 4 * u, H / 2 + 30 * u); ctx.scale(u, u);

    const tops = {};
    const cells = STACKS.map(([q, r, s]) => ({ q, r, s, xy: cellXY(q, r) })).sort((a, b) => a.xy[1] - b.xy[1]);
    for(const c of cells){
      const [x, y] = c.xy;
      hex(ctx, x, y + 3, R * .98, SQ);
      ctx.fillStyle = 'rgba(9,5,28,.62)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1.5; ctx.stroke();
      c.s.forEach((t, i) => {
        const yb = y - i * T, [top, side] = TILES[t];
        hex(ctx, x, yb, R * .9, SQ); ctx.fillStyle = side; ctx.fill();
        hex(ctx, x, yb - T, R * .9, SQ); ctx.fillStyle = top; ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1; ctx.stroke();
      });
      if(c.s.length){
        const yt = y - c.s.length * T;
        hex(ctx, x, yt, R * .62, SQ); ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 2; ctx.stroke();
      }
      tops[`${c.q},${c.r}`] = [x, y - c.s.length * T];
    }

    // a tile mid-flip from the centre stack onto its matching neighbour
    const [ax, ay] = tops['0,0'], [bx, by] = tops['-1,0'];
    const mx = (ax + bx) / 2, my = Math.min(ay, by) - 44;
    ctx.setLineDash([3, 5]); ctx.strokeStyle = 'rgba(255,233,163,.6)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ax + 6, ay - 4); ctx.quadraticCurveTo(ax + 4, my - 6, mx + 16, my - 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.save(); ctx.translate(mx, my); ctx.rotate(-.42);
    hex(ctx, 0, 0, R * .9, .26); ctx.fillStyle = TILES[0][1]; ctx.fill();
    hex(ctx, 0, -5, R * .9, .26); ctx.fillStyle = TILES[0][0]; ctx.fill();
    ctx.restore();
  });

const STORAGE_BRIDGE = '<script>(function(){if(window.storage)return;var p=' + JSON.stringify(STORE_PREFIX) + ';' +
  'window.storage={get:function(k){try{var v=localStorage.getItem(p+k);return Promise.resolve(v==null?null:{key:k,value:v});}catch(e){return Promise.resolve(null);}},' +
  'set:function(k,v){try{localStorage.setItem(p+k,String(v));}catch(e){}return Promise.resolve({key:k,value:String(v)});}};})();<\/script>';

  card: draw,
  mount: window.Playbox.framedGame({
    page: GAME_PAGE, title: 'Hex Tile Sort', background: '#0B0722',
    head: STORAGE_BRIDGE + window.Playbox.exitButton({ into: 'header', className: 'iconbtn', size: 20 })

});
