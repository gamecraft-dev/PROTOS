  /* ---------- playing ---------- */
  function tapVial(i){
    if(!L || L.won || view !== 'play' || i < 0 || i >= L.vials.length) return;
    A.ensure();
    const v = vs[i];
    if(v.busy){ return; }
    if(sel === -1){
      if(!L.vials[i].length){ v.shake = 1; sfx.tink(); kick(); return; }
      if(vialFull(i)){ v.shake = .6; sfx.tink(); kick(); return; }
      sel = i; sfx.pick(); buzz(6);
    } else if(sel === i){
      sel = -1; sfx.drop();
    } else if(canPour(sel, i)){
      pour(sel, i);
    } else {
      v.shake = 1; sfx.bonk(); buzz([18, 30, 18]);
      sel = -1;
    }
    coach(); kick();
  }
  function pour(i, j){
    const before = bandsOf(i), beforeDst = bandsOf(j);
    const v0 = L.vials[i].length, d0 = L.vials[j].length;
    const n = Math.min(topRun(i), CAP - d0), pig = col(L.vials[i][v0 - 1]);
    L.hist.push({ v: L.vials.map(v => v.slice()), m: L.moves });
    if(L.hist.length > 40) L.hist.shift();
    const moved = L.vials[i].splice(v0 - n, n);
    L.vials[j].push(...moved);
    L.moves++;
    const fresh = revealTops();
    const completes = vialFull(j);
    const a = vs[i], b = vs[j], dir = b.x > a.x + 1 ? 1 : b.x < a.x - 1 ? -1 : (i < j ? 1 : -1);
    const v1 = v0 - n;
    const thS = angleFor(g, v0 * g.unitA);
    const thE = v1 > 0 ? angleFor(g, v1 * g.unitA) : Math.min(angleFor(g, g.unitA * .02) + .1, 2.05);
    const an = { i, j, n, pig, dir, v0, v1, d0, thS, thE, src: before, dst: beforeDst,
      tA: 230, tB: 190 + 105 * n, tC: 280, lag: 85, t0: now(), lift0: a.lift, fresh, completes, splashed: false };
    anims.push(an);
    a.busy = b.busy = true;
    sel = -1; hintMv = null;
    sfx.pour(n, d0, an.tA + an.lag, an.tB);
    buzz(8);
    hideStuck();
    if(isSolved(colors(), CAP)) onSolved();
    persist();
    updateHud();
  }
  function finishPour(an){
    const a = vs[an.i], b = vs[an.j];
    a.busy = b.busy = false; a.lift = 0;
    a.wob = g.w * .07; b.wob = Math.max(b.wob, g.w * .06);
    sfx.plop(an.d0 + an.n, 0);
    if(an.fresh.some(f => f.i === an.i)){
      sfx.reveal();
      const ps = restPose(an.i), yy = surfaceY(an.i, an.v1);
      sparkle(ps.px, yy, '#FFFFFF', 8, .7);
    }
    if(an.completes) celebrate(an.j, an.pig);
    refreshDone(false);
    if(L.won && !anims.some(x => x !== an)) later(winSequence, 250);
    else checkStuckSoon();
  }
  function celebrate(j, pig){
    const v = vs[j], w = g.w, P = PIGMENTS[pig];
    v.cork = now(); v.glow = now(); v.glowCol = P.hex;
    const k = [...L.vials.keys()].filter(vialFull).length - 1;
    later(() => {
      sfx.complete(k); buzz([12, 30, 16]);
      sparkle(v.x, v.y - w * .2, P.hex, 16, 1.2);
      sparkle(v.x, v.y - w * .2, '#FFFFFF', 8, .9);
    }, 150);
    const f = h('div', { class: 'ps-float', style: `left:${v.x}px;top:${v.y - w * 1.1}px;--c:${P.hex}` }, P.name);
    floats.append(f); later(() => f.remove(), 1500);
    if(L.n === 1 && !S.tips.tut) later(coach, 200);
  }
  function onSolved(){
    L.won = true; won = true;
    const sp = L.sp;
    S.coins += sp.reward;
    S.stats.won++; if(sp.tier === 1) S.stats.hard++; if(sp.tier === 2) S.stats.super++;
    L.clean = !L.help;
    if(L.clean) S.coins += 5;
    if(L.n === 1) S.tips.tut = true;
    observe(true, L.len && L.moves ? SK.Phi((L.len / L.moves - .7) / .25) * (L.help ? .6 : 1) : null);
    S.level = Math.max(S.level, L.n + 1);
    S.cur = null;
    api.persist(true);
    const next = L.n + 1;
    later(() => levelData(next, heatFor(next)), 900);   // mix the next board while the player admires this one
  }
  function winSequence(){
    if(!L || view !== 'play') return;
    vs.forEach((v, k) => { v.hop = now() + k * 55; });
    const w = g.w;
    for(let k = 0; k < 46; k++){
      const pig = L.palette[k % L.palette.length];
      parts.push({ kind: 'splat', x: W / 2 + (Math.random() - .5) * W * .3, y: H * .45, vx: (Math.random() - .5) * .9, vy: -.45 - Math.random() * .55,
        life: 0, max: 1300 + Math.random() * 700, r: w * (.08 + Math.random() * .12), c: PIGMENTS[pig].hex, spin: Math.random() * 6 });
    }
    sfx.win(); buzz([20, 60, 20, 60, 40]);
    coach();
    kick();
    later(showWin, 1250);
  }

  /* ---------- boosters ---------- */
  function undo(){
    if(!L || L.won) return;
    if(anims.length) return;
    if(!L.hist.length){ toast('Nothing to undo yet'); return; }
    if(L.undos <= 0){ buy('undo'); return; }
    const e = L.hist.pop();
    L.vials = e.v.map(v => v.slice()); L.moves = e.m; L.undos--; L.help = true;
    sel = -1; hintMv = null;
    vs.forEach(v => { v.wob = g.w * .06; });
    refreshDone(false);
    sfx.undo(); buzz(10);
    hideStuck(); persist(); updateHud(); coach(); checkStuckSoon(); kick();
  }
  function hint(){
    if(!L || L.won) return;
    if(S.inv.hint <= 0){ buy('hint'); return; }
    const s = colors(), r = solve(s, CAP, 30000);
    let mv = null;
    if(r.ok && r.path.length) mv = r.path[0];
    else if(!r.ok && r.exhausted){ showStuck(); toast('No pour wins from here. Undo or restart.'); return; }
    else {
      const ms = listMoves(s, CAP, false);
      if(ms.length){ ms.sort((a, b) => rateMove(s, CAP, b) - rateMove(s, CAP, a)); mv = ms[0]; }
    }
    if(!mv) return;
    S.inv.hint--; L.help = true;
    hintMv = [mv[0], mv[1]]; sel = -1;
    sfx.hint(); persist(); updateHud(); kick();
  }
  function addVial(){
    if(!L || L.won) return;
    if(L.extra){ toast('One extra vial per level'); return; }
    if(S.inv.vial <= 0){ buy('vial'); return; }
    S.inv.vial--; L.extra = true; L.help = true;
    L.vials.push([]); L.init.push([]); L.hist.forEach(e => e.v.push([]));
    layout();
    const v = vs[vs.length - 1]; v.pop = now();
    vs.forEach(x => { x.dx = x.dx == null ? x.x : x.dx; });
    sfx.vial(); buzz(12);
    sparkle(v.x, v.y + g.H / 2, '#FFFFFF', 12, 1);
    hideStuck(); persist(); updateHud(); checkStuckSoon(); kick();
  }
  function restart(ask){
    if(!L || L.won || anims.length) return;
    if(ask && L.moves > 0){
      // giving up part-way is a lost try; after two, a gentler board is on offer
      const gaveUp = () => { if(L.moves >= 3) observe(false); };
      const gentler = failsAt(L.n) + (L.observed || L.moves < 3 ? 0 : 1) >= 2;
      sheet({ eyebrow: `Level ${L.n}`, title: 'Start this level again?', sub: 'The board goes back to how it started. Your 5 undos come back too.' +
        (gentler ? ' Or mix a new board, set a little easier.' : ''),
        actions: [{ label: 'Restart level', onClick: () => { gaveUp(); restart(false); } },
          gentler ? { label: 'Mix a gentler board', kind: 'ghost', onClick: () => { gaveUp(); S.cur = null; startLevel(L.n, true); } } : null,
          { label: 'Keep playing', kind: 'ghost' }].filter(Boolean) });
      return;
    }
    L.observed = false;                          // a new try at the same board
    L.vials = L.init.map(v => v.slice()); L.revSet = new Set(L.rev0);
    L.hist = []; L.undos = UNDOS_PER_TRY; L.moves = 0;
    sel = -1; hintMv = null;
    vs.forEach((v, k) => { v.wob = g.w * .08; v.hop = now() + k * 30; v.cork = null; });
    refreshDone(false);
    sfx.undo(); hideStuck(); persist(); updateHud(); coach(); kick();
  }
  function buy(kind){
    const price = PRICES[kind];
    const info = {
      undo: ['Out of undos', `Take back 5 more pours on this try.`, 'Buy 5 undos'],
      hint: ['Out of hints', 'A hint points at one pour that still leads to a finished board.', 'Buy a hint'],
      vial: ['Out of spare vials', 'An empty vial gives you room to park paint. One per level.', 'Buy a vial']
    }[kind];
    const short = S.coins < price;
    sheet({ eyebrow: 'Boosters', title: info[0],
      sub: short ? `${info[1]} It costs ${price} coins and you have ${S.coins}. Levels pay 10, hard ones 30 and super hard ones 60.` : info[1],
      actions: [
        { label: `${info[2]} · ${price} coins`, disabled: short, onClick: () => {
          S.coins -= price;
          if(kind === 'undo') L.undos += 5; else S.inv[kind]++;
          [0, 1, 2].forEach(sfx.coin);
          persist(); updateHud();
          if(kind === 'hint') hint(); else if(kind === 'vial') addVial(); else toast('5 more undos');
        } },
        { label: 'Not now', kind: 'ghost' }
      ] });
  }

  /* ---------- dead ends ---------- */
  let stuckTimer = 0;
  function checkStuckSoon(){ clearTimeout(stuckTimer); timers.delete(stuckTimer); stuckTimer = later(checkStuck, 380); }
  function checkStuck(){
    if(!L || L.won || view !== 'play') return;
    if(anims.length){ checkStuckSoon(); return; }
    const s = colors();
    let dead = !listMoves(s, CAP, false).length;
    if(!dead){ const r = solve(s, CAP, 5000); dead = !r.ok && r.exhausted; }
    if(dead) showStuck(); else hideStuck();
  }
  function showStuck(){
    if(stuckShown) return;
    observe(false);
    stuckShown = true; stuckEl.hidden = false;
    ref('stuckVial').hidden = L.extra;
    sfx.bonk();
  }
  function hideStuck(){ stuckShown = false; stuckEl.hidden = true; }

  /* ---------- tutorial + coach line ---------- */
  function coach(){
    if(!L || view !== 'play'){ coachEl.textContent = ''; return; }
    let msg = '';
    if(L.won) msg = L.n === 1 ? 'That is the whole painting. Nicely done.' : '';
    else if(L.n === 1 && !S.tips.tut){
      if(L.moves < 3 && !anims.length){
        const r = solve(colors(), CAP, 4000);
        hintMv = r.ok && r.path.length ? [r.path[0][0], r.path[0][1]] : null;
      } else if(L.moves >= 3) hintMv = null;
      if(sel !== -1) msg = 'Now tap where it goes. Paint lands only on its own colour, or in an empty vial.';
      else if(L.moves === 0) msg = 'Tap a vial to pick it up.';
      else if(!L.doneSet.size) msg = 'Keep going until a vial holds a single colour.';
      else msg = 'Every finished vial paints part of the picture above.';
    }
    else if(L.sp.mystery && L.moves === 0 && sel === -1) msg = 'Grey paint shows its colour once it reaches the top.';
    coachEl.textContent = msg;
  }

  /* ---------- particles ---------- */
  function sparkle(x, y, c, count, power){
    for(let k = 0; k < count; k++){
      const a = Math.random() * Math.PI * 2, sp = (.08 + Math.random() * .22) * power;
      parts.push({ kind: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - .08, life: 0, max: 500 + Math.random() * 400,
        r: g.w * (.07 + Math.random() * .08), c, spin: Math.random() * 6 });
    }
    kick();
  }

  /* ---------- the frame loop ---------- */
  function kick(){ if(!raf && view === 'play' && !document.hidden) { lastT = 0; raf = requestAnimationFrame(frame); } }
  function busy(){
    if(anims.length || parts.length || hintMv || kf >= 0) return true;
    const t = now();
    for(const k in artAnim) if(t - artAnim[k] < 1000) return true;
    for(const v of vs){
      if(Math.abs(v.lift - (vs.indexOf(v) === sel ? g.w * .5 : 0)) > .2 || v.shake > 0 || v.wob > .06) return true;
      if(Math.abs(v.dx - v.x) > .3 || Math.abs(v.dy - v.y) > .3) return true;
      if(v.cork && t - v.cork < 700) return true;
      if(v.hop && t - v.hop < 460) return true;
      if(v.pop && t - v.pop < 400) return true;
      if(v.glow && t - v.glow < 1200) return true;
    }
    return false;
  }
  function frame(t){
    raf = 0;
    const dt = lastT ? Math.min(50, t - lastT) : 16; lastT = t;
    step(t, dt);
    draw(t);
    if(busy()) raf = requestAnimationFrame(frame);
  }
  function step(t, dt){
    if(!L || !g) return;
    const w = g.w;
    vs.forEach((v, i) => {
      const target = i === sel ? w * .5 : 0;
      if(!v.busy) v.lift += (target - v.lift) * Math.min(1, dt * .022);
      v.shake = Math.max(0, v.shake - dt / 320);
      v.wob *= Math.exp(-dt / 420);
      v.dx += (v.x - v.dx) * Math.min(1, dt * .014); v.dy += (v.y - v.dy) * Math.min(1, dt * .014);
    });
    for(const an of anims.slice()){
      const e = t - an.t0;
      const flowing = e > an.tA + an.lag && e < an.tA + an.tB + an.lag;
      if(flowing){
        const b = vs[an.j], recv = poured(an, e - an.lag), sy = surfaceY(an.j, an.d0 + recv);
        const x = b.x - an.dir * w * .08;
        if(!an.splashed){
          an.splashed = true;
          for(let k = 0; k < 7; k++) parts.push({ kind: 'drop', x, y: sy, vx: (Math.random() - .5) * .16, vy: -.12 - Math.random() * .2, life: 0, max: 380, r: w * (.04 + Math.random() * .04), c: PIGMENTS[an.pig].hex, floor: sy });
        }
        if(Math.random() < dt / 38) parts.push({ kind: 'drop', x: x + (Math.random() - .5) * w * .2, y: sy, vx: (Math.random() - .5) * .12, vy: -.07 - Math.random() * .12, life: 0, max: 300, r: w * (.03 + Math.random() * .03), c: PIGMENTS[an.pig].hex, floor: sy });
        b.wob = Math.max(b.wob, w * .065);
      }
      if(e >= an.tA + an.tB + an.tC){ anims.splice(anims.indexOf(an), 1); finishPour(an); }
    }
    for(let k = parts.length - 1; k >= 0; k--){
      const p = parts[k];
      p.life += dt;
      if(p.life >= p.max){ parts.splice(k, 1); continue; }
      p.vy += (p.kind === 'splat' ? .0011 : p.kind === 'drop' ? .0012 : .0004) * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if(p.kind === 'spark'){ p.vx *= .985; p.vy *= .985; }
      if(p.floor != null && p.y > p.floor && p.vy > 0) p.life = p.max;
    }
    for(const k in artAnim){
      const q = clamp((t - artAnim[k]) / 900, 0, 1);
      if(q > 0) artProg[k] = q;
      if(q >= 1) delete artAnim[k];
      drawEasel();
    }
  }
  function vialOpts(i, t){
    const v = vs[i];
    let cork = null;
    if(vialFull(i) && !v.busy){
      const ct = v.cork ? clamp((t - v.cork) / 520, 0, 1) : 1;
      cork = (1 - easeOutBounce(ct)) * g.w * 1.8;
    }
    let glow = null, glowAmt = 0;
    if(v.glow && t - v.glow < 1200){ glow = v.glowCol; glowAmt = Math.sin(Math.PI * clamp((t - v.glow) / 1200, 0, 1)); }
    return { theme, base: dpr, t, wob: v.wob, symbols: S.symbols, selected: i === sel, cork, glow, glowAmt, font: FONT };
  }
  function draw(t){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if(!L || !g) return;
    const w = g.w, srcs = new Set(anims.map(a => a.i)), dsts = new Map(anims.map(a => [a.j, a]));
    // resting vials (and pour targets, which stay put)
    for(let i = 0; i < vs.length; i++){
      if(srcs.has(i)) continue;
      const v = vs[i], ps = restPose(i), o = vialOpts(i, t);
      let bands;
      const an = dsts.get(i);
      if(an){ bands = addTop(an.dst, an.pig, clamp(poured(an, t - an.t0 - an.lag), 0, an.n)); o.cork = null; }
      else bands = bandsOf(i);
      o.shadow = clamp(1 - v.lift / (w * 1.2), .3, 1); o.shadowX = v.dx; o.shadowY = v.dy + g.H + w * .16;
      if(v.pop && t - v.pop < 380){
        const s = easeOutBack(clamp((t - v.pop) / 380, 0, 1));
        ctx.save(); ctx.translate(v.dx, v.dy + g.H); ctx.scale(s, s); ctx.translate(-v.dx, -v.dy - g.H);
        drawVial(ctx, g, ps, bands, o); ctx.restore();
      } else drawVial(ctx, g, ps, bands, o);
      if(kf === i){
        ctx.save(); ctx.strokeStyle = theme.accent; ctx.setLineDash([5, 4]); ctx.lineWidth = 2;
        rrect(ctx, v.dx - slotW / 2 + 3, ps.py - w * .6, slotW - 6, g.H + w * 1.1, 12); ctx.stroke(); ctx.restore();
      }
    }
    // streams, then the tipped vials over them
    for(const an of anims){
      const e = t - an.t0, s0 = an.tA, s1 = an.tA + an.tB;
      if(e > s0 && e < s1 + an.lag){
        const ps = pourPose(an, Math.min(e, s1 - 1)), b = vs[an.j];
        const recv = clamp(poured(an, e - an.lag), 0, an.n);
        const sy = surfaceY(an.j, an.d0 + recv), lipX = ps.px, lipY = ps.py;
        const endX = b.x - an.dir * w * .08;
        const head = clamp((e - s0) / an.lag, 0, 1), tail = e > s1 ? clamp((e - s1) / an.lag, 0, 1) : 0;
        const flow = poured(an, e) - poured(an, e - 40);
        const width = w * clamp(.07 + flow * 1.05, .07, .27) * (e > s1 ? 1 - tail * .5 : 1);
        const ya = lipY + (sy - lipY) * tail, yb = lipY + (sy - lipY) * head;
        if(yb - ya > 1){
          const cx = lipX + an.dir * w * .07, sway = Math.sin(t * .03) * w * .015;
          const xa = lerp(lipX, endX, tail * tail), xb = lerp(lipX, endX, head);
          ctx.save(); ctx.lineCap = 'round';
          ctx.strokeStyle = PIGMENTS[an.pig].hex; ctx.lineWidth = width;
          ctx.beginPath(); ctx.moveTo(xa, ya); ctx.quadraticCurveTo(cx + sway, lerp(ya, yb, .3), xb + sway, yb); ctx.stroke();
          ctx.strokeStyle = 'rgba(255,255,255,.38)'; ctx.lineWidth = Math.max(1, width * .22);
          ctx.beginPath(); ctx.moveTo(xa - width * .22, ya + 2); ctx.quadraticCurveTo(cx + sway - width * .22, lerp(ya, yb, .3), xb + sway - width * .22, yb - 2); ctx.stroke();
          ctx.restore();
        }
      }
    }
    for(const an of anims){
      const e = t - an.t0, ps = pourPose(an, e);
      const o = vialOpts(an.i, t); o.selected = false; o.cork = null; o.shadow = 0;
      drawVial(ctx, g, ps, trimTop(an.src, poured(an, e)), o);
    }
    // particles
    for(const p of parts){
      const q = p.life / p.max;
      ctx.globalAlpha = p.kind === 'splat' ? Math.min(1, (1 - q) * 2.2) : 1 - q * q;
      ctx.fillStyle = p.c;
      if(p.kind === 'spark'){
        const s = p.r * (1 - q * .6), a = p.spin + p.life * .006;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(a);
        ctx.beginPath();
        for(let k = 0; k < 8; k++){ const rr = k % 2 ? s * .32 : s; const aa = k * Math.PI / 4; k ? ctx.lineTo(Math.cos(aa) * rr, Math.sin(aa) * rr) : ctx.moveTo(rr, 0); }
        ctx.closePath(); ctx.fill(); ctx.restore();
      } else if(p.kind === 'splat'){
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin + p.life * .004);
        ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * .72, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(p.r * .95, p.r * .3, p.r * .28, 0, 7); ctx.arc(-p.r * .7, -p.r * .6, p.r * .2, 0, 7); ctx.fill();
        ctx.restore();
      } else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    // pointer for hints and the tutorial
    if(hintMv && !L.won){
      const target = sel === hintMv[0] ? hintMv[1] : hintMv[0];
      if(vs[target]){
        const v = vs[target], bob = Math.sin(t * .008) * w * .14;
        const x = v.dx, y = v.dy - v.lift - w * .95 + bob;
        ctx.save();
        ctx.fillStyle = theme.accent; ctx.strokeStyle = theme.surface; ctx.lineWidth = 3; ctx.lineJoin = 'round';
        ctx.beginPath(); ctx.moveTo(x, y + w * .42); ctx.lineTo(x - w * .34, y - w * .02); ctx.lineTo(x - w * .13, y - w * .02);
        ctx.lineTo(x - w * .13, y - w * .42); ctx.lineTo(x + w * .13, y - w * .42); ctx.lineTo(x + w * .13, y - w * .02);
        ctx.lineTo(x + w * .34, y - w * .02); ctx.closePath(); ctx.stroke(); ctx.fill();
        ctx.restore();
        if(hintMv[1] !== target){
          const d = vs[hintMv[1]];
          if(d){ ctx.save(); ctx.globalAlpha = .35 + .2 * Math.sin(t * .008); ctx.strokeStyle = theme.accent; ctx.lineWidth = 2.5; ctx.setLineDash([4, 5]);
            rrect(ctx, d.dx - slotW / 2 + 4, d.dy - w * .5, slotW - 8, g.H + w * .9, 12); ctx.stroke(); ctx.restore(); }
        }
      }
    }
  }

  /* ---------- easel ---------- */
  function drawEasel(){ if(L && art && view === 'play') paintCanvas(artCv, art, L.palette, artProg); }
  function renderDots(){
    const box = ref('dots'); box.replaceChildren();
    if(!L) return;
    L.palette.forEach(pig => box.append(h('i', { class: L.doneSet.has(pig) ? 'on' : null, style: `--c:${PIGMENTS[pig].hex}`, title: PIGMENTS[pig].name })));
  }

  /* ---------- HUD ---------- */
  function updateHud(){
    bind('coins', S.coins);
    if(!L) return;
    bind('lvl', `Level ${L.n}`);
    const tierEl = ref('tier');
    tierEl.hidden = !L.sp.tier; tierEl.textContent = TIER_NAME[L.sp.tier]; tierEl.dataset.tier = L.sp.tier;
    const setN = (n, v, buyable) => { const b = ref(n); b.textContent = v > 0 ? v : '+'; b.classList.toggle('buy', !(v > 0) && buyable); };
    setN('undoN', L.undos, true); setN('hintN', S.inv.hint, true); setN('vialN', L.extra ? 0 : S.inv.vial, !L.extra);
    ref('vialN').closest('.ps-tool').classList.toggle('used', L.extra);
  }

  /* ---------- screens ---------- */
  function showView(which){
    view = which;
    ref('lobby').hidden = which !== 'lobby';
    ref('play').hidden = which !== 'play';
    el.dataset.tier = which === 'play' && L ? L.sp.tier : 0;
    if(which === 'lobby') renderLobby();
  }
  function startLevel(n, fresh){
    closeSheet();
    won = false; sel = -1; hintMv = null; anims = []; parts = []; kf = -1;
    floats.replaceChildren(); hideStuck();
    const resume = !fresh && S.cur && S.cur.n === n;
    showView('play');
    el.dataset.tier = spec(n).tier;
    coachEl.textContent = resume ? '' : 'Mixing paint…';
    bind('lvl', `Level ${n}`);
    later(() => {
      hydrate(resume ? S.cur : freshLevel(n));
      vs = []; g = null;
      layout();
      vs.forEach((v, k) => { v.pop = now() + k * 35; });
      updateHud(); persist(); coach(); drawEasel(); kick();
      if(!resume && L.sp.tier) intro(L.sp.tier);
      else if(!resume && L.sp.mystery && !S.tips.mystery) mysteryTip();
      checkStuckSoon();
    }, resume ? 0 : 40);
  }
  function intro(tier){
    const box = ref('intro');
    ref('introK').textContent = tier === 2 ? 'Super hard level' : 'Hard level';
    ref('introN').textContent = `Level ${L.n}`;
    ref('introS').textContent = `${L.sp.K} colours${L.sp.mystery ? ', some hidden' : ''}. Worth ${L.sp.reward} coins.`;
    box.dataset.tier = tier; box.hidden = false;
    box.classList.remove('on'); void box.offsetWidth; box.classList.add('on');
    sfx.hard(tier); buzz([30, 60, 30]);
    const done = () => { box.hidden = true; box.onclick = null; if(L.sp.mystery && !S.tips.mystery) mysteryTip(); };
    box.onclick = done;
    later(() => { if(!box.hidden) done(); }, 2100);
  }
  function mysteryTip(){
    S.tips.mystery = true; persist();
    sheet({ eyebrow: 'New', title: 'Hidden paint',
      sub: 'Grey layers with a question mark are paint you can’t see yet. Pour off whatever sits on top and the colour shows.',
      actions: [{ label: 'Got it' }] });
  }
  function showWin(){
    if(!L || view !== 'play') return;
    const sp = L.sp, next = spec(L.n + 1);
    const frame = h('div', { class: 'ps-frame ps-frame-win' }, h('canvas'));
    const coinsEl = h('b', null, '+0');
    const body = h('div', { class: 'ps-win' },
      frame,
      h('div', { class: 'ps-win-cap' }, `Study No. ${L.n}`, h('span', null, ` · ${L.palette.length} pigments · ${L.moves} pours`)),
      h('div', { class: 'ps-win-coins' }, h('i', { class: 'coin' }), coinsEl, h('span', null, L.clean ? ' incl. 5 for no boosters' : ''))
    );
    const nextKind = next.tier === 2 ? 'super' : next.tier === 1 ? 'hard' : 'primary';
    sheet({ eyebrow: sp.tier ? `${TIER_NAME[sp.tier]} level beaten` : `Level ${L.n} complete`,
      title: sp.tier === 2 ? 'Masterpiece.' : sp.tier === 1 ? 'That was a tough one.' : ['Lovely.', 'Clean pours.', 'Framed.', 'Gallery ready.'][L.n % 4],
      tone: sp.tier === 2 ? 'super' : sp.tier === 1 ? 'hard' : '', body, dismiss: false,
      actions: [
        { label: next.tier ? `Next: ${TIER_NAME[next.tier].toLowerCase()} level ${L.n + 1}` : `Next level`, kind: nextKind, onClick: () => startLevel(S.level, true) },
        { label: 'Back to levels', kind: 'ghost', onClick: () => { showView('lobby'); } }
      ] });
    requestAnimationFrame(() => paintCanvas(frame.firstChild, art, L.palette, L.palette.map(() => 1)));
    const total = sp.reward + (L.clean ? 5 : 0);
    let shown = 0; const stepN = Math.max(1, Math.round(total / 12));
    const tick = () => {
      shown = Math.min(total, shown + stepN); coinsEl.textContent = `+${shown}`;
      sfx.coin(0);
      if(shown < total) later(tick, 55);
    };
    later(tick, 350);
    updateHud();
  }
  function menu(){
    const body = h('div', null,
      toggle('Colour symbols', 'Adds a shape to every colour of paint', () => S.symbols, v => { S.symbols = v; persist(); kick(); }),
      toggle('Sound', 'Glugs, pops and chimes', () => api.settings.sound, v => { api.settings.sound = v; api.persist(); if(v) A.ensure(); }),
      toggle('Vibration', 'On phones that support it', () => api.settings.haptics, v => { api.settings.haptics = v; api.persist(); }));
    sheet({ eyebrow: `Level ${L ? L.n : S.level}`, title: 'Paused', body,
      actions: [
        { label: 'Resume' },
        { label: 'How to play', kind: 'ghost', onClick: howTo },
        { label: 'Restart level', kind: 'ghost', onClick: () => restart(true) },
        { label: 'Back to levels', kind: 'ghost', onClick: () => showView('lobby') }
      ] });
  }
  function howTo(){
    const row = (t, d) => h('div', { class: 'ps-how' }, h('div', { class: 'ps-how-t' }, t), h('div', { class: 'ps-how-d' }, d));
    sheet({ eyebrow: 'How to play', title: 'Sort the paint',
      body: h('div', null,
        row('Tap a vial, then tap another', 'The top colour pours across. It lands only on the same colour, or in an empty vial, and only as much as fits.'),
        row('Fill a vial with one colour', 'It gets corked, and that pigment paints its part of the picture above.'),
        row('Grey paint is hidden', 'A question mark hides a colour until the paint above it has been poured off.'),
        row('Boosters', 'Undo takes back a pour (5 per try). A hint points at a pour that still wins. An extra vial gives you room, once per level.'),
        row('Hard levels', 'Levels 5 and 10 of every ten are harder, then the next level eases off. They pay 30 and 60 coins.')),
      actions: [{ label: 'Got it' }] });
  }

  /* ---------- lobby ---------- */
  function renderLobby(){
    bind('coins', S.coins);
    const n = S.level, resume = S.cur && S.cur.n === n;
    const heat = resume ? S.cur.h : heatFor(n), sp = spec(n, heat);
    bind('nextEyebrow', sp.tier ? `Up next · ${TIER_NAME[sp.tier]}` : 'Up next');
    ref('lobby').querySelector('.ps-next-eyebrow').dataset.tier = sp.tier;
    bind('nextTitle', `Study No. ${n}`);
    bind('nextSub', `${sp.K} colours · ${sp.K + 2} vials${sp.mystery ? ' · some hidden' : ''}`);
    const pal = resume ? S.cur.palette : null;
    const box = ref('nextDots'); box.replaceChildren();
    for(let k = 0; k < sp.K; k++) box.append(h('i', { style: pal ? `--c:${PIGMENTS[pal[k]].hex}` : null, class: pal ? null : 'blank' }));
    requestAnimationFrame(() => {
      const nextArt = buildArt(n, sp.K);
      paintCanvas(ref('nextArt'), nextArt, pal || [...Array(sp.K).keys()], []);
    });
    const go = ref('go');
    go.className = 'btn btn-wide ps-go ' + (sp.tier === 2 ? 'btn-super' : sp.tier === 1 ? 'btn-hard' : 'btn-primary');
    go.innerHTML = `${IC.play}<span>${resume ? 'Continue' : 'Play'} level ${n}</span>`;
    const block = Math.floor((n - 1) / 10);
    bind('blockLabel', `Levels ${block * 10 + 1}–${block * 10 + 10}`);
    bind('lobbyNote', S.stats.won
      ? `${S.stats.won} painting${S.stats.won === 1 ? '' : 's'} finished · ${S.stats.hard + S.stats.super} hard level${S.stats.hard + S.stats.super === 1 ? '' : 's'} beaten`
      : 'Every level is mixed fresh on your device, to suit how you play. Levels 5 and 10 of each ten are the hard ones.');
    renderRoad(n);
    if(!resume) later(() => levelData(n, heat), 120);   // have the board ready before Play is tapped
  }
  function renderRoad(n){
    const svg = ref('road'), block = Math.floor((n - 1) / 10), first = block * 10 + 1;
    const X = p => 22 + p * (296 / 9), Y = p => 104 - (1 - SK.TARGET[p]) / .64 * 76;
    const ns = 'http://www.w3.org/2000/svg', mk = (tag, a) => { const e = document.createElementNS(ns, tag); for(const k in a) e.setAttribute(k, a[k]); return e; };
    svg.replaceChildren();
    const pts = SK.TARGET.map((_, p) => `${X(p)},${Y(p)}`);
    svg.append(mk('polyline', { points: pts.join(' '), class: 'rd-line' }));
    const doneP = n - first;
    if(doneP > 0) svg.append(mk('polyline', { points: pts.slice(0, doneP + 1).join(' '), class: 'rd-done' }));
    RAMP.forEach((_, p) => {
      const lv = first + p, tier = p === 9 ? 2 : p === 4 ? 1 : 0, r = tier === 2 ? 13 : tier === 1 ? 11.5 : 9;
      const state = lv < n ? 'done' : lv === n ? 'now' : 'todo';
      if(state === 'now') svg.append(mk('circle', { cx: X(p), cy: Y(p), r: r + 6, class: 'rd-pulse' }));
      svg.append(mk('circle', { cx: X(p), cy: Y(p), r, class: `rd-node rd-${state} rd-t${tier}` }));
      const num = mk('text', { x: X(p), y: Y(p) + 24 + (tier ? 3 : 0), class: `rd-num${state === 'now' ? ' rd-num-now' : ''}` });
      num.textContent = lv; svg.append(num);
      if(state === 'done'){
        svg.append(mk('path', { d: `M${X(p) - 4} ${Y(p)} l3 3 l5.5 -6`, class: 'rd-check' }));
      }
    });
  }

  /* ---------- input ---------- */
  function hitVial(x, y){
    if(!g) return -1;
    let best = -1, bd = 1e9;
    vs.forEach((v, i) => {
      const top = v.dy - v.lift - g.w * .9, bot = v.dy + g.H + g.w * .35;
      if(y < top || y > bot) return;
      const d = Math.abs(x - v.dx);
      if(d < slotW / 2 && d < bd){ bd = d; best = i; }
    });
    return best;
  }
  cv.addEventListener('pointerdown', e => {
    if(e.button > 0) return;
    const r = cv.getBoundingClientRect();
    kf = -1;
    const i = hitVial(e.clientX - r.left, e.clientY - r.top);
    if(i >= 0) tapVial(i);
    else if(sel >= 0){ sel = -1; sfx.drop(); coach(); kick(); }
  });
  const KEYMAP = '1234567890-=';
  function onKey(e){
    if(view !== 'play' || !L || e.metaKey || e.ctrlKey || e.altKey) return;
    if(document.querySelector('#sheet.on')) return;
    const k = e.key.toLowerCase(), idx = KEYMAP.indexOf(k);
    if(idx >= 0 && idx < vs.length){ tapVial(idx); e.preventDefault(); return; }
    if(k === 'arrowright' || k === 'arrowleft'){ kf = kf < 0 ? (sel >= 0 ? sel : 0) : (kf + (k === 'arrowright' ? 1 : -1) + vs.length) % vs.length; kick(); e.preventDefault(); }
    else if((k === 'enter' || k === ' ') && kf >= 0){ tapVial(kf); e.preventDefault(); }
    else if(k === 'u') undo(); else if(k === 'h') hint(); else if(k === 'r') restart(true);
    else if(k === 'escape' && sel >= 0){ sel = -1; sfx.drop(); kick(); }
  }
  document.addEventListener('keydown', onKey);
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if(!b) return;
    const act = b.dataset.act;
    A.ensure();
    if(act !== 'undo' && act !== 'vial') api.click();
    switch(act){
      case 'home': api.exit(); break;
      case 'settings': api.ui.openSettings(h('div', null,
        toggle('Colour symbols', 'Adds a shape to every colour of paint', () => S.symbols, v => { S.symbols = v; persist(); }),
        h('button', { class: 'btn btn-ghost btn-sm btn-wide', style: 'margin-top:12px', onclick: () => { api.click(); howTo(); } }, 'How to play Paint Sort'))); break;
      case 'play': startLevel(S.level, false); break;
      case 'lobby': showView('lobby'); break;
      case 'menu': menu(); break;
      case 'undo': undo(); break;
      case 'hint': hint(); break;
      case 'vial': addVial(); break;
      case 'restart': restart(true); break;
    }
  });
  const ro = new ResizeObserver(() => { if(view === 'play'){ layout(); kick(); } });
  ro.observe(field);
  const offTheme = api.on('theme', () => { theme = readTheme(el); if(view === 'play'){ drawEasel(); kick(); } else renderLobby(); });
  const offWipe = api.on('wipe', () => { api.exit(); });
  const onVis = () => { if(!document.hidden) kick(); };
  document.addEventListener('visibilitychange', onVis);

  window.__ps = Object.assign(window.__ps || {}, {
    state: () => L && colors(), level: () => L && L.n, tap: tapVial, undo, hint, addVial, restart: () => restart(false),
    solveNow: () => L && solve(colors(), CAP, 200000), view: () => view, idle: () => !anims.length,
    save: () => JSON.parse(JSON.stringify({ level: S.level, coins: S.coins, inv: S.inv, stats: S.stats })),
    skill: () => Object.assign({ tries: S.tries }, S.skill), heatFor, heat: () => L && L.h,
    setSkill: (mu, sd) => { S.skill = Object.assign(SK.create(SKILL), { mu, sd: sd || S.skill.sd }); api.persist(); },     // dev
    play: n => { if(n){ S.level = n; S.cur = null; } startLevel(S.level, false); }     // dev: jump to a level
  });

  showView('lobby');
  return {
    unmount(){
      persist();
      cancelAnimationFrame(raf); raf = 0;
      for(const id of timers) clearTimeout(id);
      ro.disconnect(); offTheme(); offWipe();
      document.removeEventListener('keydown', onKey);
      document.removeEventListener('visibilitychange', onVis);
    }
  };
}

/* ==================== 6. the shelf card ==================== */
function drawCard(box){
  const cv = document.createElement('canvas');
  box.classList.add('ps-card-art');
  box.append(cv);
  requestAnimationFrame(() => {
    const W = box.clientWidth, H = box.clientHeight;
    if(!W || !H) return;
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = W * dpr; cv.height = H * dpr;
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const theme = readTheme(document.documentElement);
    const w = Math.min(36, W / 11), g = makeGeom(w), y = H - g.H - w * .55;
    const o = { theme, base: dpr, t: 0, wob: 0, font: 'sans-serif' };
    const B = (...a) => a.map(([c, u]) => ({ c, u, hid: false }));
    const vials = [
      [.1, B([6, 1], [0, 1], [2, 1], [6, 1])],
      [.24, B([2, 1], [8, 1], [0, 1])],
      [.62, B([0, 2], [2, 1.35])],
      [.78, B([6, 4])],
      [.91, B([8, 2], [3, 1])]
    ];
    for(const [fx, bands] of vials){
      const x = W * fx;
      drawVial(ctx, g, { px: x, py: y, lx: 0, ly: 0, a: 0 }, bands, Object.assign({}, o, {
        shadow: 1, shadowX: x, shadowY: y + g.H + w * .16, cork: fx === .78 ? 0 : null }));
    }
    // the vial mid-pour, and its stream
    const tx = W * .62, lipX = tx - w * .1, lipY = y - w * .62, ang = 1.18;
    const sy = y + g.H - (g.H - g.head) * (3.35 / CAP) * .98;
    ctx.lineCap = 'round'; ctx.strokeStyle = PIGMENTS[2].hex; ctx.lineWidth = w * .2;
    ctx.beginPath(); ctx.moveTo(lipX, lipY); ctx.quadraticCurveTo(lipX + w * .06, lipY + (sy - lipY) * .3, tx - w * .08, sy); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.38)'; ctx.lineWidth = w * .05;
    ctx.beginPath(); ctx.moveTo(lipX - w * .05, lipY + 3); ctx.lineTo(tx - w * .12, sy - 3); ctx.stroke();
    ctx.fillStyle = PIGMENTS[2].hex;
    for(const [dx, dy, r] of [[-.35, -.25, .07], [.28, -.4, .05], [.18, -.12, .045]]){ ctx.beginPath(); ctx.arc(tx + dx * w, sy + dy * w, r * w, 0, 7); ctx.fill(); }
    drawVial(ctx, g, { px: lipX, py: lipY, lx: w / 2, ly: 0, a: ang }, B([3, 1], [2, .7]), o);
  });
}

/* ==================== 7. register ==================== */
window.__ps = Object.assign(window.__ps || {}, { spec, generate, solve, probe });
window.Playbox.register({
  id: 'paint-sort',
  title: 'Paint Sort',
  tagline: 'Pour paint between vials until each one holds a single colour.',
  order: 1,
  status: s => s.level > 1 ? `Level ${s.level} · ${s.coins} coins` : 'New · 120 coins to start',
  cta: s => s.level > 1 || s.cur ? 'Continue' : 'Play',
  card: drawCard,
  mount
});
})();
</script>

<script>
(function(){
  const start = () => window.Playbox.boot();
  const hot = window.claude && window.claude.hot;
  if(hot && hot.ready) hot.ready(start); else start();
})();
</script>
