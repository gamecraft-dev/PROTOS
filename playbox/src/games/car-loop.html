<style>
/* ---------- Car Loop: Roundabout Rush (../roundabout) running inside Playbox ---------- */
/* The game is a night scene, so the board's art uses its palette in both
   themes; the board's chrome follows Playbox's light/dark tokens. */
.board[data-game="car-loop"]{--b-accent:#12935A; --b-deep:#0B6B41; --b-soft:#DDF5E8; --b-ink:#FFFFFF; --b-text:#0B6B41}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .board[data-game="car-loop"]{
    --b-accent:#34C771; --b-deep:#1D8A57; --b-soft:#14301F; --b-ink:#04210F; --b-text:#6FE3A9;
  }
}
:root[data-theme="dark"] .board[data-game="car-loop"]{
  --b-accent:#34C771; --b-deep:#1D8A57; --b-soft:#14301F; --b-ink:#04210F; --b-text:#6FE3A9;
}
</style>
<script>
/* Car Loop is Roundabout Rush, the standalone game in /roundabout. The build
   embeds its finished page (roundabout/index.html) here, and mount() runs it in
   a same-origin frame filling the Playbox stage (Playbox.framedGame). The game
   keeps its own screens and its own save ("roundabout-rush-v1" in localStorage);
   Playbox adds a back button to the game's home screen and reads the save for
   the board's chip.
   The board art is a roundabout seen from above: cars circling the ring and one
   waiting at the stop line for its gap. */
(function(){
'use strict';
const RING_R = 80, RING_r = 44, LANE = 62;
// angle on the ring (radians, clockwise from the right) and colour
const CARS = [[-.38 * Math.PI, '#EF4444'], [-.92 * Math.PI, '#3B82F6'], [.12 * Math.PI, '#F5B82E'], [.78 * Math.PI, '#8B5CF6']];

function car(ctx, x, y, rot, color){
  const L = 25, Wd = 13.5;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.roundRect(-L / 2 + 1.5, -Wd / 2 + 2, L, Wd, 4); ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.roundRect(-L / 2, -Wd / 2, L, Wd, 4); ctx.fill();
  ctx.fillStyle = 'rgba(18,26,44,.78)';
  ctx.beginPath(); ctx.roundRect(L / 2 - 9.5, -Wd / 2 + 2, 5, Wd - 4, 1.5); ctx.fill();      // windscreen
  ctx.beginPath(); ctx.roundRect(-L / 2 + 3, -Wd / 2 + 2.5, 3, Wd - 5, 1); ctx.fill();         // rear window
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  ctx.beginPath(); ctx.roundRect(-L / 2 + 7, -Wd / 2 + 2.5, 8, Wd - 5, 2); ctx.fill();         // roof shine
  ctx.restore();
}

function draw(box){
  const cv = document.createElement('canvas');
  box.append(cv);
  requestAnimationFrame(() => {
    const W = box.clientWidth, H = box.clientHeight;
    if(!W || !H) return;
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#16244A'); bg.addColorStop(1, '#0B1222');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    // laid out in a 250 x 236 box; the entry road runs off the bottom edge
    const u = Math.min(W / 250, H / 236);
    ctx.translate(W / 2, H / 2 - 6 * u); ctx.scale(u, u);
    const road = '#323E66';

    // entry road, stop line, waiting car
    const bottom = (H / 2 + 6 * u) / u + 4;
    ctx.fillStyle = road; ctx.fillRect(-18, RING_R - 8, 36, bottom - RING_R + 8);
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(-16, RING_R + 4, 32, 3.5);
    car(ctx, 0, RING_R + 22, -Math.PI / 2, '#F4F4F5');

    // the ring
    ctx.beginPath(); ctx.arc(0, 0, RING_R, 0, Math.PI * 2); ctx.arc(0, 0, RING_r, 0, Math.PI * 2, true);
    ctx.fillStyle = road; ctx.fill('evenodd');
    ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, RING_R - 3.5, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, RING_r + 3.5, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([9, 9]); ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, LANE, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);

    // the island at night, with a dark tree
    ctx.fillStyle = '#0D1830';
    ctx.beginPath(); ctx.arc(0, 0, RING_r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1D4A37';
    for(const [x, y, r] of [[-6, -4, 15], [9, 2, 12], [-1, 9, 11]]){ ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    ctx.beginPath(); ctx.arc(-10, -9, 6, 0, Math.PI * 2); ctx.fill();

    // street lamps around the ring, and a few trees on the verge
    for(const a of [-2.4, -.75, .75, 2.4]){
      const x = Math.cos(a) * (RING_R + 14), y = Math.sin(a) * (RING_R + 14);
      const glow = ctx.createRadialGradient(x, y, 0, x, y, 26);
      glow.addColorStop(0, 'rgba(255,226,150,.30)'); glow.addColorStop(1, 'rgba(255,226,150,0)');
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FFE7A3'; ctx.beginPath(); ctx.arc(x, y, 2.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#1D4A37';
    for(const [x, y, r] of [[-108, -62, 9], [112, -30, 11], [-116, 40, 10], [104, 70, 8]]){ ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

    // cars going round clockwise, the first with speed lines behind it
    CARS.forEach(([a, color], k) => {
      const x = Math.cos(a) * LANE, y = Math.sin(a) * LANE;
      if(k === 0){
        ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        for(const dr of [-4, 4]){
          ctx.beginPath(); ctx.arc(0, 0, LANE + dr, a - .52, a - .3); ctx.stroke();
        }
      }
      car(ctx, x, y, a + Math.PI / 2, color);
    });
  });
}

// replaced by the build with roundabout/index.html, base64-encoded
const GAME_PAGE = /*@embed-base64:../roundabout/index.html*/null;
const SAVE_KEY = 'roundabout-rush-v1';
function progress(){
  try{ return JSON.parse(localStorage.getItem(SAVE_KEY)) || null; }catch(e){ return null; }
}

window.Playbox.register({
  id: 'car-loop',
  title: 'Car Loop',
  tagline: 'Merge every car into a busy roundabout without a crash.',
  order: 3,
  status: () => { const s = progress(); return s && s.unlocked > 1 ? `Level ${s.unlocked} · ${s.coins} coins` : 'New'; },
  cta: () => { const s = progress(); return s && s.unlocked > 1 ? 'Continue' : 'Play'; },
  card: draw,
  // the back button goes first in the game's home-screen top row, in its own button style
  mount: window.Playbox.framedGame({
    page: GAME_PAGE, title: 'Car Loop', background: '#0B1222',
    body: window.Playbox.exitButton({ into: '#home .topL', className: 'rbtn', size: 24 })
  })
});
})();
</script>
