<style>

<script>
/* ==========================================================
   CAKE SORT — drop plates of cake slices onto the counter;
   matching slices fly together until six make a whole cake.
   0 engine (pure, headless-testable) · 1 cakes · 2 drawing
   3 sound · 4 game · 5 board art · 6 register
   ========================================================== */
(function(){
'use strict';

// @engine-start ------------------------------------------------------------
// Everything between the engine markers is pure: no DOM, no Playbox. The
// balance probe (tools/cake-probe.mjs) evaluates this slice on its own in Node.

const CAP = 6;                                  // slices in a whole cake
const COLS = 4, ROWS = 5, CELLS = COLS * ROWS;  // the counter
const TRAY = 3;                                 // plates offered at a time
const BLOCKED = -1;                             // a cell with a cake stand on it
// the level where each cake first joins the menu (index = cake type)
const UNLOCK_AT = [1, 1, 1, 3, 5, 8, 12, 16, 21, 27];

/* Mulberry32 with its state in an object, so a level in progress (and every
   undo snapshot) can store exactly where the plate dealer has got to. */
function rngNext(st){
  st.s = (st.s + 0x6D2B79F5) | 0;
  let t = Math.imul(st.s ^ (st.s >>> 15), 1 | st.s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function seedFor(n, salt){
  let h = (0x9E3779B9 ^ Math.imul(n | 0, 0x85EBCA6B) ^ Math.imul((salt | 0) + 1, 0xC2B2AE35)) >>> 0;
  h ^= h >>> 16; h = Math.imul(h, 0x7FEB352D);
  h ^= h >>> 15; h = Math.imul(h, 0x846CA68B);
  h ^= h >>> 16; return h >>> 0;
}
function shuffle(a, rs){
  for(let i = a.length - 1; i > 0; i--){ const j = (rngNext(rs) * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

/* ---- difficulty ----
   Every knob of a level follows one number, its heat h. Which heat a level
   gets is the adaptive model's call (Playbox.skill, in the shell): it aims
   each slot of a block of ten at a target win rate for this player, so the
   5th level (hard) and the 10th (super hard) still spike, relative to how
   well this player plays. baseHeat(n) is the sawtooth a typical new player
   starts on, and the heat used when no model is given (the probe, tests). */
const RAMP = [0, .4, .8, 1.2, 2.4, .5, .9, 1.3, 1.7, 3.4];
const BLOCK_STEP = .6;
const HEAT_MAX = 10;
const STAND_WORTH = .5;                         // heat one cake stand is worth; the other knobs give it back
const baseHeat = n => { n = Math.max(1, n | 0); return Math.floor((n - 1) / 10) * BLOCK_STEP + RAMP[(n - 1) % 10]; };
// how far the model may move a level: down to 3 below the typical curve, up
// to 4 above the hardest level of its block of ten
function heatRange(n){ const b = baseHeat(n), top = Math.floor((Math.max(1, n | 0) - 1) / 10) * BLOCK_STEP + RAMP[9]; return [Math.max(0, b - 3), Math.min(HEAT_MAX, top + 4)]; }

function spec(n, h){
  n = Math.max(1, n | 0);
  const block = Math.floor((n - 1) / 10), pos = (n - 1) % 10;
  const tier = pos === 9 ? 2 : pos === 4 ? 1 : 0;           // 0 normal · 1 hard · 2 super hard
  const heat = Math.min(HEAT_MAX, Math.max(0, h == null ? baseHeat(n) : +h));
  const pool = UNLOCK_AT.filter(u => u <= n).length;
  // cake stands come with heat; a hard level always has one and a super-hard
  // level two. Each stand spends STAND_WORTH of the heat; the rest drives the
  // other knobs, so the level's overall difficulty still follows h smoothly.
  const blocked = n < 4 ? 0 : Math.min(4, Math.max(tier, heat >= 3.5 ? 1 + Math.floor((heat - 3.5) / 2) : 0));
  const k = Math.max(0, heat - blocked * STAND_WORTH);
  return {
    n, block, pos, tier, heat, pool, blocked,
    K: n === 1 ? 3 : Math.max(3, Math.min(pool, 8, Math.round(3.2 + k * .5))),
    goal: n === 1 ? 3 : Math.max(5, Math.min(26, Math.round(6 + k * 2.2))),
    pre: n < 3 ? 0 : Math.min(6, 2 + Math.floor(k * .8)),
    mix: Math.min(.7, .28 + k * .07),                       // chance a plate holds a second cake
    mix3: Math.min(.3, Math.max(0, k - 1.5) * .07),         // and a third
    help: Math.max(.3, .64 - k * .06),                      // chance a new plate's cake is one already out
    big: Math.min(.5, .12 + k * .05),                       // chance of a 4- or 5-slice plate
    reward: tier === 2 ? 60 : tier === 1 ? 30 : 10
  };
}

/* ---- board helpers ---- */
const isPlate = v => Array.isArray(v);
function neighbours(c){
  const x = c % COLS, y = (c / COLS) | 0, out = [];
  if(y > 0) out.push(c - COLS);
  if(x > 0) out.push(c - 1);
  if(x < COLS - 1) out.push(c + 1);
  if(y < ROWS - 1) out.push(c + COLS);
  return out;
}
function countOf(p, f){ let k = 0; for(const x of p) if(x === f) k++; return k; }
function kindsOf(p){ const out = []; for(const x of p) if(!out.includes(x)) out.push(x); return out; }
const isCake = p => p.length === CAP && p.every(x => x === p[0]);
// slices of f leave from the end of their group and arrive after it, so each
// plate keeps every cake type in one run of neighbouring slots
function takeSlices(p, f, k){
  for(let i = p.length - 1; i >= 0 && k > 0; i--) if(p[i] === f){ p.splice(i, 1); k--; }
}
function addSlices(p, f, k){
  const at = p.lastIndexOf(f);
  const ins = Array(k).fill(f);
  if(at < 0) p.push(...ins); else p.splice(at + 1, 0, ...ins);
}
const emptyCells = cells => { const out = []; for(let c = 0; c < CELLS; c++) if(cells[c] === null) out.push(c); return out; };

/* ---- the sort ----
   A plate that changes looks at each cake type it holds. Among itself and the
   neighbours holding the same cake, the plate that can end up with the most
   slices of it becomes the gathering point, and the slices on the plates next
   to it fly over, smallest groups first, as far as there is room. A transfer
   happens only if it leaves more slices together than any plate that gives
   them up had, so the sort always settles. Six slices of one cake make a
   whole cake, which is served (taken off the board); a plate left empty goes
   too. Every plate a transfer touches is checked again, so sorting chains. */
function bestGather(cells, c){
  const p = cells[c];
  let best = null;
  for(const f of kindsOf(p)){
    const cands = [c];
    for(const n of neighbours(c)) if(isPlate(cells[n]) && cells[n].includes(f)) cands.push(n);
    if(cands.length < 2) continue;
    for(const d of cands){
      const pd = cells[d], cd = countOf(pd, f), room = CAP - pd.length;
      if(room <= 0) continue;
      let srcs = [];
      for(const n of neighbours(d)){
        const q = cells[n];
        if(isPlate(q) && !isCake(q)){ const k = countOf(q, f); if(k) srcs.push([n, k]); }
      }
      srcs.sort((a, b) => a[1] - b[1] || a[0] - b[0]);
      let from, final;
      for(;;){
        from = []; let left = room;
        for(const [n, k] of srcs){ if(!left) break; const take = Math.min(k, left); from.push([n, take, k]); left -= take; }
        final = cd + room - left;
        const keep = srcs.filter(([, k]) => k < final);
        if(keep.length === srcs.length) break;
        srcs = keep;
      }
      if(!from.length) continue;
      const others = pd.length - cd;
      const cake = final === CAP && others === 0;
      const moved = final - cd;
      // completes a cake > most slices together > fewest other cakes on the
      // gathering plate > fewest slices flown > the plate that changed
      const key = [cake ? 1 : 0, final, -others, -moved, d === c ? 1 : 0];
      if(!best || cmpKey(key, best.key) > 0) best = { key, f, d, from: from.map(([n, take]) => [n, take]) };
    }
  }
  return best;
}
function cmpKey(a, b){ for(let i = 0; i < a.length; i++) if(a[i] !== b[i]) return a[i] - b[i]; return 0; }

/* Settle the board after the plate at `start` changed. Mutates `cells` and
   returns the steps in the order they should play: each step is one gathering
   ({d, f, from: [[cell, slices]], cake, emptied}). */
function resolve(cells, start){
  const steps = [], queue = [start];
  let guard = 0;
  while(queue.length && guard < 400){
    const c = queue.shift();
    for(;;){
      if(++guard > 400) break;
      if(!isPlate(cells[c]) || isCake(cells[c])) break;
      const g = bestGather(cells, c);
      if(!g) break;
      const touched = [g.d];
      for(const [n, k] of g.from){ takeSlices(cells[n], g.f, k); addSlices(cells[g.d], g.f, k); touched.push(n); }
      const step = { d: g.d, f: g.f, from: g.from, cake: false, emptied: [] };
      for(const [n] of g.from) if(!cells[n].length){ cells[n] = null; step.emptied.push(n); }
      if(isCake(cells[g.d])){ step.cake = true; cells[g.d] = null; }
      steps.push(step);
      for(const t of touched) if(t !== c && isPlate(cells[t]) && !queue.includes(t)) queue.push(t);
      if(!isPlate(cells[c])) break;
    }
  }
  return steps;
}

/* ---- dealing plates ---- */
function makePlate(cells, sp, flv, rs){
  const r = () => rngNext(rs);
  let n;
  const u = r();
  if(u < sp.big) n = r() < .7 ? 4 : 5;
  else n = u < sp.big + (1 - sp.big) * .22 ? 1 : u < sp.big + (1 - sp.big) * .62 ? 2 : 3;
  let kinds = 1;
  if(n >= 2 && r() < sp.mix) kinds = 2;
  if(n >= 3 && kinds === 2 && r() < sp.mix3) kinds = 3;
  // what's already out, weighted by how many slices of it there are
  const out = new Map();
  for(const p of cells) if(isPlate(p)) for(const f of p) out.set(f, (out.get(f) || 0) + 1);
  const chosen = [];
  while(chosen.length < kinds){
    let f = -1;
    if(out.size && r() < sp.help){
      let tot = 0; for(const [g, k] of out) if(!chosen.includes(g)) tot += k;
      let x = r() * tot;
      for(const [g, k] of out){ if(chosen.includes(g)) continue; x -= k; if(x < 0){ f = g; break; } }
    }
    if(f < 0){ const left = flv.filter(g => !chosen.includes(g)); f = left[(r() * left.length) | 0]; }
    chosen.push(f);
  }
  const counts = chosen.map(() => 1);
  for(let k = kinds; k < n; k++) counts[(r() * kinds) | 0]++;
  const plate = [];
  chosen.forEach((f, i) => { for(let k = 0; k < counts[i]; k++) plate.push(f); });
  return plate;
}
function deal(L){
  if(L.tray.some(Boolean)) return false;
  for(let t = 0; t < TRAY; t++) L.tray[t] = makePlate(L.cells, L.sp, L.flv, L.rs);
  return true;
}

/* Build level n: which cakes are on the menu, the cake stands in the way, a
   few plates already out, and the first tray. Deterministic per level number,
   so a restart replays the same opening (the plates after that follow from
   where you put things). */
function newLevel(n, h){
  const sp = spec(n, h), rs = { s: seedFor(n, 11 + Math.round(sp.heat * 20)) | 0 };
  const pool = UNLOCK_AT.map((u, f) => u <= n ? f : -1).filter(f => f >= 0);
  const newest = pool.filter(f => UNLOCK_AT[f] === n && n > 1);
  const rest = shuffle(pool.filter(f => !newest.includes(f)), rs);
  const flv = newest.concat(rest).slice(0, sp.K).sort((a, b) => a - b);
  const cells = Array(CELLS).fill(null);
  // cake stands: never in the bottom row, never two side by side
  let tries = 0, placed = 0;
  while(placed < sp.blocked && tries++ < 200){
    const c = (rngNext(rs) * (CELLS - COLS)) | 0;
    if(cells[c] !== null || neighbours(c).some(m => cells[m] === BLOCKED)) continue;
    cells[c] = BLOCKED; placed++;
  }
  // plates already out, none touching another that shares a cake
  const preSp = Object.assign({}, sp, { help: 0, big: Math.min(.3, sp.big) });
  tries = 0; placed = 0;
  while(placed < sp.pre && tries++ < 300){
    const c = (rngNext(rs) * CELLS) | 0;
    if(cells[c] !== null) continue;
    const p = makePlate(cells, preSp, flv, rs);
    if(neighbours(c).some(m => isPlate(cells[m]) && cells[m].some(f => p.includes(f)))) continue;
    cells[c] = p; placed++;
  }
  const L = { n, sp, flv, cells, tray: Array(TRAY).fill(null), rs, baked: 0, bakedBy: {}, moves: 0 };
  if(n === 1){
    // the first level is set: three strawberry slices out, three more in the
    // tray, so the very first drop finishes a cake
    cells[9] = [0, 0, 0]; cells[14] = [1, 1, 1, 1];
    L.tray = [[0, 0, 0], [2, 2, 1], [2, 2]];
    return L;
  }
  deal(L);
  return L;
}

/* Put tray plate t on cell c. Returns the steps of the sort that follows, or
   null if the move isn't legal. Deals a new tray once all three are used. */
function place(L, t, c){
  if(!L.tray[t] || L.cells[c] !== null) return null;
  L.cells[c] = L.tray[t]; L.tray[t] = null; L.moves++;
  const steps = resolve(L.cells, c);
  for(const s of steps) if(s.cake){ L.baked++; L.bakedBy[s.f] = (L.bakedBy[s.f] || 0) + 1; }
  const dealt = deal(L);
  return { steps, dealt };
}
const isWon = L => L.baked >= L.sp.goal;
const isStuck = L => !isWon(L) && L.tray.some(Boolean) && !L.cells.includes(null);

/* ---- simulated players, for the balance probe ---- */
function cloneLevel(L){
  return Object.assign({}, L, { cells: L.cells.map(p => isPlate(p) ? p.slice() : p), tray: L.tray.map(p => p && p.slice()),
    rs: { s: L.rs.s }, bakedBy: Object.assign({}, L.bakedBy) });
}
// how good a board looks to a player who thinks one plate ahead
function boardScore(cells){
  let s = 0;
  for(let c = 0; c < CELLS; c++){
    const p = cells[c];
    if(p === null){ s += 16; continue; }
    if(!isPlate(p)) continue;
    const ks = kindsOf(p);
    s -= (ks.length - 1) * 14;
    for(const f of ks){ const k = countOf(p, f); s += k * k * 1.4; }
    for(const n of neighbours(c)) if(isPlate(cells[n]) && n > c && cells[n].some(f => p.includes(f))) s += 3;
  }
  return s;
}
function candidates(L){
  const out = [], empty = emptyCells(L.cells);
  L.tray.forEach((p, t) => { if(p) for(const c of empty) out.push([t, c]); });
  return out;
}
/* skill 1: best move by boardScore after the sort, plus a little noise.
   skill 0: a casual player, who mostly drops a plate next to one that shares
   a cake, picking among those at random, and otherwise plays anywhere. */
function botMove(L, skill, rand){
  const cs = candidates(L);
  if(!cs.length) return null;
  if(skill >= 1){
    let best = null, bs = -1e9;
    for(const [t, c] of cs){
      const X = cloneLevel(L), cells = X.cells;
      cells[c] = X.tray[t]; X.tray[t] = null;
      const steps = resolve(cells, c);
      const cakes = steps.filter(s => s.cake).length;
      const sc = cakes * 120 + boardScore(cells) + rand() * 6;
      if(sc > bs){ bs = sc; best = [t, c]; }
    }
    return best;
  }
  const good = cs.filter(([t, c]) => neighbours(c).some(n => isPlate(L.cells[n]) && L.cells[n].some(f => L.tray[t].includes(f))));
  const pick = good.length && rand() < .85 ? good : cs;
  return pick[(rand() * pick.length) | 0];
}
// plays level n from its opening; returns plates used, or -1 for a loss
function playout(n, skill, seed, h){
  const L = newLevel(n, h);
  L.rs.s = (L.rs.s ^ seed) | 0;                  // a different run of plates each time
  const rr = { s: seed | 0 }, rand = () => rngNext(rr);
  for(let k = 0; k < 600; k++){
    if(isWon(L)) return L.moves;
    const m = botMove(L, skill, rand);
    if(!m) return -1;
    place(L, m[0], m[1]);
  }
  return -1;
}
function probe(from, to, runs){
  runs = runs || 24;
  const rows = [];
  for(let n = from; n <= to; n++){
    const sp = spec(n), t0 = Date.now();
    let casual = 0, skilled = 0, plates = 0, wins = 0;
    for(let i = 0; i < runs; i++){
      const a = playout(n, 0, seedFor(n, 500 + i)), b = playout(n, 1, seedFor(n, 900 + i));
      if(a < 0) casual++;
      if(b < 0) skilled++; else { plates += b; wins++; }
    }
    rows.push({ n, tier: sp.tier, K: sp.K, goal: sp.goal, blocked: sp.blocked, heat: sp.heat,
      casual: casual / runs, skilled: skilled / runs, fail: (casual + skilled) / (2 * runs),
      plates: wins ? plates / wins : 0, ms: Date.now() - t0 });
  }
  return rows;
}

/* ==================== 2. drawing ==================== */
const SQ = .68;                        // how flat the counter looks (1 = straight down)
const SEG = Math.PI / 3;               // one slice
const TAU = Math.PI * 2;
const SLOT0 = Math.PI * 7 / 6;         // a plate fills from the back left, clockwise
const CAKE_R = .8, CAKE_H = .52;       // cake radius on its plate, cake height on its radius
const RC = .6366;                      // centroid of a sixth of a disc, as a share of the radius
const slotAngle = i => SLOT0 + i * SEG;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutBack = t => { const c = 1.6; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const easeInBack = t => 2.7 * t * t * t - 1.7 * t * t;

const toneCache = new Map();
function tone(hex, amt){                // amt > 0 toward white, < 0 toward black
  const key = hex + amt.toFixed(2);
  let v = toneCache.get(key);
  if(!v){
    const n = parseInt(hex.slice(1), 16), k = Math.abs(amt), t = amt > 0 ? 255 : 0;
    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(x => Math.round(x + (t - x) * k));
    v = `rgb(${c[0]},${c[1]},${c[2]})`;
    if(toneCache.size > 4000) toneCache.clear();
    toneCache.set(key, v);
  }
  return v;
}
function readTheme(el){
  const cs = getComputedStyle(el), v = n => cs.getPropertyValue(n).trim();
  return {
    cloth: v('--cs-cloth'), check: v('--cs-check'), clothEdge: v('--cs-cloth-edge'), mat: v('--cs-mat'), matEdge: v('--cs-mat-edge'),
    plate: v('--cs-plate'), plateEdge: v('--cs-plate-edge'), plateWell: v('--cs-plate-well'), plateLine: v('--cs-plate-line'),
    shadow: v('--cs-shadow'), wood: v('--cs-wood'), wood2: v('--cs-wood-2'), edge: v('--cs-edge'), glass: v('--cs-glass'),
    accent: v('--cs-accent'), ink: v('--ink'), surface: v('--surface'), muted: v('--muted')
  };
}
function ell(ctx, x, y, rx, ry, rot){ ctx.beginPath(); ctx.ellipse(x, y, Math.max(.01, rx), Math.max(.01, ry), rot || 0, 0, TAU); }
// the parts of [a, b] that face the viewer (sin > 0 is toward the front)
function frontArcs(a, b){
  const out = [];
  for(let k = Math.floor(a / TAU) - 1; k <= Math.floor(b / TAU) + 1; k++){
    const s = Math.max(a, k * TAU), e = Math.min(b, k * TAU + Math.PI);
    if(e - s > 1e-4) out.push([s, e]);
  }
  return out;
}

// spots inside a slice for patterns: [across the slice 0..1, out from the centre 0..1]
const SPECKS = [[.2, .45], [.55, .3], [.82, .55], [.32, .74], [.64, .66], [.47, .9], [.86, .84], [.14, .88], [.72, .2], [.4, .56], [.9, .36], [.25, .25]];
const SPRINKLE = ['#FF5A8A', '#FFD23F', '#5AD17F', '#FFFFFF', '#B57BFF', '#FF9A3D'];

/* One slice: a sixth of a cylinder, cake centre (cx, cy) on the plate, radius
   R, height H, spanning angles [a, a + SEG]. Faces are drawn back to front:
   the cut faces that face us (showing the layers), the curved outside, then
   the top with its pattern, piping and topping. */
function drawSlice(ctx, cx, cy, R, H, a, F, o){
  const b = a + SEG, ry = R * SQ, lw = Math.max(.6, R * .028);
  ctx.lineJoin = 'round';
  // cut faces
  for(let side = 0; side < 2; side++){
    const ang = side ? b : a, c = Math.cos(ang);
    if(side ? c < .02 : c > -.02) continue;
    const nx = side ? -Math.sin(b) : Math.sin(a);            // light comes from the left
    const amt = -nx * .16 - .05;
    const ex = Math.cos(ang) * R, ey = Math.sin(ang) * ry;
    let z = 0;
    for(let i = 0; i < F.layers.length; i++){
      const [col, fr] = F.layers[i], z1 = i === F.layers.length - 1 ? H : z + fr * H + .6;
      ctx.fillStyle = tone(col, amt);
      ctx.beginPath(); ctx.moveTo(cx, cy - z); ctx.lineTo(cx + ex, cy + ey - z); ctx.lineTo(cx + ex, cy + ey - z1); ctx.lineTo(cx, cy - z1); ctx.closePath(); ctx.fill();
      z += fr * H;
    }
    if(F.sideStyle === 'frost'){                                // the frosting coat seen in section
      const k = .9;
      ctx.fillStyle = tone(F.side, amt);
      ctx.beginPath(); ctx.moveTo(cx + ex * k, cy + ey * k); ctx.lineTo(cx + ex, cy + ey); ctx.lineTo(cx + ex, cy + ey - H); ctx.lineTo(cx + ex * k, cy + ey * k - H); ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = o.edge; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + ex, cy + ey); ctx.lineTo(cx + ex, cy + ey - H); ctx.lineTo(cx, cy - H); ctx.closePath(); ctx.stroke();
  }
  // the curved outside
  const band = (s, e, z0, z1) => { ctx.beginPath(); ctx.ellipse(cx, cy - z0, R, ry, 0, s, e); ctx.ellipse(cx, cy - z1, R, ry, 0, e, s, true); ctx.closePath(); };
  for(const [s, e] of frontArcs(a, b)){
    if(F.sideStyle === 'naked'){
      let z = 0;
      for(let i = 0; i < F.layers.length; i++){
        const [col, fr] = F.layers[i], z1 = i === F.layers.length - 1 ? H : z + fr * H + .6;
        band(s, e, z, z1); ctx.fillStyle = col; ctx.fill();
        z += fr * H;
      }
    } else { band(s, e, 0, H); ctx.fillStyle = F.side; ctx.fill(); }
    if(F.drip){
      band(s, e, H * .8, H); ctx.fillStyle = F.drip; ctx.fill();
      for(let j = 0; j < 3; j++){
        const t = a + SEG * (j + .5) / 3;
        if(t < s || t > e) continue;
        const x = cx + Math.cos(t) * R, y = cy + Math.sin(t) * ry - H * .82;
        const len = H * (.22 + ((j * 7 + 3) % 5) * .09), w = R * .06 * (.6 + .4 * Math.sin(t) );
        ctx.beginPath(); ctx.moveTo(x - w, y); ctx.lineTo(x - w, y + len); ctx.arc(x, y + len, w, Math.PI, 0, true); ctx.lineTo(x + w, y); ctx.closePath(); ctx.fill();
      }
    }
    band(s, e, 0, H); ctx.fillStyle = o.sideShade; ctx.fill();
    ctx.strokeStyle = o.edge; ctx.lineWidth = lw; ctx.stroke();
  }
  // the top
  const topPath = () => { ctx.beginPath(); ctx.moveTo(cx, cy - H); ctx.ellipse(cx, cy - H, R, ry, 0, a, b); ctx.closePath(); };
  topPath(); ctx.fillStyle = F.top; ctx.fill();
  if(F.pattern){ ctx.save(); ctx.clip(); drawPattern(ctx, cx, cy - H, R, a, F); ctx.restore(); topPath(); }
  ctx.strokeStyle = o.edge; ctx.lineWidth = lw * .8; ctx.stroke();
  // a lit edge along the front of the top
  for(const [s, e] of frontArcs(a, b)){
    ctx.beginPath(); ctx.ellipse(cx, cy - H, R * .985, ry * .985, 0, s, e);
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = lw * 1.2; ctx.stroke();
  }
  // piping at the rim and the topping inside it; the nearer one is drawn last
  const m = a + SEG / 2, s = R * .21;
  const pp = [cx + Math.cos(m) * R * .8, cy + Math.sin(m) * ry * .8 - H];
  const tp = [cx + Math.cos(m) * R * .5, cy + Math.sin(m) * ry * .5 - H];
  const front = Math.sin(m) > 0;
  if(F.pipe && !front) drawPipe(ctx, pp[0], pp[1], s, F.pipe);
  drawTopping(ctx, F.topping, tp[0], tp[1], s, o.flame);
  if(F.pipe && front) drawPipe(ctx, pp[0], pp[1], s, F.pipe);
}
function drawPattern(ctx, cx, cy, R, a, F){
  const ry = R * SQ, at = (u, v) => [cx + Math.cos(a + u * SEG) * R * v, cy + Math.sin(a + u * SEG) * ry * v];
  switch(F.pattern){
    case 'glaze':                                             // a reflection: fixed on screen, not on the cake
      ctx.strokeStyle = 'rgba(255,255,255,.42)'; ctx.lineWidth = R * .08; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.ellipse(cx - R * .06, cy - ry * .06, R * .66, ry * .62, 0, Math.PI * 1.08, Math.PI * 1.62); ctx.stroke();
      break;
    case 'swirl':
      ctx.strokeStyle = tone(F.top, .14); ctx.lineWidth = R * .045;
      for(const k of [.36, .7]){ ctx.beginPath(); ctx.ellipse(cx, cy, R * k, ry * k, 0, 0, TAU); ctx.stroke(); }
      break;
    case 'dust':
      ctx.fillStyle = tone(F.top, -.28);
      for(const [u, v] of SPECKS){ const [x, y] = at(u, v); ell(ctx, x, y, R * .03, R * .03 * SQ); ctx.fill(); }
      break;
    case 'sprinkles':
      ctx.lineCap = 'round'; ctx.lineWidth = R * .045;
      SPECKS.forEach(([u, v], i) => {
        const [x, y] = at(u, v), d = R * .055, r = i * 1.7 + a;
        ctx.strokeStyle = SPRINKLE[i % SPRINKLE.length];
        ctx.beginPath(); ctx.moveTo(x - Math.cos(r) * d, y - Math.sin(r) * d * SQ); ctx.lineTo(x + Math.cos(r) * d, y + Math.sin(r) * d * SQ); ctx.stroke();
      });
      break;
    case 'crumbs':
      ctx.fillStyle = F.crumb;
      SPECKS.forEach(([u, v], i) => {

function cube(ctx, x, y, s, a, b, c){

      ctx.fillStyle = '#6A3814'; ell(ctx, x, ny - s * .4, s * .48, s * .2); ctx.fill();

/* side shading: darker toward both edges of the cake, a little light on the left */
function sideShade(ctx, x, R){
  const g = ctx.createLinearGradient(x - R, 0, x + R, 0);
  g.addColorStop(0, 'rgba(0,0,0,.2)'); g.addColorStop(.3, 'rgba(255,255,255,.06)');
  g.addColorStop(.6, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.3)');
  return g;
}
/* a porcelain plate centred at (x, y) */
function drawPlate(ctx, x, y, pr, th){
  const ry = pr * SQ;
  ctx.fillStyle = th.shadow; ell(ctx, x + pr * .05, y + ry * .26, pr * 1.02, ry * 1.02); ctx.fill();
  ctx.fillStyle = th.plateEdge; ell(ctx, x, y + pr * .075, pr, ry); ctx.fill();
  ctx.fillStyle = th.plate; ell(ctx, x, y, pr, ry); ctx.fill();
  ctx.strokeStyle = th.plateLine; ctx.lineWidth = Math.max(1, pr * .035); ell(ctx, x, y, pr * .87, ry * .87); ctx.stroke();
  ctx.fillStyle = th.plateWell; ell(ctx, x, y + pr * .02, pr * .72, ry * .72); ctx.fill();
}
/* slices given as [cake, start angle], drawn back to front */
function drawSlices(ctx, x, y, R, list, th, flame){
  const H = R * CAKE_H;
  list.sort((p, q) => Math.sin(p[1] + SEG / 2) - Math.sin(q[1] + SEG / 2));
  const o = { edge: th.edge, sideShade: sideShade(ctx, x, R), flame };
  for(const [f, a] of list) drawSlice(ctx, x, y, R, H, a, CAKES[f], o);
}
/* a glass cloche on a stand, with a cupcake inside: a cell nothing can go on */
function drawCloche(ctx, x, y, pr, th){
  const ry = pr * SQ;
  ctx.fillStyle = th.shadow; ell(ctx, x + pr * .05, y + ry * .2, pr * .86, ry * .86); ctx.fill();
  ctx.fillStyle = th.plateEdge; ell(ctx, x, y + pr * .07, pr * .82, ry * .82); ctx.fill();
  ctx.fillStyle = th.plate; ell(ctx, x, y, pr * .82, ry * .82); ctx.fill();
  // cupcake
  const cy = y - pr * .02, w = pr * .3;
  ctx.fillStyle = '#F6A8C2';
  ctx.beginPath(); ctx.moveTo(x - w, cy - w * 1.05); ctx.lineTo(x + w, cy - w * 1.05); ctx.lineTo(x + w * .74, cy); ctx.lineTo(x - w * .74, cy); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = Math.max(.6, pr * .025);
  for(let k = -2; k <= 2; k++){ ctx.beginPath(); ctx.moveTo(x + k * w * .38, cy - w * 1.02); ctx.lineTo(x + k * w * .3, cy - 1); ctx.stroke(); }
  ctx.fillStyle = '#FFF4F8'; ell(ctx, x, cy - w * 1.15, w * 1.1, w * .5); ctx.fill();
  ell(ctx, x, cy - w * 1.55, w * .8, w * .42); ctx.fill();
  ell(ctx, x, cy - w * 1.9, w * .45, w * .3); ctx.fill();
  ctx.fillStyle = '#E3263D'; ell(ctx, x, cy - w * 2.2, w * .24, w * .24); ctx.fill();
  // dome
  const dh = pr * 1.15, dw = pr * .74;
  ctx.fillStyle = th.glass;
  ctx.beginPath(); ctx.ellipse(x, y, dw, dh, 0, Math.PI, TAU); ctx.ellipse(x, y, dw, dw * SQ, 0, 0, Math.PI); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = Math.max(1, pr * .04);
  ctx.beginPath(); ctx.ellipse(x, y, dw, dh, 0, Math.PI, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = Math.max(1, pr * .07); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.ellipse(x, y, dw * .72, dh * .8, 0, Math.PI * 1.12, Math.PI * 1.38); ctx.stroke();
  ctx.fillStyle = th.plateEdge; ell(ctx, x, y - dh - pr * .06, pr * .1, pr * .08); ctx.fill();

/* a whole cake on a plate, for icons and the lobby; rot turns it */
function drawWholeCake(ctx, x, y, pr, f, th, rot){
  drawPlate(ctx, x, y, pr, th);
  const list = [];
  for(let i = 0; i < 6; i++) list.push([f, slotAngle(i) + (rot || 0)]);
  drawSlices(ctx, x, y, pr * CAKE_R, list, th);
}
function cakeIcon(cv, f, o){
  o = o || {};
  const W = cv.clientWidth || o.w || 30, H = cv.clientHeight || o.h || 26, dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  const th = o.th || readTheme(document.documentElement);
  const pr = Math.min(W / 2.15, H / (2 * SQ + .62));
  const y = H - pr * SQ - pr * .12;
  if(o.locked){
    ctx.globalAlpha = .9;
    drawPlate(ctx, W / 2, y, pr, th);
    const R = pr * CAKE_R, h = R * CAKE_H;
    ctx.fillStyle = th.plateEdge;

    ctx.globalAlpha = 1;

  }

}

/* ==================== 3. sound ==================== */
function makeSfx(A){
  const penta = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28];
  const note = (base, semi) => base * Math.pow(2, semi / 12);
  return {
    pick(){ A.tone({ f: 1760, dur: .05, gain: .05, type: 'triangle' }); A.tone({ f: 520, f1: 780, dur: .08, gain: .1 }); },
    drop(){ A.tone({ f: 640, f1: 420, dur: .08, gain: .08 }); },
    // porcelain on the counter: a bright knock with a short ring
    place(){
      A.noise({ f: 2600, dur: .05, gain: .16, q: 3 });
      A.tone({ f: 340, f1: 230, dur: .1, gain: .18 });
      A.tone({ f: 2350, dur: .22, gain: .035, type: 'triangle', at: .01 });
    },
    // a slice takes off: a soft rising whoosh
    whoosh(at){ A.noise({ filter: 'bandpass', f: 500, f1: 2600, dur: .26, gain: .06, q: 1.2, at, attack: .05 }); },
    // and lands: a plucked note that climbs as the plate fills
    land(k, at){
      const f = note(392, penta[clamp(k, 0, penta.length - 1)]);
      A.tone({ f, f1: f * 1.01, dur: .16, gain: .13, type: 'triangle', at });
      A.tone({ f: f * 2, dur: .08, gain: .04, at });
      A.noise({ filter: 'lowpass', f: 900, dur: .05, gain: .05, at });
    },
    // the turntable spins
    spin(at){ A.tone({ f: 260, f1: 620, dur: .3, gain: .035, type: 'triangle', at, attack: .04 }); },
    cake(combo){
      const base = note(523.25, penta[clamp(combo, 0, 6)]);
      [0, 4, 7, 12].forEach((s, i) => A.bell(note(base, s), i * .06, .12));
      A.noise({ filter: 'highpass', f: 6000, dur: .5, gain: .05, at: .05, attack: .04 });
    },
    served(){ A.tone({ f: 1318.5, dur: .06, gain: .05, type: 'square', filter: 'lowpass', ff: 3800 }); A.tone({ f: 1975.5, dur: .12, gain: .05, type: 'square', at: .05, filter: 'lowpass', ff: 3800 }); },
    empty(at){ A.tone({ f: 980, f1: 340, dur: .07, gain: .08, at }); },
    deal(){ [0, 1, 2].forEach(i => { A.noise({ f: 1400 + i * 300, f1: 2400, dur: .07, gain: .05, q: 2, at: i * .07 }); A.tone({ f: 700 + i * 90, dur: .05, gain: .04, at: i * .07 + .02 }); }); },
    bonk(){ A.tone({ f: 190, f1: 105, dur: .18, gain: .2, type: 'square', filter: 'lowpass', ff: 650 }); },
    smash(){
      A.tone({ f: 150, f1: 55, dur: .22, gain: .3 });
      for(let k = 0; k < 6; k++) A.noise({ filter: 'highpass', f: 3500 + k * 600, dur: .05 + k * .015, gain: .1, at: k * .025 });
      A.noise({ filter: 'lowpass', f: 900, dur: .2, gain: .14 });
    },
    undo(){ A.noise({ f: 2600, f1: 480, dur: .22, gain: .12, q: 1.4 }); A.tone({ f: 700, f1: 420, dur: .14, gain: .06 }); },
    refresh(){ [0, 1, 2].forEach(i => A.noise({ f: 900, f1: 2600, dur: .12, gain: .07, q: 1.5, at: i * .08 })); },
    win(){
      [0, 4, 7, 12, 16, 19].forEach((s, i) => A.bell(note(523.25, s), i * .085, .15));
      A.noise({ filter: 'highpass', f: 5500, dur: .9, gain: .04, at: .4, attack: .1 });
      A.tone({ f: 130.8, f1: 131, dur: .9, gain: .12, type: 'triangle', at: .5 });
    },
    full(){ [7, 4, 0].forEach((s, i) => A.tone({ f: note(330, s), dur: .22, gain: .08, type: 'triangle', at: i * .12 })); },
    coin(i){
      A.tone({ f: 1318.5, dur: .06, gain: .05, type: 'square', at: i * .055, filter: 'lowpass', ff: 3800 });
      A.tone({ f: 1975.5, dur: .12, gain: .05, type: 'square', at: i * .055 + .05, filter: 'lowpass', ff: 3800 });
    },
    unlock(){ [0, 7, 12, 16, 19, 24].forEach((s, i) => A.bell(note(659.25, s), i * .07, .1)); },
    hard(tier){
      A.tone({ f: 140, f1: 48, dur: .4, gain: .4 }); A.noise({ filter: 'lowpass', f: 400, dur: .2, gain: .2 });
      A.tone({ f: 140, f1: 48, dur: .4, gain: .35, at: .22 }); A.noise({ filter: 'lowpass', f: 400, dur: .2, gain: .18, at: .22 });
      const chord = tier === 2 ? [0, 3, 6, 10] : [0, 3, 7];
      chord.forEach((s, i) => A.tone({ f: note(196, s), dur: 1.1, gain: .07, type: 'sawtooth', filter: 'lowpass', ff: 900, at: .44 + i * .02, attack: .08 }));
    }
  };
}

function mount(stage, api){

  S.stats = Object.assign({ won: 0, cakes: 0, hard: 0, super: 0 }, S.stats);

  S.tips = S.tips || {};
  // adaptive difficulty: this game's belief about the player's skill (Playbox.skill)

  let combo = 0;

  let bg = null;
  const sprites = new Map();
  const timers = new Set();

  /* ---------- geometry ---------- */
  const cellX = c => bx + (c % COLS + .5) * cw;

    const used = cw * (TOP + ROWS * RP + MID + TRAY_H);

    by = fy + Math.max(0, (fh - used) / 2) + cw * TOP;

  }
  function buildBg(){

    bg.width = cv.width; bg.height = cv.height;
    const g = bg.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    // the tablecloth
    const x0 = bx - cw * .14, y0 = by - rp * .5 - cw * .06, w = cw * COLS + cw * .28, hh = rp * ROWS + cw * .2;

    g.strokeStyle = 'rgba(0,0,0,.08)'; g.lineWidth = 1.4;
    for(let k = 1; k < 5; k++){

    }
    g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 2; roundRect(g, W / 2 - tw / 2 + 1, trayY - th / 2 + 1, tw - 2, th - 2, 21); g.stroke();

      g.strokeStyle = 'rgba(255,255,255,.4)'; g.lineWidth = 1.5; g.setLineDash([4, 5]); ell(g, x, trayY + pr * .06, pr * .98, pr * SQ * .98); g.stroke(); g.setLineDash([]);
    }
  }
  function roundRect(g, x, y, w, hh, r){ g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + hh, r); g.arcTo(x + w, y + hh, x, y + hh, r); g.arcTo(x, y + hh, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

    const ry = r * SQ, n = 18;

    g.beginPath();
    for(let k = 0; k < n; k++){ const t = k / n * TAU; g.moveTo(x + Math.cos(t) * r * .93 + r * .11, y + Math.sin(t) * ry * .93); g.ellipse(x + Math.cos(t) * r * .93, y + Math.sin(t) * ry * .93, r * .11, r * .11 * SQ, 0, 0, TAU); }
    g.fill();
    ell(g, x, y, r * .95, ry * .95); g.fill();
    g.strokeStyle = theme.matEdge; g.lineWidth = 1.2; g.setLineDash([2, 3]);
    ell(g, x, y, r * .78, ry * .78); g.stroke(); g.setLineDash([]);
  }

  /* ---------- plate visuals ---------- */
  // a visual slice: angle eases from a0 to a1 between t0 and t0 + dur
  const vSlice = (f, i) => ({ f, a0: slotAngle(i), a1: slotAngle(i), t0: 0, dur: 0, ghost: false });
  const angleOf = (s, t) => t >= s.t0 + s.dur ? s.a1 : s.a0 + (s.a1 - s.a0) * (s.spin ? easeOutBack : easeOutCubic)(clamp((t - s.t0) / s.dur, 0, 1));
  const plateVis = (p, born) => ({ slices: p.map((f, i) => vSlice(f, i)), born: born || 0, dying: 0 });

    pv.slices.forEach((s, i) => {
      const cur = angleOf(s, t), target = slotAngle(i);
      let d = ((target - cur) % TAU + TAU) % TAU;
      if(d > Math.PI) d -= TAU;
      s.a0 = cur; s.a1 = cur + d + turns * TAU; s.t0 = t; s.dur = dur; s.spin = turns > 0;
    });
  }
  const settled = (pv, t) => pv.slices.every(s => !s.ghost && t >= s.t0 + s.dur) && (!pv.born || t > pv.born + 420) && !pv.dying;
  function syncVis(pop){
    const t = now();
    vis = L.cells.map(p => isPlate(p) ? plateVis(p, pop ? t + Math.random() * 120 : 0) : null);
    trayVis = L.tray.map((p, i) => p ? plateVis(p, pop ? t + i * 70 : 0) : null);
  }

  /* ---------- drawing ---------- */
  function spriteFor(fs){
    const key = fs.join('.');
    let sp = sprites.get(key);

      const w = Math.ceil(pr * 2.4), hh = Math.ceil(pr * SQ * 2 + pr * CAKE_R * CAKE_H + pr * .9);
      const c = document.createElement('canvas'); c.width = Math.ceil(w * dpr); c.height = Math.ceil(hh * dpr);
      const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
      const ox = w / 2, oy = hh - pr * SQ - pr * .22;
      drawPlate(g, ox, oy, pr, theme);
      drawSlices(g, ox, oy, pr * CAKE_R, fs.map((f, i) => [f, slotAngle(i)]), theme);
      sp = { c, ox, oy, w, hh };
      if(sprites.size > 160) sprites.clear();
      sprites.set(key, sp);
    }
    return sp;
  }
  function plateScale(pv, t){
    if(pv.dying){ const u = clamp((t - pv.dying) / 300, 0, 1); return u <= 0 ? 1 : 1 - easeInBack(u) * 1; }
    if(pv.born && t < pv.born + 420){ const u = clamp((t - pv.born) / 420, 0, 1); return u <= 0 ? 0 : easeOutBack(u); }
    return 1;
  }
  function drawPlateVis(pv, x, y, t, lift, scale){
    const k = plateScale(pv, t) * (scale || 1);
    if(k <= .01) return;
    const lifted = lift || 0;
    if(settled(pv, t) && k === 1 && !lifted){
      const sp = spriteFor(pv.slices.map(s => s.f));
      ctx.drawImage(sp.c, x - sp.ox, y - sp.oy, sp.w, sp.hh);
      return;
    }
    ctx.save();
    ctx.translate(x, y); ctx.scale(k, k); ctx.translate(-x, -y);
    if(lifted){ ctx.fillStyle = theme.shadow; ell(ctx, x, y + pr * .25, pr * .95, pr * SQ * .9); ctx.fill(); }
    const yy = y - lifted;
    drawPlate(ctx, x, yy, pr, Object.assign({}, theme, lifted ? { shadow: 'rgba(0,0,0,0)' } : null));
    const list = [];
    for(const s of pv.slices) if(!s.ghost) list.push([s.f, angleOf(s, t)]);

  function flyerPose(fl, t){

  /* the layer above the HUD: finished cakes on their way to the order card, and particles */

  /* ---------- the loop ---------- */

      if(t >= fl.t0 + fl.dur){

        fl.ghost.ghost = false;
        sfx.land(fl.k, 0);

        crumbs(x, y, CAKES[fl.f].top, 4);
      }
    }
    for(let i = movers.length - 1; i >= 0; i--){ const m = movers[i]; if(t >= m.t0 + m.dur){ movers.splice(i, 1); m.done(); } }

      const sv = served[i];

      if(t >= sv.t0 + 1140){ served.splice(i, 1); arrive(sv.f); }
    }

  }
  function crumbs(x, y, col, n){
    for(let k = 0; k < n; k++) parts.push({ kind: 'crumb', x: x + (Math.random() - .5) * pr * .5, y, vx: (Math.random() - .5) * .12, vy: -.08 - Math.random() * .12, g: .0009, life: 0, max: 380, r: pr * (.03 + Math.random() * .03), c: col });
  }
  function sparkle(x, y, col){
    const cols = [col, '#FFE38A', '#FFFFFF'];
    for(let k = 0; k < 16; k++){
      const a = k / 16 * TAU + Math.random() * .3, v = .12 + Math.random() * .16;
      parts.push({ kind: 'star', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v * .8 - .05, g: .00012, life: 0, max: 650 + Math.random() * 300, r: pr * (.08 + Math.random() * .08), c: cols[k % 3], spin: Math.random() * 3 });

  function floatText(text, x, y, col, big){

  }

  /* ---------- playing a placement back ---------- */
  function chipFor(f){ return ref('menuRow').querySelector(`[data-f="${f}"]`); }

    const chip = chipFor(f), rr = playEl.getBoundingClientRect();
    const box = (chip ? chip.querySelector('canvas') || chip : ref('meterBar')).getBoundingClientRect();
    return [box.left + box.width / 2 - rr.left, box.top + box.height / 2 - rr.top];
  }
  function playStep(st){
    const t = now(), dest = vis[st.d];
    if(!dest){ return 0; }
    // spaces for the incoming slices, after the cake they join
    const total = st.from.reduce((n, x) => n + x[1], 0);
    const at = dest.slices.map(s => s.f).lastIndexOf(st.f);
    const ghosts = [];
    for(let j = 0; j < total; j++) ghosts.push({ f: st.f, a0: 0, a1: 0, t0: 0, dur: 0, ghost: true });
    if(at < 0) dest.slices.push(...ghosts); else dest.slices.splice(at + 1, 0, ...ghosts);
    ghosts.forEach(g => { const i = dest.slices.indexOf(g); g.a0 = g.a1 = slotAngle(i); });

  function serve(c, f){

    kick();
  }
  function arrive(f){

  }
  /* One queue of steps for the whole counter. The engine settles a placement

  }

  /* ---------- boosters ---------- */

    // giving up part-way counts as a lost try, so the next one is set a little easier
    const go = () => { if(L.moves >= 5) observe(false); S.cur = null; startLevel(L.n, true); };
    if(!confirmFirst || L.moves === 0){ go(); return; }
    sheet({ eyebrow: `Level ${L.n}`, title: 'Start this level again?', sub: 'The counter is cleared and you get a fresh set of plates.',
      actions: [{ label: 'Restart', onClick: go }, { label: 'Keep playing', kind: 'ghost' }] });
  }
  function intro(tier, then){
    const box = ref('intro');
    ref('introK').textContent = tier === 2 ? 'Super hard level' : 'Hard level';
    ref('introN').textContent = `Level ${L.n}`;
    ref('introS').textContent = `Bake ${L.sp.goal} cakes${L.sp.blocked ? ` around ${L.sp.blocked} cake stand${L.sp.blocked > 1 ? 's' : ''}` : ''}. Worth ${L.sp.reward} coins.`;
    box.dataset.tier = tier; box.hidden = false;
    box.classList.remove('on'); void box.offsetWidth; box.classList.add('on');
    sfx.hard(tier); buzz([30, 60, 30]);
    const done = () => { if(box.hidden) return; box.hidden = true; box.onclick = null; if(then) then(); };
    box.onclick = done;
    later(done, 2100);
  }
  /* a new cake on the menu: show it off on a turntable */
  function unlock(list){
    const f = list[0];
    for(const g of list) S.seen[g] = true;
    persist();
    const cvs = h('canvas', { 'aria-hidden': 'true' });
    const body = h('div', { class: 'cs-show' }, cvs);
    let spin = 0, alive = true;
    const t0 = now();
    const turn = () => {
      if(!alive) return;
      const W2 = cvs.clientWidth, H2 = cvs.clientHeight;
      if(W2 && H2){
        const d = Math.min(3, window.devicePixelRatio || 1);
        if(cvs.width !== Math.round(W2 * d)){ cvs.width = Math.round(W2 * d); cvs.height = Math.round(H2 * d); }
        const g = cvs.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, W2, H2);
        const p = Math.min(W2 / 2.4, H2 / (2 * SQ + .7)), e = clamp((now() - t0) / 900, 0, 1);
        const rot = (now() - t0) * .0011 + (1 - easeOutCubic(e)) * Math.PI * 2;
        const y = H2 - p * SQ - p * .14;
        drawPlate(g, W2 / 2, y, p, theme);
        const list2 = [];
        // slices drop in one by one, then the cake turns
        for(let i = 0; i < 6; i++){
          const k = clamp((now() - t0 - i * 90) / 300, 0, 1);
          if(k <= 0) continue;
          list2.push([f, slotAngle(i) + rot, k]);
        }
        const R = p * CAKE_R, H3 = R * CAKE_H, o = { edge: theme.edge, sideShade: sideShade(g, W2 / 2, R), flame: .85 + .15 * Math.sin(now() * .03) };
        list2.sort((p1, q1) => Math.sin(p1[1] + SEG / 2) - Math.sin(q1[1] + SEG / 2));
        for(const [ff, a, k] of list2) drawSlice(g, W2 / 2, y - (1 - easeOutCubic(k)) * p * .5, R, H3, a, CAKES[ff], o);
      }
      spin = requestAnimationFrame(turn);
    };
    sfx.unlock();
    sheet({ eyebrow: 'New cake on the menu', title: CAKES[f].name, sub: CAKES[f].note, body,
      actions: [{ label: list.length > 1 ? `Bake them` : `Bake it` }],
      onClose: () => { alive = false; cancelAnimationFrame(spin); } });
    spin = requestAnimationFrame(turn);
  }
  function win(){
    if(!L || L.won) return;
    L.won = true;
    shown = Object.assign({}, L.bakedBy); shownTotal = L.baked; renderGoal();
    // how much room was left at the tightest moment says how easily it went:
    // bots that win half the time keep about 12% of the counter free, easy
    // wins about half of it, so that maps to 0.5 and 0.9 (boosters cost a bit)
    const room = L.minFree / (CELLS - L.sp.blocked);
    observe(true, SK.Phi((room - .12 - (L.clean ? 0 : .1)) / .3));
    const sp = L.sp, bonus = L.clean ? 5 : 0, total = sp.reward + bonus;
    S.coins += total; S.level = Math.max(S.level, L.n + 1); S.cur = null;
    S.stats.won++; if(sp.tier === 1) S.stats.hard++; if(sp.tier === 2) S.stats.super++;
    api.persist(true);
    sfx.win(); buzz([20, 40, 20, 40, 60]);
    const next = spec(L.n + 1);
    const row = h('div', { class: 'cs-menu' });
    const coinsEl = h('b', null, '+0');
    const body = h('div', { class: 'cs-win' }, row,
      h('div', { class: 'cs-win-coins' }, h('i', { class: 'coin' }), coinsEl, h('span', null, bonus ? ' incl. 5 for no boosters' : '')));
    const baked = L.flv.filter(f => L.bakedBy[f]);
    later(() => {
      sheet({ eyebrow: sp.tier ? `${TIER_NAME[sp.tier]} level beaten` : `Level ${L.n} complete`,
        title: sp.tier === 2 ? 'Showstopper.' : sp.tier === 1 ? 'That was a tough bake.' : ['Order up!', 'Fresh out of the oven.', 'Sweet.', 'Counter cleared.'][L.n % 4],
        tone: sp.tier === 2 ? 'super' : sp.tier === 1 ? 'hard' : '', body, dismiss: false,
        actions: [
          { label: next.tier ? `Next: ${TIER_NAME[next.tier].toLowerCase()} level ${L.n + 1}` : 'Next level', kind: next.tier === 2 ? 'super' : next.tier === 1 ? 'hard' : 'primary', onClick: () => startLevel(S.level, true) },
          { label: 'Back to the bakery', kind: 'ghost', onClick: () => showView('lobby') }
        ] });
      menuChips(row, baked, L.bakedBy, [40, 34]);
      let shownC = 0; const stepN = Math.max(1, Math.round(total / 12));
      const tick = () => { shownC = Math.min(total, shownC + stepN); coinsEl.textContent = `+${shownC}`; sfx.coin(0); if(shownC < total) later(tick, 55); };
      later(tick, 350);
      updateHud();
    }, 350);
  }
  function menu(){
    const body = h('div', null,
      toggle('Sound', 'Clinks, whooshes and chimes', () => api.settings.sound, v => { api.settings.sound = v; api.persist(); if(v) A.ensure(); }),
      toggle('Vibration', 'On phones that support it', () => api.settings.haptics, v => { api.settings.haptics = v; api.persist(); }));
    sheet({ eyebrow: `Level ${L ? L.n : S.level}`, title: 'Paused', body,
      actions: [
        { label: 'Resume' },
        { label: 'How to play', kind: 'ghost', onClick: howTo },
        { label: 'Restart level', kind: 'ghost', onClick: () => restart(true) },
        { label: 'Back to the bakery', kind: 'ghost', onClick: () => showView('lobby') }
      ] });
  }
  function howTo(){
    const row = (t, d) => h('div', { class: 'cs-how' }, h('div', { class: 'cs-how-t' }, t), h('div', { class: 'cs-how-d' }, d));
    sheet({ eyebrow: 'How to play', title: 'Sort the slices',
      body: h('div', null,
        row('Drag a plate onto the counter', 'Any empty spot will do. You get three plates at a time, and three more when they are all down.'),
        row('Slices of the same cake fly together', 'When plates touch side by side (not corner to corner), each kind of cake gathers on the plate that can hold the most of it. Empty plates are cleared away.'),
        row('Six slices make a whole cake', 'A whole cake is served and counts toward the order at the top. Bake the number on the order to win.'),
        row('Keep space free', 'If the counter fills up, use the hammer to clear a plate, undo, or start again.'),
        row('Boosters', `Undo takes back a plate (${UNDOS_PER_TRY} per try). The hammer clears one plate. New plates swaps the ones in your tray.`),
        row('Hard levels', 'Levels 5 and 10 of every ten are harder, with cake stands in the way. They pay 30 and 60 coins.')),
      actions: [{ label: 'Got it' }] });
  }

  /* ---------- lobby ---------- */
  function renderLobby(){
    theme = readTheme(el);
    bind('coins', S.coins);
    const n = S.level, resume = S.cur && S.cur.n === n;
    const heat = resume ? S.cur.h : heatFor(n), sp = spec(n, heat);
    const flv = resume ? S.cur.flv : newLevel(n, heat).flv;
    const eb = ref('nextEyebrow');
    eb.textContent = sp.tier ? `Up next · ${TIER_NAME[sp.tier]}` : 'Up next'; eb.dataset.tier = sp.tier;
    bind('nextTitle', `Level ${n}`);
    bind('nextSub', `Bake ${sp.goal} cakes · ${flv.length} kinds${sp.blocked ? ` · ${sp.blocked} cake stand${sp.blocked > 1 ? 's' : ''}` : ''}`);
    menuChips(ref('nextMenu'), flv, null);
    ref('nextMenu').querySelectorAll('.cs-chip').forEach(ch => { ch.append(h('span', null, CAKES[+ch.dataset.f].name)); });
    const art = ref('nextArt');
    requestAnimationFrame(() => {
      const W2 = art.clientWidth, H2 = art.clientHeight, d = Math.min(3, window.devicePixelRatio || 1);
      if(!W2) return;
      art.width = W2 * d; art.height = H2 * d;
      const g = art.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0);
      const p = Math.min(W2 / 2.3, H2 / (2 * SQ + .62));
      drawWholeCake(g, W2 / 2, H2 - p * SQ - p * .12, p, flv[(n - 1) % flv.length], theme, 0);
    });
    const go = ref('go');
    go.className = 'btn btn-wide cs-go ' + (sp.tier === 2 ? 'btn-super' : sp.tier === 1 ? 'btn-hard' : 'btn-primary');
    go.innerHTML = `${IC.play}<span>${resume ? 'Continue' : 'Play'} level ${n}</span>`;
    // the collection: every cake, with how many you have baked
    const shelf = ref('shelf'); shelf.replaceChildren();
    let open = 0;
    CAKES.forEach((F, f) => {
      const unlocked = UNLOCK_AT[f] <= n;
      if(unlocked) open++;
      const icon = h('canvas', { 'aria-hidden': 'true' });
      shelf.append(h('div', { class: 'cs-cake' + (unlocked ? '' : ' locked') }, icon,
        h('div', null, h('b', null, unlocked ? F.name : 'Locked'),
          h('span', null, unlocked ? `${S.baked[f] || 0} baked` : `Level ${UNLOCK_AT[f]}`))));
      requestAnimationFrame(() => cakeIcon(icon, f, { th: theme, locked: !unlocked, font: FONT }));
    });
    bind('shelfCount', `${open} of ${CAKES.length}`);
    bind('lobbyNote', S.stats.cakes
      ? `${S.stats.cakes} cake${S.stats.cakes === 1 ? '' : 's'} baked · ${S.stats.won} level${S.stats.won === 1 ? '' : 's'} cleared`
      : 'Drag plates of cake slices onto the counter. Matching slices fly together into whole cakes.');
    ref('lobby').querySelector('.cs-lobby-note').append(h('span', { class: 'cs-tuned' }, ' Levels adjust to how you play.'));
  }

  /* ---------- input ---------- */
  const pt = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  function hitTray(x, y){
    let best = -1, bd = pr * 1.35;
    trayXs.forEach((tx, i) => { if(!L.tray[i] || inFlight(i)) return; const d = Math.hypot(tx - x, (trayY - y) / .85); if(d < bd){ bd = d; best = i; } });
    return best;
  }
  function hitCell(x, y){
    for(let c = 0; c < CELLS; c++){
      const dx = (x - cellX(c)) / (cw * .5), dy = (y - cellY(c) + pr * .2) / (rp * .5);
      if(Math.abs(dx) <= 1 && Math.abs(dy) <= 1) return c;
    }
    return -1;
  }
  cv.addEventListener('pointerdown', e => {
    if(view !== 'play' || !L || e.button > 0 || L.won) return;
    A.ensure();
    const [x, y] = pt(e);
    if(hammer){
      const c = hitCell(x, y);
      if(c >= 0 && isPlate(L.cells[c])) smash(c);
      return;
    }
    if(busy) return;
    const t = hitTray(x, y);
    if(t >= 0){
      kc = -1;
      drag = { t, x: trayXs[t], y: trayY, sx: x, sy: y, ox: trayXs[t] - x, oy: trayY - y, moved: false, target: -1, wasSel: sel === t };
      sel = -1;
      try{ cv.setPointerCapture(e.pointerId); }catch(err){}
      sfx.pick(); buzz(5); kick();
      return;
    }
    if(sel >= 0){
      const c = hitCell(x, y);
      if(c >= 0 && L.cells[c] === null) putDown(sel, c, trayXs[sel], trayY, cw * .16);
      else { sel = -1; sfx.drop(); }
      kick();
    }
  });
  cv.addEventListener('pointermove', e => {
    if(!drag) return;
    const [x, y] = pt(e);
    if(!drag.moved && Math.hypot(x - drag.sx, y - drag.sy) > 8) drag.moved = true;
    if(!drag.moved) return;
    // the plate rides above the finger so it stays visible
    drag.x = x + drag.ox * .3; drag.y = y - cw * .45 + drag.oy * .3;
    const tg = emptyTarget(drag.x, drag.y + cw * .15);
    if(tg !== drag.target){ drag.target = tg; if(tg >= 0) A.tone({ f: 1200, dur: .03, gain: .025, type: 'triangle' }); }
    kick();
  });
  const endDrag = e => {
    if(!drag) return;
    const d = drag; drag = null;
    try{ cv.releasePointerCapture(e.pointerId); }catch(err){}
    if(!d.moved){ sel = d.wasSel ? -1 : d.t; if(sel >= 0) kc = -1; kick(); return; }   // a tap picks the plate up
    if(d.target >= 0) putDown(d.t, d.target, d.x, d.y, cw * .2);
    else {                                                                              // back to the tray
      movers.push({ t: d.t, x0: d.x, y0: d.y, x1: trayXs[d.t], y1: trayY, lift: cw * .2, t0: now(), dur: 180, done: () => {} });
      sfx.drop();
    }
    kick();
  };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  function onKey(e){
    if(view !== 'play' || !L || e.metaKey || e.ctrlKey || e.altKey || L.won) return;
    if(document.querySelector('#sheet.on')) return;
    const k = e.key.toLowerCase();
    if(k === '1' || k === '2' || k === '3'){
      const t = +k - 1;
      if(L.tray[t] && !busy && !inFlight(t)){ sel = sel === t ? -1 : t; if(sel >= 0){ sfx.pick(); if(kc < 0) kc = L.cells.indexOf(null); } kick(); }
      e.preventDefault(); return;
    }
    if(k.startsWith('arrow')){
      if(kc < 0) kc = 0;
      else {
        const x = kc % COLS, y = (kc / COLS) | 0;
        if(k === 'arrowleft' && x > 0) kc--; if(k === 'arrowright' && x < COLS - 1) kc++;
        if(k === 'arrowup' && y > 0) kc -= COLS; if(k === 'arrowdown' && y < ROWS - 1) kc += COLS;
      }
      kick(); e.preventDefault(); return;
    }
    if((k === 'enter' || k === ' ') && kc >= 0){
      if(hammer){ if(isPlate(L.cells[kc])) smash(kc); }
      else if(sel >= 0 && L.cells[kc] === null) putDown(sel, kc, trayXs[sel], trayY, cw * .16);
      e.preventDefault(); return;
    }
    if(k === 'u') undo(); else if(k === 'h') toggleHammer(); else if(k === 'n') refresh();
    else if(k === 'escape'){ if(hammer) setHammer(false); else if(sel >= 0){ sel = -1; kick(); } }
  }
  document.addEventListener('keydown', onKey);
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if(!b) return;
    const act = b.dataset.act;
    A.ensure();
    api.click();
    switch(act){
      case 'home': api.exit(); break;
      case 'settings': api.ui.openSettings(h('button', { class: 'btn btn-ghost btn-sm btn-wide', style: 'margin-top:12px', onclick: () => { api.click(); howTo(); } }, 'How to play Cake Sort')); break;
      case 'play': startLevel(S.level, false); break;
      case 'lobby': persist(); showView('lobby'); break;
      case 'menu': menu(); break;
      case 'undo': undo(); break;
      case 'hammer': toggleHammer(); break;
      case 'refresh': refresh(); break;
    }
  });
  const ro = new ResizeObserver(() => { if(view === 'play' && L){ layout(); } });
  ro.observe(playEl); ro.observe(field);
  const offTheme = api.on('theme', () => {
    theme = readTheme(el); sprites.clear();
    if(view === 'play' && L){ buildBg(); menuChips(ref('menuRow'), L.flv, shown); kick(); } else renderLobby();
  });
  const offWipe = api.on('wipe', () => { api.exit(); });
  const onVis = () => { if(!document.hidden) kick(); };
  document.addEventListener('visibilitychange', onVis);

  window.__cs = Object.assign(window.__cs || {}, {
    state: () => L && { cells: L.cells.map(p => isPlate(p) ? p.slice() : p), tray: L.tray.map(p => p && p.slice()), baked: L.baked, goal: L.sp.goal },
    level: () => L && L.n, view: () => view, won: () => !!(L && L.won),
    idle: () => !sorting() && !flyers.length && !served.length && !movers.length,
    sorting: () => sorting(),
    canPlace: (t, c) => !!(L && !busy && L.tray[t] && !inFlight(t) && free(c)),
    place: (t, c) => { if(L && !busy && L.tray[t] && !inFlight(t) && free(c)){ putDown(t, c, trayXs[t], trayY, 0); return true; } return false; },
    undo, hammer: c => { if(L && isPlate(L.cells[c])){ smash(c); } }, refresh,
    where: () => ({ tray: trayXs.map(x => [x, trayY]), cells: L ? L.cells.map((_, c) => [cellX(c), cellY(c)]) : [] }),
    save: () => JSON.parse(JSON.stringify({ level: S.level, coins: S.coins, inv: S.inv, stats: S.stats, baked: S.baked })),
    skill: () => Object.assign({ tries: S.tries }, S.skill), heatFor, heat: () => L && L.h,
    setSkill: (mu, sd) => { S.skill = Object.assign(SK.create(SKILL), { mu, sd: sd || S.skill.sd }); api.persist(); },     // dev
    play: n => { if(n){ S.level = Math.max(1, n); S.cur = null; } startLevel(S.level, !!n); }
  });

  showView('lobby');
  return {
    unmount(){
      persist();
      cancelAnimationFrame(raf); raf = 0;
      for(const id of timers) clearTimeout(id);
      ro.disconnect(); offTheme(); offWipe();
      document.removeEventListener('keydown', onKey);
      document.removeEventListener('visibilitychange', onVis);
    }
  };
}

/* ==================== 5. the shelf card ==================== */
function drawCard(box){
  const cv = document.createElement('canvas');
  box.classList.add('cs-card-art');
  box.append(cv);
  requestAnimationFrame(() => {
    const W = box.clientWidth, H = box.clientHeight;
    if(!W || !H) return;
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const th = readTheme(document.documentElement);
    // a strip of tablecloth
    const top = H * .34;
    ctx.fillStyle = th.cloth; ctx.fillRect(0, top, W, H - top);
    ctx.fillStyle = th.check;
    const st = Math.max(8, W / 22);
    for(let x = 0; x < W; x += st * 2) ctx.fillRect(x, top, st, H - top);
    for(let y = top; y < H; y += st * 2) ctx.fillRect(0, y, W, st);
    ctx.fillStyle = 'rgba(0,0,0,.06)'; ctx.fillRect(0, top, W, 3);
    const pr = Math.min(W / 7.4, H / 3.3);
    const plates = [
      [.17, .62, [2, 2, 2, 0]],
      [.5, .74, [0, 0, 0, 0, 0, 0], true],
      [.83, .62, [1, 1, 1, 1, 4]],
    ];
    for(const [fx, fy, fs] of plates){
      const x = W * fx, y = H * fy;
      drawPlate(ctx, x, y, pr, th);
      drawSlices(ctx, x, y, pr * CAKE_R, fs.map((f, i) => [f, slotAngle(i) + (fs.length === 6 ? .25 : 0)]), th);
    }
    // a strawberry slice spinning through the air, with a trail
    const sx = W * .32, sy = H * .3, R = pr * CAKE_R * 1.08;
    ctx.strokeStyle = th.accent; ctx.globalAlpha = .45; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.setLineDash([2, 7]);
    ctx.beginPath(); ctx.moveTo(W * .17 + pr * .5, H * .5); ctx.quadraticCurveTo(W * .2, H * .2, sx - R * .3, sy - R * .2); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(sx + R * .2, sy - R * .3, R * 1.05, Math.PI * 1.05, Math.PI * 1.6); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2; ctx.stroke();
    drawSlices(ctx, sx - R * .35, sy, R, [[2, -2.2]], th);
    // sparkles over the whole cake
    ctx.fillStyle = '#FFD45A';
    for(const [dx, dy, s] of [[.36, .4, 1], [.64, .36, .8], [.57, .26, .55]]){
      const x = W * dx, y = H * dy, r = pr * .14 * s;
      ctx.beginPath();
      for(let k = 0; k < 8; k++){ const rr = k % 2 ? r * .35 : r, a = k * Math.PI / 4; k ? ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.moveTo(x + rr, y); }
      ctx.closePath(); ctx.fill();
    }
  });
}

/* ==================== 6. register ==================== */
window.__cs = Object.assign(window.__cs || {}, { spec, newLevel, place, resolve, probe });
window.Playbox.register({
  id: 'cake-sort',
  title: 'Cake Sort',
  tagline: 'Slide plates together until every slice joins a whole cake.',
  order: 4,
  status: s => s.level > 1 ? `Level ${s.level} · ${(s.stats && s.stats.cakes) || 0} cakes` : 'New · 10 cakes to discover',
  cta: s => s.level > 1 || s.cur ? 'Continue' : 'Play',
  card: drawCard,
  mount
});
})();
</script>
