<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1014">
<title>Apex Basin</title>
<style>
/* ============================================================
   APEX BASIN — 2.5D top-down racing
   Landscape. Auto-throttle, steer left/right, brake.
   ============================================================ */
:root{
  --night:#0b1014;
  --deep:#121b22;
  --panel:#18242c;
  --edge:#273a46;
  --line:#3d5866;
  --ink:#e8f2f5;
  --dim:#8ba3b0;
  --hot:#ff6b35;      /* primary accent, warm against the cool track */
  --cool:#35c8ff;
  --go:#7ddf64;
  --warn:#ffcc44;
  --wet:#4a9fd8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--night);
  color:var(--ink);
  font-family:"DIN Alternate","Bahnschrift","Segoe UI",ui-sans-serif,system-ui,sans-serif;
  font-size:14px;
  overflow:hidden;position:fixed;inset:0;
  touch-action:none;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
#root{position:absolute;inset:0;display:flex;flex-direction:column}
canvas{display:block;width:100%;height:100%}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#0b1014}

/* ---------- rotate gate ---------- */
#rotate{
  position:absolute;inset:0;z-index:99;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:var(--night);text-align:center;padding:24px;
}
#rotate.show{display:flex}
#rotate .ph{
  width:52px;height:86px;border:3px solid var(--hot);border-radius:9px;
  animation:tip 1.8s ease-in-out infinite;
}
@keyframes tip{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}

/* ---------- shared UI ---------- */
.scr{
  position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
  background:linear-gradient(160deg,#0d151b,#0b1014 60%,#10191f);
}
.scr[hidden]{display:none}
.hd{
  display:flex;align-items:center;gap:14px;
  padding:10px 18px;border-bottom:1px solid var(--edge);flex:0 0 auto;
}
.hd h1{
  font-size:19px;letter-spacing:.20em;text-transform:uppercase;font-weight:700;
}
.hd h1 b{color:var(--hot)}
.hd .sub{font-size:10px;letter-spacing:.26em;color:var(--dim);text-transform:uppercase}
.tabs{display:flex;gap:6px;margin-left:auto}
.tab{
  font:inherit;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);background:transparent;border:1px solid var(--edge);
  border-radius:5px;padding:7px 14px;cursor:pointer;
}
.tab.on{color:var(--night);background:var(--hot);border-color:var(--hot);font-weight:700}
.body{flex:1;min-height:0;display:flex;gap:14px;padding:14px 18px;overflow:hidden}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.pane::-webkit-scrollbar{width:5px}
.pane::-webkit-scrollbar-thumb{background:var(--edge);border-radius:3px}
.side{
  flex:0 0 clamp(200px,30%,300px);display:flex;flex-direction:column;gap:10px;
  border-left:1px solid var(--edge);padding-left:14px;overflow-y:auto;
}
.lbl{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}

/* selectable cards */
.card{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  font:inherit;color:var(--ink);
  background:var(--panel);border:1px solid var(--edge);border-left:3px solid transparent;
  border-radius:7px;padding:9px 12px;cursor:pointer;
  transition:border-color .14s,background .14s;
}
.card:hover{background:#1d2c35}
.card.on{border-color:var(--hot);border-left-color:var(--hot);background:#1f2f38}
.card canvas{flex:0 0 62px;width:62px;height:40px}
.card .nm{font-size:14px;font-weight:700;letter-spacing:.04em}
.card .mt{font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.card .gr{flex:1;min-width:0}
.swatch{flex:0 0 26px;height:26px;border-radius:5px;border:1px solid rgba(255,255,255,.25)}

/* stat bars */
.stats{display:flex;flex-direction:column;gap:5px;flex:0 0 108px}
.stat{display:grid;grid-template-columns:42px 1fr;gap:7px;align-items:center}
.stat i{font-style:normal;font-size:8px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.bar{height:5px;border-radius:3px;background:#0d151b;overflow:hidden}
.bar span{display:block;height:100%;background:var(--hot);border-radius:3px}

/* option rows */
.opt{display:flex;flex-direction:column;gap:5px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{
  flex:1;min-width:40px;font:inherit;font-size:11px;font-weight:700;
  color:var(--dim);background:var(--panel);border:1px solid var(--edge);
  border-radius:5px;padding:7px 4px;cursor:pointer;letter-spacing:.06em;
}
.seg button.on{color:var(--night);background:var(--cool);border-color:var(--cool)}
.seg button.on.hot{background:var(--hot);border-color:var(--hot)}
.hint{font-size:10px;line-height:1.45;color:var(--dim)}

.go{
  font:inherit;font-size:15px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;
  color:var(--night);background:var(--hot);border:0;border-radius:7px;
  padding:14px;cursor:pointer;margin-top:auto;
}
.go:hover{background:#ff8455}
.go:disabled{opacity:.4;cursor:default}
.ghost{
  font:inherit;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);background:transparent;border:1px solid var(--edge);
  border-radius:6px;padding:10px;cursor:pointer;
}
.ghost:hover{color:var(--ink);border-color:var(--line)}
button:focus-visible,.card:focus-visible{outline:2px solid var(--cool);outline-offset:2px}

/* ---------- in-race controls ---------- */
#pad{position:absolute;inset:0;z-index:10;pointer-events:none}
.btn{
  position:absolute;bottom:16px;pointer-events:auto;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;border:2px solid rgba(255,255,255,.30);
  background:rgba(12,20,26,.44);backdrop-filter:blur(3px);
  color:#fff;font-size:26px;font-weight:700;
  width:min(17vw,92px);height:min(17vw,92px);
}
.btn.down{background:rgba(255,107,53,.55);border-color:var(--hot)}
#steerZone{
  position:absolute;left:0;top:54px;bottom:0;width:47%;
  pointer-events:auto;touch-action:none;
}
#bBrake{right:16px;font-size:13px;letter-spacing:.14em}
#bBrake.down{background:rgba(255,64,64,.6);border-color:#ff5555}
#bPit{
  position:absolute;right:16px;bottom:calc(28px + min(17vw,92px));pointer-events:auto;
  font:inherit;font-size:11px;font-weight:700;letter-spacing:.14em;
  color:var(--ink);background:rgba(12,20,26,.6);border:1px solid var(--line);
  border-radius:7px;padding:9px 14px;
}
#bPit.armed{background:var(--warn);color:#1a1206;border-color:var(--warn)}
#bMenu{
  position:absolute;left:16px;top:12px;pointer-events:auto;z-index:11;
  font:inherit;font-size:15px;color:var(--ink);
  background:rgba(12,20,26,.6);border:1px solid var(--line);
  border-radius:6px;width:36px;height:30px;cursor:pointer;
}

/* ---------- overlays ---------- */
.ov{
  position:absolute;inset:0;z-index:30;display:flex;
  align-items:center;justify-content:center;padding:18px;
  background:rgba(7,11,14,.86);backdrop-filter:blur(3px);
}
.ov[hidden]{display:none}
.box{
  background:var(--deep);border:1px solid var(--edge);border-radius:10px;
  padding:16px 20px;width:min(560px,94%);max-height:92%;overflow-y:auto;
  display:flex;flex-direction:column;gap:10px;
}
.box h2{font-size:16px;letter-spacing:.2em;text-transform:uppercase}
.box h2 b{color:var(--hot)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{
  text-align:left;font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);font-weight:400;padding:4px 6px;border-bottom:1px solid var(--edge);
}
td{padding:5px 6px;border-bottom:1px solid #1b2a33;font-variant-numeric:tabular-nums}
tr.me td{color:var(--hot);font-weight:700}
td.pos{width:26px;color:var(--dim)}
.row{display:flex;gap:8px}
.row>*{flex:1}
</style>
</head>
<body>

<div id="root">
  <div id="stage">
    <canvas id="cv"></canvas>

    <div id="pad" hidden>
      <div id="steerZone" aria-label="Steering — drag left or right"></div>
      <button class="btn" id="bBrake" aria-label="Brake">BRAKE</button>
      <button id="bPit">PIT</button>
    </div>
    <button id="bMenu" hidden aria-label="Pause">&#9208;</button>

    <!-- ============ SETUP ============ -->
    <div class="scr" id="setup">
      <div class="hd">
        <div>
          <h1>APEX <b>BASIN</b></h1>
          <div class="sub">Grand Prix Prototype</div>
        </div>
        <div class="tabs">
          <button class="tab on" data-tab="track">Track</button>
          <button class="tab"    data-tab="car">Car</button>
          <button class="tab"    data-tab="rules">Rules</button>
        </div>
      </div>
      <div class="body">
        <div class="pane" id="paneTrack"></div>
        <div class="pane" id="paneCar" hidden></div>
        <div class="pane" id="paneRules" hidden></div>
        <div class="side">
          <div class="lbl">Race weekend</div>
          <div id="summary" style="font-size:12px;line-height:1.9"></div>
          <div class="hint" id="tip"></div>
          <button class="go" id="btnQualify">Start Qualifying</button>
        </div>
      </div>
    </div>

    <!-- ============ RESULTS / GRID ============ -->
    <div class="ov" id="results" hidden>
      <div class="box">
        <h2 id="resTitle">Qualifying <b>Result</b></h2>
        <div id="resNote" class="hint"></div>
        <table><thead><tr><th class="pos">#</th><th>Driver</th><th>Car</th><th id="resCol">Best lap</th></tr></thead>
        <tbody id="resBody"></tbody></table>
        <div class="row">
          <button class="ghost" id="btnBackMenu">Menu</button>
          <button class="go" id="btnNext" style="margin:0">Start Race</button>
        </div>
      </div>
    </div>

    <!-- ============ PAUSE ============ -->
    <div class="ov" id="pause" hidden>
      <div class="box" style="width:min(380px,92%)">
        <h2>Paused</h2>
        <button class="go" id="btnResume" style="margin:0">Resume</button>
        <button class="ghost" id="btnSkip">End Session</button>
        <button class="ghost" id="btnQuit">Quit to Menu</button>
      </div>
    </div>
  </div>
</div>

<div id="rotate"><div class="ph"></div><div class="lbl">Rotate your device</div></div>

<script>
(() => {
'use strict';

/* ==========================================================
   0. helpers
   ========================================================== */
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp  = (a,b,t) => a + (b-a)*t;
const rand  = (a,b) => a + Math.random()*(b-a);
const el    = id => document.getElementById(id);

/** Deterministic RNG so a track's shape and an AI's quirks are stable. */
function rng(seed){
  let s = seed >>> 0;
  return () => (s = (s*1664525 + 1013904223) >>> 0) / 4294967296;
}
function fmtTime(t){
  if (!isFinite(t) || t <= 0) return '—';
  const m = Math.floor(t/60), s = t - m*60;
  return m > 0 ? `${m}:${s.toFixed(3).padStart(6,'0')}` : s.toFixed(3);
}
function fmtGap(t){ return t >= 60 ? `+${fmtTime(t)}` : `+${t.toFixed(3)}`; }

/* ==========================================================
   1. content — cars, tracks, tyres, difficulty
   ========================================================== */

/* Stats are 0..1 design values; the physics converts them to real units.
 * They trade against each other deliberately — nothing is strictly best. */
const CARS = [
  { id:'vector', name:'Vector GT',  colour:'#ff6b35', accent:'#ffd0b8',
    top:0.92, accel:0.62, grip:0.70, brake:0.68, wear:0.55,
    blurb:'Balanced. Forgiving under braking.' },
  { id:'kestrel', name:'Kestrel R', colour:'#35c8ff', accent:'#cdf0ff',
    top:1.00, accel:0.55, grip:0.58, brake:0.60, wear:0.72,
    blurb:'Top speed king. Slippery in the corners and hard on rubber.' },
  { id:'brava', name:'Brava LMS',  colour:'#7ddf64', accent:'#dcf7d3',
    top:0.80, accel:0.72, grip:0.92, brake:0.86, wear:0.34,
    blurb:'Glued down and gentle on tyres. Gives away straight-line pace.' },
  { id:'noir', name:'Noir Turbo',  colour:'#c77dff', accent:'#eddcff',
    top:0.96, accel:0.86, grip:0.62, brake:0.58, wear:0.80,
    blurb:'Violent acceleration, weak brakes. Punishes late braking.' },
  { id:'tussock', name:'Tussock 4x', colour:'#ffcc44', accent:'#fff0c2',
    top:0.84, accel:0.66, grip:0.74, brake:0.74, wear:0.44,
    blurb:'All-weather workhorse. Loses least when the track is soaked.' },
];

/* Tracks are control loops in metres; the spline smooths and resamples them.
 * `wetGrip` is how well the surface drains — a track trait, not weather. */
const TRACKS = [
  { id:'basin', name:'Apex Basin', laps:5, width:15, drain:0.60,
    note:'Long back straight into a stop-start final sector.',
    pts:[[0,0],[420,30],[760,180],[900,470],[760,700],[430,760],[120,690],[-160,560],
         [-300,300],[-250,40],[-60,-90]], elev:[0,0,10,22,26,14,6,2,8,6,2] },
  { id:'harbour', name:'Harbour Loop', laps:7, width:12.5, drain:0.35,
    note:'Tight walls, low grip, punishing in the wet.',
    pts:[[0,0],[300,-40],[520,60],[560,260],[420,380],[500,540],[330,650],[60,610],
         [-120,470],[-60,300],[-190,150],[-90,20]], elev:[0,2,4,4,2,6,8,6,3,2,4,1] },
  { id:'highland', name:'Highland Pass', laps:4, width:16, drain:0.75,
    note:'Big elevation and fourth-gear sweepers. Rewards commitment.',
    pts:[[0,0],[520,80],[940,260],[1120,620],[900,900],[460,980],[40,860],[-260,600],
         [-340,260],[-140,40]], elev:[0,14,36,58,64,46,22,10,4,0] },
  { id:'neon', name:'Neon Mile', laps:9, width:11, drain:0.25,
    note:'Short street lap. Traffic is the real opponent.',
    pts:[[0,0],[260,0],[380,120],[360,300],[200,380],[0,360],[-140,250],[-160,100]],
    elev:[0,0,3,5,4,2,1,0] },
  { id:'storm', name:'Storm Basin', laps:6, width:17, drain:0.85,
    note:'Wide, fast, exposed. Weather arrives without warning.',
    pts:[[0,0],[600,-60],[1050,140],[1200,520],[1000,860],[560,960],[120,880],[-240,640],
         [-380,300],[-200,20]], elev:[0,4,10,18,20,12,8,6,2,0] },
];

/* Compound model. `peak` is dry grip, `opt` the wetness each compound wants,
 * `band` how tolerant it is either side of that, `wear` the base burn rate. */
const TYRES = {
  soft:  { name:'Soft',  short:'S', colour:'#ff4d4d', peak:1.06, opt:0.00, band:0.22, wear:1.55 },
  med:   { name:'Medium',short:'M', colour:'#ffcc44', peak:1.00, opt:0.00, band:0.26, wear:1.00 },
  hard:  { name:'Hard',  short:'H', colour:'#e8f2f5', peak:0.94, opt:0.00, band:0.30, wear:0.68 },
  inter: { name:'Inter', short:'I', colour:'#7ddf64', peak:0.88, opt:0.45, band:0.34, wear:1.15 },
  wet:   { name:'Wet',   short:'W', colour:'#4a9fd8', peak:0.82, opt:0.85, band:0.40, wear:1.30 },
};
const DRY_COMPOUNDS = ['soft','med','hard'];

const DIFFS = [
  { id:'rookie', name:'Rookie',   pace:0.855, err:0.055, react:0.55 },
  { id:'pro',    name:'Pro',      pace:0.905, err:0.030, react:0.75 },
  { id:'ace',    name:'Ace',      pace:0.950, err:0.015, react:0.90 },
  { id:'legend', name:'Legend',   pace:0.990, err:0.005, react:1.00 },
];

const WEATHERS = [
  { id:'dry',     name:'Dry',     hint:'Clear all session.' },
  { id:'wet',     name:'Wet',     hint:'Standing water from lights out. Start on wets.' },
  { id:'dynamic', name:'Dynamic', hint:'Fronts roll in unannounced. Watch the radar and call your stop.' },
];

const AI_NAMES = ['VOSS','RENNIE','OKADA','MARCH','DELACROIX','HOLT','BASRI','KOVAC',
                  'ELLIS','NAKAMURA','SERRA','WYLDE','PRYCE','ADEBAYO','LINDQVIST'];

/* ==========================================================
   2. track building
   ========================================================== */
const SEG_LEN = 7;          // metres between resampled centreline points

function catmull(p0,p1,p2,p3,t){
  const t2=t*t, t3=t2*t;
  return 0.5*((2*p1) + (-p0+p2)*t + (2*p0-5*p1+4*p2-p3)*t2 + (-p0+3*p1-3*p2+p3)*t3);
}

/** Control loop -> dense, evenly spaced centreline with headings, curvature,
 *  elevation and a racing line. Everything downstream indexes into this. */
function buildTrack(def){
  const cp = def.pts, n = cp.length, ev = def.elev || cp.map(()=>0);
  const dense = [];
  for (let i=0;i<n;i++){
    const p0=cp[(i-1+n)%n], p1=cp[i], p2=cp[(i+1)%n], p3=cp[(i+2)%n];
    const e0=ev[(i-1+n)%n], e1=ev[i], e2=ev[(i+1)%n], e3=ev[(i+2)%n];
    for (let s=0;s<24;s++){
      const t=s/24;
      dense.push({
        x: catmull(p0[0],p1[0],p2[0],p3[0],t),
        z: catmull(p0[1],p1[1],p2[1],p3[1],t),
        y: catmull(e0,e1,e2,e3,t),
      });
    }
  }
  // resample at a constant arc length so segment index ~ distance
  const pts=[]; let acc=0, cur={...dense[0]};
  pts.push({...cur});
  for (let i=1;i<=dense.length;i++){
    const nx = dense[i % dense.length];
    let dx=nx.x-cur.x, dz=nx.z-cur.z, d=Math.hypot(dx,dz);
    while (acc + d >= SEG_LEN){
      const need=(SEG_LEN-acc)/d;
      cur = { x:cur.x+dx*need, z:cur.z+dz*need, y:lerp(cur.y,nx.y,need) };
      pts.push({...cur});
      dx=nx.x-cur.x; dz=nx.z-cur.z; d=Math.hypot(dx,dz); acc=0;
    }
    acc+=d; cur={...nx};
  }
  pts.pop();                                   // closing point duplicates the first
  const N = pts.length;

  for (let i=0;i<N;i++){
    const a=pts[(i-1+N)%N], b=pts[i], c=pts[(i+1)%N];
    b.head = Math.atan2(c.x-a.x, c.z-a.z);     // heading: 0 = +z
    b.dist = i*SEG_LEN;
  }
  // signed curvature from heading change
  for (let i=0;i<N;i++){
    let d = pts[(i+1)%N].head - pts[i].head;
    while (d >  Math.PI) d -= TAU;
    while (d < -Math.PI) d += TAU;
    pts[i].curv = d / SEG_LEN;
  }
  // smooth curvature, then derive a racing line: out-in-out, apex on the inside
  const sm = new Float32Array(N);
  for (let i=0;i<N;i++){
    let s=0; for (let k=-6;k<=6;k++) s += pts[(i+k+N)%N].curv;
    sm[i]=s/13;
  }
  for (let i=0;i<N;i++) pts[i].curvS = sm[i];
  const line = new Float32Array(N);
  for (let i=0;i<N;i++) line[i] = clamp(-sm[i]*240, -0.72, 0.72);
  for (let pass=0; pass<26; pass++){          // relax so the line actually flows
    const cp2 = Float32Array.from(line);
    for (let i=0;i<N;i++)
      line[i] = cp2[i]*0.42 + (cp2[(i-1+N)%N] + cp2[(i+1)%N])*0.29;
  }
  for (let i=0;i<N;i++){
    pts[i].line = line[i];
    // a corner's grip ceiling, used by the AI and by the speed hint
    pts[i].vmax = Math.sqrt(9.0 / Math.max(Math.abs(sm[i]), 1e-4));
  }
  return {
    def, pts, N, length:N*SEG_LEN, width:def.width, drain:def.drain,
    // start/finish sits at index 0; the pit lane runs alongside it
    pitIn: Math.floor(N*0.93), pitOut: Math.floor(N*0.06),
  };
}
const TRACK_CACHE = {};
const getTrack = id => TRACK_CACHE[id] || (TRACK_CACHE[id] = buildTrack(TRACKS.find(t=>t.id===id)));

/** Walk from a hint index to the nearest centreline point, then project onto
 *  that span. Returns distance along the lap and normalised lateral offset. */
function locate(tr, x, z, hint){
  const N = tr.N;
  let best = hint|0, bd = Infinity;
  for (let k=-28;k<=28;k++){
    const i=(hint+k+N*2)%N, p=tr.pts[i];
    const d=(p.x-x)**2 + (p.z-z)**2;
    if (d<bd){bd=d; best=i;}
  }
  const p=tr.pts[best], q=tr.pts[(best+1)%N];
  const sx=q.x-p.x, sz=q.z-p.z, L2=sx*sx+sz*sz;
  const t = clamp(((x-p.x)*sx + (z-p.z)*sz)/L2, 0, 1);
  const cxp=p.x+sx*t, czp=p.z+sz*t;
  const h = lerpAngle(p.head, q.head, t);
  // right-hand normal of the heading
  const nx=Math.cos(h), nz=-Math.sin(h);
  const u = ((x-cxp)*nx + (z-czp)*nz) / (tr.width*0.5);
  return { idx:best, t, dist:(best+t)*SEG_LEN, u, head:h,
           y:lerp(p.y,q.y,t), line:lerp(p.line,tr.pts[(best+1)%N].line,t) };
}
function lerpAngle(a,b,t){
  let d=b-a; while(d>Math.PI)d-=TAU; while(d<-Math.PI)d+=TAU;
  return a+d*t;
}

/* ==========================================================
   3. weather
   ========================================================== */
/** Rain is a list of fronts on a timeline. Track wetness lags the rain — water
 *  builds while it falls and drains afterwards at a rate the circuit defines.
 *  The radar HUD reads straight off this schedule, so what the player is shown
 *  is exactly what will happen. */
function makeWeather(mode, seed, duration){
  const R = rng(seed);
  const w = { mode, fronts:[], rain:0, wetness:0, t:0 };
  if (mode === 'wet'){
    w.wetness = 0.82;
    w.fronts.push({ at:-60, peak:0.55, ramp:40, hold:duration+200, fade:120 });
  } else if (mode === 'dynamic'){
    let t = 40 + R()*70;
    while (t < duration){
      const peak = 0.3 + R()*0.7;
      const hold = 45 + R()*110;
      w.fronts.push({ at:t, peak, ramp:22+R()*28, hold, fade:35+R()*50 });
      t += hold + 90 + R()*190;
    }
  }
  return w;
}
/** Rain intensity a given number of seconds from now — the radar's data source. */
function rainAt(w, t){
  let r = 0;
  for (const f of w.fronts){
    const d = t - f.at;
    if (d < 0 || d > f.ramp + f.hold + f.fade) continue;
    let v;
    if (d < f.ramp) v = d/f.ramp;
    else if (d < f.ramp + f.hold) v = 1;
    else v = 1 - (d - f.ramp - f.hold)/f.fade;
    r = Math.max(r, f.peak * clamp(v,0,1));
  }
  return r;
}
function stepWeather(w, tr, dt){
  w.t += dt;
  w.rain = rainAt(w, w.t);
  // water builds fast, drains slowly, and drains slower on a poor circuit
  const target = w.rain;
  const rate = target > w.wetness ? 0.085 : 0.020 * (0.4 + tr.drain);
  w.wetness += clamp(target - w.wetness, -rate*dt, rate*dt);
  w.wetness = clamp(w.wetness, 0, 1);
}
/** Which compound the conditions actually want. */
function idealCompound(wetness){
  if (wetness > 0.62) return 'wet';
  if (wetness > 0.24) return 'inter';
  return 'med';
}

/* ==========================================================
   4. tyres
   ========================================================== */
/** Grip multiplier for a compound given track wetness and how worn it is.
 *  A slick in standing water falls off a cliff; a wet in the dry overheats. */
function tyreGrip(compound, wetness, wear){
  const T = TYRES[compound];
  const off = Math.abs(wetness - T.opt);
  let m = T.peak * Math.exp(-(off*off)/(2*T.band*T.band));
  if (compound === 'wet' || compound === 'inter'){
    // rain tyres are merely slow in the dry, not lethal
    m = Math.max(m, T.peak * (compound === 'wet' ? 0.56 : 0.68));
  } else {
    // slicks aquaplane: hard floor under real water
    m *= (1 - wetness*0.82);
  }
  // wear: gentle to 70%, then the cliff
  const w = clamp(wear,0,1);
  const fall = w < 0.70 ? w*0.16 : 0.112 + (w-0.70)*1.30;
  return Math.max(0.18, m * (1 - fall));
}
function tyreWearRate(compound, carWear, latG, wetness, speed){
  const T = TYRES[compound];
  let r = T.wear * (0.45 + carWear*0.85);
  r *= 0.55 + Math.abs(latG)*0.55 + speed*0.006;
  // running a rain tyre on a drying track destroys it
  if ((compound==='wet' || compound==='inter') && wetness < T.opt - 0.28) r *= 2.6;
  return r * 0.0045;   // ~3 laps on a medium, ~2 on a soft, ~6 on a hard
}

/* ==========================================================
   5. surface — the wet line / dry line mechanic
   ========================================================== */
/** Grip multiplier for a point on the track, by lateral position.
 *
 *  Dry: the racing line is rubbered in and grippier than the marbles offline.
 *  Wet: that same rubber is polished and sheds water badly, so the fast line
 *  becomes the SLOW line and the way round is to run wide of it — which is the
 *  actual technique real drivers use in the rain.
 */
function surfaceGrip(tr, u, lineU, wetness){
  const off = Math.abs(u) > 1 ? 1 : 0;                 // off track entirely
  if (off) return 0.42 - wetness*0.12;                 // grass / run-off
  const d = clamp(Math.abs(u - lineU), 0, 2) / 2;      // 0 = on the line
  const onLine = 1 - d;
  const dry = 1 + onLine*0.085;                        // rubber bonus
  const wet = 1 - onLine*0.30;                         // polished + standing water
  let g = lerp(dry, wet, clamp(wetness*1.25,0,1));
  if (Math.abs(u) > 0.86) g *= 1 - (Math.abs(u)-0.86)*1.1;   // dusty edges
  return g;
}
/** How much standing water sits at this lateral position — drives the visuals. */
function waterAt(u, lineU, wetness){
  if (wetness < 0.05) return 0;
  const d = clamp(Math.abs(u - lineU), 0, 2) / 2;
  return wetness * (0.45 + (1-d)*0.55);
}

/* ==========================================================
   6. cars
   ========================================================== */
const G_LAT = 11.5;      // lateral acceleration at grip 1.0
const OVERDRIVE = 1.35;  // how far past the grip limit full lock may ask
const SCRUB = 3.2;       // m/s2 of speed loss at full understeer (braking is ~18)

function makeCar(spec, opts){
  return {
    spec, name:opts.name, isPlayer:!!opts.isPlayer, ai:opts.ai||null,
    x:0, z:0, y:0, head:0, speed:0,
    idx:0, dist:0, u:0, lineU:0, lap:0, lapDist:0,
    tyre:opts.tyre||'med', wear:0, tyreLaps:0,
    lapStart:0, best:Infinity, last:0, laps:[],
    pitArmed:false, inPit:false, pitTimer:0, pitStops:0, pitLane:0, pitTo:null,
    lapValid:false,
    finished:false, finishT:0, raceDist:0,
    steer:0, brake:0, latG:0, slip:0, offTrack:0, spin:0,
    gridPos:0, pos:0, gap:0,
  };
}
function placeOnTrack(tr, car, idx, u){
  const p = tr.pts[idx % tr.N];
  const nx=Math.cos(p.head), nz=-Math.sin(p.head);
  car.idx=idx % tr.N;
  car.x = p.x + nx*u*tr.width*0.5;
  car.z = p.z + nz*u*tr.width*0.5;
  car.y = p.y; car.head = p.head; car.u = u;
  car.dist = car.idx*SEG_LEN; car.lapDist = car.dist;
}

/* physical numbers derived from the 0..1 design stats */
const topSpeed  = s => 42 + s.top*36;        // m/s  (~151-281 km/h)
const accelRate = s => 4.2 + s.accel*7.0;
const brakeRate = s => 9.0 + s.brake*13.0;
const gripBase  = s => 0.74 + s.grip*0.40;
const steerRate = s => 1.35 + s.grip*0.35;

function stepCar(S, car, dt){
  const tr = S.track;
  if (car.finished && !car.isPlayer) { car.speed *= 0.985; }

  const loc = locate(tr, car.x, car.z, car.idx);
  car.idx = loc.idx; car.u = loc.u; car.lineU = loc.line;

  // ---- pit lane: a parallel corridor beside the main straight ----
  if (car.inPit){
    stepPit(S, car, dt, loc);
    return;
  }

  const wet = S.weather.wetness;
  const surf = surfaceGrip(tr, loc.u, loc.line, wet);
  const grip = gripBase(car.spec) * tyreGrip(car.tyre, wet, car.wear) * surf;

  // ---- driver input ----
  let steer = 0, brake = 0, throttle = 1;
  if (car.isPlayer){ steer = S.input.steer; brake = S.input.brake ? 1 : 0; }
  else { const a = aiDrive(S, car, loc, grip); steer = a.steer; brake = a.brake; throttle = a.throttle; }

  // pit lane speed limiter
  const limited = car.pitLane > 0;

  // ---- longitudinal ----
  const vmax = topSpeed(car.spec) * (limited ? 0.25 : 1) * (0.80 + grip*0.20);
  let a;
  if (brake > 0) a = -brakeRate(car.spec) * Math.min(1.25, grip) * brake;
  else a = accelRate(car.spec) * throttle * (1 - car.speed/Math.max(vmax,1)) * (0.55 + grip*0.45);
  car.speed = Math.max(0, car.speed + a*dt);

  // ---- cornering, limited by grip ----
  // Full lock asks for a yaw rate scaled to what the tyres can actually hold at
  // this speed, overdriven by a fixed margin. The old model let full lock demand
  // 78 m/s2 of grip at 70 m/s against 11.7 available, and charged the difference
  // as speed loss — 51 m/s2, nearly three times full braking. A single corrective
  // flick felt like standing on the brake pedal.
  //
  // Arriving too fast is still punished, but geometrically: the achievable yaw
  // rate falls as speed rises, so the car simply cannot turn tightly enough and
  // runs wide. That is the real penalty. The scrub is now a hint, not a wall.
  const maxLat  = grip * G_LAT;
  const gripYaw = maxLat / Math.max(car.speed, 6);     // yaw the tyres can hold
  const maxYaw  = Math.min(steerRate(car.spec) * 1.7, gripYaw * OVERDRIVE);
  const want    = steer * maxYaw;
  const needLat = Math.abs(want) * car.speed;
  let yaw = want;
  if (needLat > maxLat && car.speed > 2){
    yaw = Math.sign(want) * maxLat / car.speed;        // understeer: it runs wide
    const over = clamp((needLat - maxLat) / maxLat, 0, 1.2);
    car.speed -= Math.min(car.speed, over * SCRUB * dt);
    car.slip = Math.min(1, car.slip + over*dt*2.2);
  } else {
    car.slip = Math.max(0, car.slip - dt*1.6);
  }
  car.head += yaw * dt;
  car.latG = yaw * car.speed;

  // ---- integrate ----
  car.x += Math.sin(car.head) * car.speed * dt;
  car.z += Math.cos(car.head) * car.speed * dt;
  car.y = loc.y;
  car.offTrack = Math.abs(loc.u) > 1 ? Math.min(1, car.offTrack + dt*3) : Math.max(0, car.offTrack - dt*2);

  // a spin off the circuit costs real time
  if (Math.abs(loc.u) > 1.7){
    car.speed *= 1 - dt*1.6;
    const back = Math.sign(-loc.u);
    car.head = lerpAngle(car.head, loc.head + back*0.55, dt*1.4);
  }

  // ---- tyres ----
  if (S.phase !== 'grid'){
    car.wear = Math.min(1.15, car.wear +
      tyreWearRate(car.tyre, car.spec.wear, car.latG/G_LAT, wet, car.speed) * dt);
  }
  car.brake = brake;

  advanceLap(S, car, loc);
}

/** Pit lane is modelled as an offset corridor: the car is pulled to the side of
 *  the track, held at the box, then released. Simple, and it reads clearly. */
function stepPit(S, car, dt, loc){
  const tr = S.track;
  const PIT_SPEED = 22;
  const boxIdx = Math.floor(tr.N * 0.035);        // just past the line
  car.pitLane = Math.min(1, car.pitLane + dt*2);

  const serviced = car.pitDone && car.pitTimer <= 0;
  const targetU = serviced ? 0 : 1.25;            // lane, then back to the racing surface

  // aim SEVERAL SEGMENTS AHEAD — aiming at its own segment makes a car circle
  const tp = tr.pts[(car.idx + 3) % tr.N];
  const nx = Math.cos(tp.head), nz = -Math.sin(tp.head);
  const tx = tp.x + nx*targetU*tr.width*0.5;
  const tz = tp.z + nz*targetU*tr.width*0.5;
  car.head = lerpAngle(car.head, Math.atan2(tx-car.x, tz-car.z), clamp(dt*4,0,1));

  const toBox = ((boxIdx - car.idx) + tr.N) % tr.N;
  if (car.pitTimer > 0){
    car.pitTimer -= dt;
    car.speed = Math.max(0, car.speed - 40*dt);
    if (car.pitTimer <= 0){
      car.tyre = car.pitTo || car.tyre; car.wear = 0; car.tyreLaps = 0; car.pitStops++;
      if (car.isPlayer) S.toast = { t:2.2, msg:`${TYRES[car.tyre].name} fitted` };
    }
  } else if (!car.pitDone && (toBox < 3 || toBox > tr.N*0.6)){
    car.pitDone = true;
    car.pitTimer = 2.4 + Math.random()*0.8;
  } else {
    car.speed = Math.min(car.speed + 9*dt, PIT_SPEED);
  }

  car.x += Math.sin(car.head)*car.speed*dt;
  car.z += Math.cos(car.head)*car.speed*dt;
  car.y = tr.pts[car.idx].y;

  advanceLap(S, car, loc);

  if (serviced && Math.abs(loc.u) < 0.55){
    car.inPit = false; car.pitDone = false; car.pitLane = 0;
    car.pitArmed = false; car.pitTo = null;
  }
}

function advanceLap(S, car, loc){
  const tr = S.track;
  const prev = car.lapDist;
  car.lapDist = loc.dist;
  // crossing the line: distance wraps from near the full lap back to near zero
  if (prev > tr.length*0.75 && car.lapDist < tr.length*0.25){
    const t = S.clock;
    if (car.lapValid && car.lapStart > 0){
      const lt = t - car.lapStart;
      if (lt > 5){
        car.last = lt; car.laps.push(lt);
        if (lt < car.best) car.best = lt;
      }
    }
    car.lapValid = true;          // the grid/out lap is a partial, never a lap time
    car.lapStart = t; car.lap++; car.tyreLaps++;
    car.offLapPenalty = false;

    if (S.phase === 'race'){
      if (car.lap > S.laps && !car.finished){
        car.finished = true; car.finishT = t;
        if (car.isPlayer) S.playerDone = true;
      }
      // arm the stop for the coming lap
      if (car.pitArmed && !car.inPit && !car.finished){
        car.inPit = true; car.pitDone = false;
        car.pitTo = car.pitTo || idealCompound(S.weather.wetness);
      }
    }
  }
  car.raceDist = car.lap*tr.length + car.lapDist;
}

/* ==========================================================
   7. AI
   ========================================================== */
/** Aim at a point down the racing line, brake for what is coming, and in the
 *  wet move off the rubbered line — the same call the player has to make. */
function aiDrive(S, car, loc, grip){
  const tr = S.track, ai = car.ai, wet = S.weather.wetness;
  const look = clamp(6 + car.speed*0.45, 8, 40) / SEG_LEN;
  const ti = Math.floor(car.idx + look) % tr.N;
  const tp = tr.pts[ti];

  // target lateral: the racing line, pushed off it when the line is wet
  let targetU = tp.line * ai.lineBias;
  if (wet > 0.25){
    const away = Math.sign(tp.line || 1) * -1;
    targetU = lerp(targetU, clamp(tp.line + away*0.55, -0.9, 0.9), clamp((wet-0.25)*1.6,0,1));
  }
  targetU += ai.wander * Math.sin(S.clock*0.6 + ai.phase);

  const nx=Math.cos(tp.head), nz=-Math.sin(tp.head);
  const tx = tp.x + nx*targetU*tr.width*0.5;
  const tz = tp.z + nz*targetU*tr.width*0.5;

  let want = Math.atan2(tx-car.x, tz-car.z) - car.head;
  while (want> Math.PI) want-=TAU; while (want<-Math.PI) want+=TAU;

  // Convert the heading error into a yaw RATE, then into lock as a fraction of
  // what this car can actually turn at this speed. A fixed steering gain cannot
  // work: available yaw falls as speed rises, so one gain is twitchy in a hairpin
  // and far too lazy on a fast sweeper.
  const lookM  = clamp(6 + car.speed*0.45, 8, 40);
  const wantYaw = want * car.speed / Math.max(lookM, 6);
  const aiMaxYaw = Math.min(steerRate(car.spec)*1.7,
                            (grip*G_LAT)/Math.max(car.speed,6) * OVERDRIVE);
  const steer = clamp(wantYaw / Math.max(aiMaxYaw, 1e-3), -1, 1);

  // Corner speed: scan far enough ahead to actually stop for the slowest thing
  // coming. Braking from top speed to a hairpin needs ~140 m, so a short scan
  // means the car only reacts once it is already too late.
  let need = Infinity;
  const BRAKE_MARGIN = 0.75;        // assume less than perfect braking, so commit early
  for (let k=2;k<46;k++){
    const p = tr.pts[(car.idx+k)%tr.N];
    const d = k*SEG_LEN;
    const v = p.vmax * Math.sqrt(Math.max(grip,0.15)) * ai.pace;
    // v² = u² + 2as  ->  the entry speed that still makes that corner
    const allowed = Math.sqrt(Math.max(0, v*v + 2*brakeRate(car.spec)*grip*BRAKE_MARGIN*d));
    need = Math.min(need, allowed);
  }
  const cap = Math.min(need, topSpeed(car.spec)*ai.pace);

  // traffic: lift if there is a car right in front
  let block = 0;
  for (const o of S.cars){
    if (o === car || o.inPit) continue;
    let d = o.raceDist - car.raceDist;
    if (d > 0 && d < 26 && Math.abs(o.u - car.u) < 0.55) block = Math.max(block, 1 - d/26);
  }

  let brake = 0, throttle = 1;
  if (car.speed > cap) brake = clamp((car.speed-cap)/5, 0, 1);
  else if (car.speed > cap*0.94) throttle = 0.40;
  if (block > 0.55) { brake = Math.max(brake, block*0.55); }

  return { steer, brake, throttle };
}

/** AI pit logic: swap when the tyre is wrong for the weather, or worn out. */
function aiPitCheck(S, car){
  if (car.inPit || car.finished || S.phase !== 'race') return;
  if (!S.rules.degrade && S.rules.weather === 'dry') return;
  const wet = S.weather.wetness;
  const want = idealCompound(wet);
  const lapsLeft = S.laps - car.lap + 1;
  if (lapsLeft < 1) return;

  let need = false;
  const isRain = car.tyre==='wet' || car.tyre==='inter';
  const wantRain = want==='wet' || want==='inter';
  if (isRain !== wantRain) need = true;                       // crossover moment
  else if (isRain && want !== car.tyre && Math.abs(wet - TYRES[car.tyre].opt) > 0.3) need = true;
  else if (S.rules.degrade && car.wear > 0.74 && lapsLeft > 1) need = true;

  if (need && !car.pitArmed){
    // look at the forecast so nobody stops for rain that is about to stop
    const soon = rainAt(S.weather, S.weather.t + 45);
    if (wantRain && soon < 0.12 && wet < 0.45) return;
    car.pitArmed = true;
    car.pitTo = S.rules.degrade || wantRain ? want : car.tyre;
    if (!wantRain) car.pitTo = car.ai.preferred;
  }
}

/* ==========================================================
   8. session
   ========================================================== */
const S = {
  mode:'setup', phase:'none', track:null, cars:[], player:null,
  weather:null, rules:null, clock:0, timeLeft:0, laps:5,
  input:{ steer:0, target:0, brake:false, active:false, originX:0, originY:0 },
  cam:{ x:0, z:0, y:0, yaw:0, spd:0 }, stageLeft:0, stageTop:0,
  toast:null, playerDone:false, paused:false, W:0, H:0, dpr:1,
  results:null, spray:[], drops:[],
};

const setup = {
  track:'basin', car:'vector', diff:'pro',
  rivals:7, laps:5, degrade:true, weather:'dynamic', quali:300,
};

function startSession(phase){
  const tr = getTrack(setup.track);
  S.track = tr; S.phase = phase; S.mode='race'; S.clock = 0; S.paused=false;
  S.playerDone = false; S.toast=null; S.spray.length=0;
  S.rules = { ...setup };
  S.laps = setup.laps;
  const dur = phase==='quali' ? setup.quali : setup.laps * 75;
  S.weather = makeWeather(setup.weather, hash(setup.track)+ (phase==='race'?77:0), dur);
  // give the race its own weather but keep the qualifying trend visible
  S.timeLeft = phase==='quali' ? setup.quali : 0;

  const diff = DIFFS.find(d=>d.id===setup.diff);
  const startWet = S.weather.wetness;
  const startTyre = setup.weather==='dry' ? 'med' : idealCompound(startWet);

  S.cars = [];
  const playerSpec = CARS.find(c=>c.id===setup.car);
  const player = makeCar(playerSpec, { name:'YOU', isPlayer:true, tyre:startTyre });
  S.cars.push(player); S.player = player;

  const R = rng(hash(setup.track)*7 + setup.rivals);
  for (let i=0;i<setup.rivals;i++){
    const spec = CARS[(i*3+1) % CARS.length];
    const skill = 1 - (i/Math.max(setup.rivals,1))*0.09;     // a spread down the field
    S.cars.push(makeCar(spec, {
      name: AI_NAMES[i % AI_NAMES.length],
      tyre: startTyre,
      ai: {
        pace: diff.pace * skill * (0.985 + R()*0.03),
        err: diff.err, react: diff.react,
        lineBias: 0.88 + R()*0.22,
        wander: diff.err * (0.6 + R()*0.8),
        phase: R()*TAU,
        preferred: DRY_COMPOUNDS[(i + (R()*3|0)) % 3],
      },
    }));
  }

  if (phase === 'quali'){
    // spread them around the lap so nobody is stuck in a train
    S.cars.forEach((c,i)=>{
      placeOnTrack(tr, c, Math.floor(i*tr.N/S.cars.length), c.isPlayer?0:(i%2?0.3:-0.3));
      c.lapStart = 0; c.speed = 30; c.lapValid = false;
    });
  } else {
    const grid = S.results ? S.results.map(r=>r.car) : S.cars.slice();
    grid.forEach((c,i)=>{
      const row = Math.floor(i/2), side = i%2 ? 0.42 : -0.42;
      placeOnTrack(tr, c, (tr.N - 14 - row*4) % tr.N, side);
      c.speed = 0; c.lap = 0; c.lapStart = 0; c.lapDist = c.dist;
      c.best = Infinity; c.laps = []; c.finished=false; c.gridPos=i+1; c.lapValid=false;
      c.wear = 0; c.pitStops = 0; c.raceDist = 0;
    });
    S.phase = 'grid'; S.lights = 3.6;
  }
  syncCamera(true);
  el('setup').hidden = true; el('pad').hidden = false; el('bMenu').hidden = false;
  updatePitButton();
}
function hash(s){ let h=2166136261; for(const c of s) h=(h^c.charCodeAt(0))*16777619; return h>>>0; }

function orderCars(){
  const list = S.cars.slice();
  if (S.phase === 'quali'){
    list.sort((a,b)=> (a.best||Infinity) - (b.best||Infinity));
  } else {
    list.sort((a,b)=>{
      if (a.finished !== b.finished) return a.finished ? -1 : 1;
      if (a.finished && b.finished) return a.finishT - b.finishT;
      return b.raceDist - a.raceDist;
    });
  }
  list.forEach((c,i)=> c.pos = i+1);
  return list;
}

function endSession(){
  const order = orderCars();
  S.results = order.map(c => ({
    car:c, name:c.name, spec:c.spec,
    best:c.best, time:c.finishT, laps:c.lap, stops:c.pitStops,
  }));
  const quali = S.phase === 'quali';
  el('resTitle').innerHTML = quali ? 'Qualifying <b>Result</b>' : 'Race <b>Result</b>';
  el('resCol').textContent = quali ? 'Best lap' : 'Gap';
  const me = order.indexOf(S.player)+1;
  el('resNote').textContent = quali
    ? `You start P${me} of ${order.length} on ${TYRES[S.player.tyre].name.toLowerCase()}s.`
    : `P${me} of ${order.length} · ${S.player.pitStops} stop${S.player.pitStops===1?'':'s'} · best ${fmtTime(S.player.best)}`;
  const lead = order[0];
  el('resBody').innerHTML = order.map((c,i)=>{
    let col;
    if (quali) col = fmtTime(c.best);
    else if (c === lead) col = c.finished ? fmtTime(c.finishT) : 'DNF';
    else if (c.finished) col = fmtGap(c.finishT - lead.finishT);
    else col = `+${Math.max(1,Math.floor((lead.raceDist-c.raceDist)/S.track.length)+1)} lap`;
    return `<tr class="${c.isPlayer?'me':''}"><td class="pos">${i+1}</td><td>${c.name}</td>
      <td style="color:${c.spec.colour}">${c.spec.name}</td><td>${col}</td></tr>`;
  }).join('');
  el('btnNext').textContent = quali ? 'Start Race' : 'Race Again';
  el('results').hidden = false;
  el('pad').hidden = true; el('bMenu').hidden = true;
  S.mode = 'results';
}

/* ==========================================================
   9. projection — the 2.5D camera
   ========================================================== */
/* A camera above and behind the car, PITCHED DOWN at the track. The pitch is
 * what makes this top-down rather than a chase cam, and the perspective divide
 * is what keeps it 2.5D rather than flat: the tarmac under the nose is huge and
 * the corner 200 m away is a sliver, on one continuous surface.
 *
 * Without pitch the camera stares at the horizon and everything beneath it —
 * including the player's own car — projects off the bottom of the screen. */
const CAM = { back: 13, height: 9, pitch: 0.454, focal: 0.55, near: 1.6 };
const horizonY = () => S.H*0.5 - (S.W*CAM.focal)*Math.tan(CAM.pitch);

function syncCamera(snap){
  const c = S.player;
  const targetYaw = c.head;
  const tx = c.x - Math.sin(targetYaw)*CAM.back;
  const tz = c.z - Math.cos(targetYaw)*CAM.back;
  const k = snap ? 1 : 0.12;
  S.cam.x = lerp(S.cam.x, tx, k);
  S.cam.z = lerp(S.cam.z, tz, k);
  S.cam.y = lerp(S.cam.y, c.y + CAM.height, snap?1:0.08);
  S.cam.yaw = snap ? targetYaw : lerpAngle(S.cam.yaw, targetYaw, 0.10);
  S.cam.spd = lerp(S.cam.spd, c.speed, 0.1);
}
function project(x, y, z){
  const dx = x - S.cam.x, dz = z - S.cam.z, dy = y - S.cam.y;
  const s = Math.sin(S.cam.yaw), c = Math.cos(S.cam.yaw);
  const fwd = dx*s + dz*c;                    // along the camera's look axis
  const rx  = dx*c - dz*s;                    // to its right
  const cp = Math.cos(CAM.pitch), sp = Math.sin(CAM.pitch);
  const Y =  dy*cp + fwd*sp;                  // rotate the world up by the pitch
  const Z = fwd*cp - dy*sp;
  if (Z < CAM.near) return null;
  const f = (S.W * CAM.focal) / Z;
  return { sx: S.W*0.5 + rx*f, sy: S.H*0.5 - Y*f, sc: f, rz: Z };
}

/* ==========================================================
   10. render
   ========================================================== */
const cv = el('cv'), ctx = cv.getContext('2d', { alpha:false });

function resize(){
  const st = el('stage').getBoundingClientRect();
  S.dpr = Math.min(devicePixelRatio||1, 2);
  S.W = st.width; S.H = st.height;
  S.stageLeft = st.left; S.stageTop = st.top;
  cv.width = Math.max(1, Math.round(S.W*S.dpr));
  cv.height = Math.max(1, Math.round(S.H*S.dpr));
  ctx.setTransform(S.dpr,0,0,S.dpr,0,0);
  el('rotate').classList.toggle('show', st.height > st.width && st.width < 640);
}
new ResizeObserver(resize).observe(el('stage'));

function draw(){
  const W=S.W, H=S.H, tr=S.track, wet=S.weather.wetness;

  // ---- sky + ground ----
  const hz = Math.max(0, horizonY());
  const gloom = clamp(wet*1.1,0,1);
  if (hz > 0){
    const sky = ctx.createLinearGradient(0,0,0,hz+30);
    sky.addColorStop(0, mix('#2b4a63','#1b2630',gloom));
    sky.addColorStop(1, mix('#7fa8bf','#39464f',gloom));
    ctx.fillStyle = sky; ctx.fillRect(0,0,W,hz+30);
  }
  const gnd = ctx.createLinearGradient(0,hz,0,H);
  gnd.addColorStop(0, mix('#2f4034','#232c2a',gloom));
  gnd.addColorStop(1, mix('#3d5442','#2a332e',gloom));
  ctx.fillStyle = gnd; ctx.fillRect(0,hz,W,H-hz);

  // ---- track ribbon, far to near ----
  const here = S.player.idx;
  const AHEAD = 150, BEHIND = 12;
  const quads = [];
  for (let k=AHEAD; k>=-BEHIND; k--){
    const i=(here+k+tr.N*2)%tr.N, j=(i+1)%tr.N;
    const a=tr.pts[i], b=tr.pts[j];
    const hw = tr.width*0.5;
    const an=Math.cos(a.head), anz=-Math.sin(a.head);
    const bn=Math.cos(b.head), bnz=-Math.sin(b.head);
    const p1=project(a.x-an*hw, a.y, a.z-anz*hw);
    const p2=project(a.x+an*hw, a.y, a.z+anz*hw);
    const p3=project(b.x+bn*hw, b.y, b.z+bnz*hw);
    const p4=project(b.x-bn*hw, b.y, b.z-bnz*hw);
    if (!p1||!p2||!p3||!p4) continue;
    quads.push({i,a,b,p1,p2,p3,p4,an,anz,hw});
  }
  for (const q of quads){
    const {i,a,p1,p2,p3,p4} = q;
    const stripe = (i>>2) & 1;
    // asphalt, darkened and blued as it wets
    let base = stripe ? '#3a4248' : '#353d43';
    base = mix(base, '#1b2a33', wet*0.55);
    ctx.fillStyle = base;
    ctx.beginPath();
    ctx.moveTo(p1.sx,p1.sy); ctx.lineTo(p2.sx,p2.sy);
    ctx.lineTo(p3.sx,p3.sy); ctx.lineTo(p4.sx,p4.sy); ctx.closePath(); ctx.fill();

    // the racing line: rubbered in when dry, a standing-water river when wet
    drawLineBand(q, wet);

    // kerbs
    kerb(q, -1, i); kerb(q, +1, i);
  }
  // start/finish
  drawStartLine(tr, here);

  // ---- cars, far to near ----
  const drawn = [];
  for (const c of S.cars){
    const p = project(c.x, c.y, c.z);
    if (p) drawn.push({c,p});
  }
  drawn.sort((a,b)=>b.p.rz - a.p.rz);
  for (const d of drawn) drawCar(d.c, d.p, wet);

  // ---- weather fx ----
  if (S.weather.rain > 0.02) drawRain(S.weather.rain);
  if (wet > 0.35) drawSpray();

  // ---- hud ----
  drawHud();
}

function drawLineBand(q, wet){
  const {a,b,an,anz,hw} = q;
  const w = 0.30;                                   // half-width of the band
  const al = a.line, bl = b.line;
  const p1=project(a.x+an*(al-w)*hw, a.y, a.z+anz*(al-w)*hw);
  const p2=project(a.x+an*(al+w)*hw, a.y, a.z+anz*(al+w)*hw);
  const bn=Math.cos(b.head), bnz=-Math.sin(b.head);
  const p3=project(b.x+bn*(bl+w)*hw, b.y, b.z+bnz*(bl+w)*hw);
  const p4=project(b.x+bn*(bl-w)*hw, b.y, b.z+bnz*(bl-w)*hw);
  if (!p1||!p2||!p3||!p4) return;
  ctx.beginPath();
  ctx.moveTo(p1.sx,p1.sy); ctx.lineTo(p2.sx,p2.sy);
  ctx.lineTo(p3.sx,p3.sy); ctx.lineTo(p4.sx,p4.sy); ctx.closePath();
  if (wet < 0.18){
    ctx.fillStyle = 'rgba(20,24,28,.40)';           // dry rubber
  } else {
    // standing water on the polished line — brighter, bluer, reflective
    const t = clamp((wet-0.18)/0.6, 0, 1);
    ctx.fillStyle = `rgba(${(70+90*t)|0},${(130+70*t)|0},${(165+60*t)|0},${0.22+0.4*t})`;
  }
  ctx.fill();
}
function kerb(q, side, i){
  const {a,b,hw} = q;
  const an=Math.cos(a.head), anz=-Math.sin(a.head);
  const bn=Math.cos(b.head), bnz=-Math.sin(b.head);
  const o1=side*1.0, o2=side*1.13;
  const p1=project(a.x+an*o1*hw, a.y, a.z+anz*o1*hw);
  const p2=project(a.x+an*o2*hw, a.y, a.z+anz*o2*hw);
  const p3=project(b.x+bn*o2*hw, b.y, b.z+bnz*o2*hw);
  const p4=project(b.x+bn*o1*hw, b.y, b.z+bnz*o1*hw);
  if (!p1||!p2||!p3||!p4) return;
  ctx.fillStyle = ((i>>1)&1) ? '#d94b4b' : '#eef2f4';
  ctx.beginPath();
  ctx.moveTo(p1.sx,p1.sy); ctx.lineTo(p2.sx,p2.sy);
  ctx.lineTo(p3.sx,p3.sy); ctx.lineTo(p4.sx,p4.sy); ctx.closePath(); ctx.fill();
}
function drawStartLine(tr, here){
  const d = ((0 - here) + tr.N) % tr.N;
  if (d > 150) return;
  const a = tr.pts[0], b = tr.pts[1];
  const an=Math.cos(a.head), anz=-Math.sin(a.head), hw=tr.width*0.5;
  const p1=project(a.x-an*hw,a.y,a.z-anz*hw), p2=project(a.x+an*hw,a.y,a.z+anz*hw);
  const bn=Math.cos(b.head), bnz=-Math.sin(b.head);
  const p3=project(b.x+bn*hw,b.y,b.z+bnz*hw), p4=project(b.x-bn*hw,b.y,b.z-bnz*hw);
  if (!p1||!p2||!p3||!p4) return;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(p1.sx,p1.sy); ctx.lineTo(p2.sx,p2.sy);
  ctx.lineTo(p3.sx,p3.sy); ctx.lineTo(p4.sx,p4.sy); ctx.closePath();
  ctx.clip();
  const minx=Math.min(p1.sx,p2.sx,p3.sx,p4.sx), maxx=Math.max(p1.sx,p2.sx,p3.sx,p4.sx);
  const miny=Math.min(p1.sy,p2.sy,p3.sy,p4.sy), maxy=Math.max(p1.sy,p2.sy,p3.sy,p4.sy);
  const n=12, cw=(maxx-minx)/n, chh=(maxy-miny)/2;
  for (let r=0;r<2;r++) for (let c2=0;c2<n;c2++){
    ctx.fillStyle = ((r+c2)&1) ? '#f2f6f8' : '#1a2026';
    ctx.fillRect(minx+c2*cw, miny+r*chh, cw+1, chh+1);
  }
  ctx.restore();
}

/** Cars are drawn as a projected box: a shadow, four sides and a roof. Cheap,
 *  and the height is what reads as 2.5D rather than a sprite lying flat. */
function drawCar(c, p, wet){
  const L=2.3, Wd=1.05, Hg=0.72;
  const s=Math.sin(c.head), co=Math.cos(c.head);
  const corner = (fx,fz,h) => project(c.x + fx*co + fz*s, c.y + h, c.z - fx*s + fz*co);
  const g = [corner(-Wd,-L,0),corner(Wd,-L,0),corner(Wd,L,0),corner(-Wd,L,0)];
  const t = [corner(-Wd*0.82,-L*0.72,Hg),corner(Wd*0.82,-L*0.72,Hg),
             corner(Wd*0.82,L*0.80,Hg),corner(-Wd*0.82,L*0.80,Hg)];
  if (g.some(v=>!v) || t.some(v=>!v)) return;

  ctx.fillStyle = 'rgba(0,0,0,.36)';
  poly([corner(-Wd*1.15,-L*1.1,0),corner(Wd*1.15,-L*1.1,0),
        corner(Wd*1.15,L*1.1,0),corner(-Wd*1.15,L*1.1,0)].filter(Boolean));

  const dark = shade(c.spec.colour, -0.38);
  ctx.fillStyle = dark;
  poly([g[0],g[1],t[1],t[0]]); poly([g[1],g[2],t[2],t[1]]);
  poly([g[2],g[3],t[3],t[2]]); poly([g[3],g[0],t[0],t[3]]);
  ctx.fillStyle = c.spec.colour; poly(t);
  ctx.fillStyle = c.spec.accent;
  const wsF = corner(-Wd*0.62,L*0.34,Hg), wsG = corner(Wd*0.62,L*0.34,Hg);
  const wsH = corner(Wd*0.62,L*0.66,Hg), wsI = corner(-Wd*0.62,L*0.66,Hg);
  if (wsF&&wsG&&wsH&&wsI) poly([wsF,wsG,wsH,wsI]);

  if (c.isPlayer){
    ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=Math.max(1,p.sc*0.05);
    ctx.beginPath(); ctx.moveTo(t[0].sx,t[0].sy);
    for(let i=1;i<4;i++) ctx.lineTo(t[i].sx,t[i].sy);
    ctx.closePath(); ctx.stroke();
  }
  if (c.brake > 0 || (c.isPlayer && S.input.brake)){
    ctx.fillStyle='#ff3b3b';
    const b1=corner(-Wd*0.8,-L*0.98,Hg*0.55), b2=corner(Wd*0.8,-L*0.98,Hg*0.55);
    if (b1&&b2){ ctx.fillRect(b1.sx-2,b1.sy-2,4,4); ctx.fillRect(b2.sx-2,b2.sy-2,4,4); }
  }
  // spray kicked up behind a car in the wet
  if (wet > 0.3 && c.speed > 14 && Math.random() < 0.5){
    S.spray.push({ x:c.x - Math.sin(c.head)*2.6, z:c.z - Math.cos(c.head)*2.6,
                   y:c.y+0.3, life:0.5, r:1.2+Math.random()*1.6 });
  }
}
function poly(v){ if(v.length<3)return; ctx.beginPath(); ctx.moveTo(v[0].sx,v[0].sy);
  for(let i=1;i<v.length;i++) ctx.lineTo(v[i].sx,v[i].sy); ctx.closePath(); ctx.fill(); }

function drawSpray(){
  ctx.save(); ctx.globalCompositeOperation='screen';
  for (const s of S.spray){
    const p=project(s.x,s.y,s.z); if(!p) continue;
    ctx.fillStyle = `rgba(200,225,240,${0.16*s.life})`;
    ctx.beginPath(); ctx.arc(p.sx,p.sy,s.r*p.sc*0.09,0,TAU); ctx.fill();
  }
  ctx.restore();
}
function drawRain(intensity){
  const n = (intensity*220)|0;
  ctx.save();
  ctx.strokeStyle = `rgba(190,220,240,${0.14+intensity*0.22})`;
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  for (let i=0;i<n;i++){
    const x=Math.random()*S.W, y=Math.random()*S.H;
    const len = 9 + intensity*22;
    ctx.moveTo(x,y); ctx.lineTo(x - len*0.26, y + len);
  }
  ctx.stroke(); ctx.restore();
}

/* ==========================================================
   11. HUD
   ========================================================== */
function drawHud(){
  const W=S.W, H=S.H, c=S.player;
  ctx.save();
  ctx.textBaseline='top';

  // --- position / lap, top-left ---
  panel(58, 8, 122, 44);
  ctx.fillStyle='#8ba3b0'; ctx.font='700 9px sans-serif';
  ctx.fillText('POS', 68, 14); ctx.fillText('LAP', 126, 14);
  ctx.fillStyle='#e8f2f5'; ctx.font='700 22px sans-serif';
  ctx.fillText(`${c.pos}`, 68, 25);
  ctx.font='700 15px sans-serif';
  ctx.fillText(S.phase==='race' ? `${Math.min(c.lap+1,S.laps)}/${S.laps}` : `${c.lap}`, 126, 31);

  // --- speed + tyre, bottom-centre ---
  const bw=176, bx=W/2-bw/2, by=H-56;
  panel(bx, by, bw, 48);
  ctx.fillStyle='#e8f2f5'; ctx.font='700 27px sans-serif'; ctx.textAlign='right';
  ctx.fillText(`${Math.round(c.speed*3.6)}`, bx+72, by+10);
  ctx.fillStyle='#8ba3b0'; ctx.font='700 9px sans-serif'; ctx.textAlign='left';
  ctx.fillText('KM/H', bx+76, by+26);

  const T=TYRES[c.tyre];
  ctx.fillStyle=T.colour;
  ctx.beginPath(); ctx.arc(bx+118, by+22, 13, 0, TAU); ctx.fill();
  ctx.fillStyle='#0b1014'; ctx.font='700 13px sans-serif'; ctx.textAlign='center';
  ctx.fillText(T.short, bx+118, by+15);
  ctx.textAlign='left';
  if (S.rules.degrade){
    const ww=30, wx=bx+136, wy=by+16;
    ctx.fillStyle='#0d151b'; ctx.fillRect(wx,wy,ww,7);
    const life=clamp(1-c.wear,0,1);
    ctx.fillStyle = life>0.45?'#7ddf64' : life>0.2?'#ffcc44':'#ff4d4d';
    ctx.fillRect(wx,wy,ww*life,7);
    ctx.fillStyle='#8ba3b0'; ctx.font='700 8px sans-serif';
    ctx.fillText(`${Math.round(life*100)}%`, wx, wy+10);
  }

  // --- minimap, top-centre ---
  drawMinimap(W/2, 10, 104, 62);

  // --- weather radar, top-right ---
  if (S.rules.weather !== 'dry') drawRadar(W-186, 8, 178, 50);

  // --- session clock / gap, under the minimap ---
  ctx.textAlign='center'; ctx.font='700 11px sans-serif'; ctx.fillStyle='#e8f2f5';
  if (S.phase==='quali'){
    const m=Math.floor(S.timeLeft/60), s=Math.floor(S.timeLeft%60);
    ctx.fillText(`${m}:${String(s).padStart(2,'0')}`, W/2, 76);
    ctx.fillStyle='#8ba3b0'; ctx.font='700 9px sans-serif';
    ctx.fillText(`BEST ${fmtTime(c.best)}`, W/2, 90);
  } else if (S.phase==='race'){
    ctx.fillStyle='#8ba3b0'; ctx.font='700 9px sans-serif';
    ctx.fillText(`LAST ${fmtTime(c.last)}   BEST ${fmtTime(c.best)}`, W/2, 76);
  }
  ctx.textAlign='left';

  drawSteerBar();

  // --- lights / toast ---
  if (S.phase==='grid'){
    const lit = 5 - Math.ceil(S.lights/0.72);
    ctx.textAlign='center';
    for (let i=0;i<5;i++){
      ctx.fillStyle = i<lit ? '#ff2b2b' : '#2a343b';
      ctx.beginPath(); ctx.arc(W/2 - 76 + i*38, H*0.30, 13, 0, TAU); ctx.fill();
    }
    if (S.lights <= 0){
      ctx.fillStyle='#7ddf64'; ctx.font='700 30px sans-serif';
      ctx.fillText('GO', W/2, H*0.30-15);
    }
    ctx.textAlign='left';
  }
  if (S.toast && S.toast.t > 0){
    ctx.textAlign='center';
    ctx.fillStyle=`rgba(232,242,245,${clamp(S.toast.t,0,1)})`;
    ctx.font='700 14px sans-serif';
    ctx.fillText(S.toast.msg, W/2, H*0.62);
    ctx.textAlign='left';
  }
  if (c.offTrack > 0.3){
    ctx.fillStyle=`rgba(255,204,68,${c.offTrack*0.5})`;
    ctx.fillRect(0,0,W,3); ctx.fillRect(0,H-3,W,3);
  }
  ctx.restore();
}
/** The steering pad drawn where the thumb actually is, so the player can see
 *  how much lock they are holding rather than guessing. */
function drawSteerBar(){
  if (S.phase!=='race' && S.phase!=='quali' && S.phase!=='grid') return;
  const R = steerRange();
  const on = S.input.active;
  const x = on ? clamp(S.input.originX, R+22, S.W*0.47-22) : R+30;
  const y = on ? clamp(S.input.originY, 96, S.H-34) : S.H-46;
  ctx.save();
  ctx.globalAlpha = on ? 1 : 0.45;
  ctx.fillStyle='rgba(11,16,20,.55)';
  ctx.strokeStyle='rgba(139,163,176,.5)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(x-R-15, y-15, (R+15)*2, 30, 15); ctx.fill(); ctx.stroke();
  ctx.strokeStyle='rgba(139,163,176,.4)';
  ctx.beginPath(); ctx.moveTo(x, y-7); ctx.lineTo(x, y+7); ctx.stroke();
  const tx = x + S.input.steer*R;
  ctx.fillStyle = Math.abs(S.input.steer)>0.03 ? '#ff6b35' : 'rgba(232,242,245,.8)';
  ctx.beginPath(); ctx.arc(tx, y, 13, 0, TAU); ctx.fill();
  ctx.fillStyle='rgba(11,16,20,.85)';
  ctx.beginPath(); ctx.arc(tx, y, 4.5, 0, TAU); ctx.fill();
  if (!on){
    ctx.fillStyle='rgba(139,163,176,.9)'; ctx.font='700 8px sans-serif'; ctx.textAlign='center';
    ctx.fillText('DRAG TO STEER', x, y+22); ctx.textAlign='left';
  }
  ctx.restore();
}

function panel(x,y,w,h){
  ctx.fillStyle='rgba(11,16,20,.62)';
  ctx.strokeStyle='rgba(61,88,102,.55)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(x,y,w,h,6); ctx.fill(); ctx.stroke();
}

let miniCache=null;
function drawMinimap(cx, y, w, h){
  const tr=S.track;
  if (!miniCache || miniCache.id !== tr.def.id){
    let minx=1e9,maxx=-1e9,minz=1e9,maxz=-1e9;
    for(const p of tr.pts){ minx=Math.min(minx,p.x);maxx=Math.max(maxx,p.x);
                            minz=Math.min(minz,p.z);maxz=Math.max(maxz,p.z); }
    miniCache={ id:tr.def.id, minx,maxx,minz,maxz,
                sx:(maxx-minx)||1, sz:(maxz-minz)||1 };
  }
  const m=miniCache, x0=cx-w/2;
  const sc=Math.min(w/m.sx, h/m.sz)*0.86;
  const ox=x0+w/2 - (m.minx+m.sx/2)*sc, oy=y+h/2 - (m.minz+m.sz/2)*sc;
  panel(x0, y, w, h);
  ctx.save(); ctx.beginPath(); ctx.roundRect(x0,y,w,h,6); ctx.clip();
  ctx.strokeStyle='rgba(139,163,176,.75)';
  ctx.lineWidth=Math.max(2.5, S.track.width*sc*0.5);
  ctx.lineJoin='round';
  ctx.beginPath();
  for(let i=0;i<=tr.N;i+=3){ const p=tr.pts[i%tr.N];
    const px=ox+p.x*sc, pz=oy+p.z*sc;
    i===0?ctx.moveTo(px,pz):ctx.lineTo(px,pz); }
  ctx.closePath(); ctx.stroke();
  ctx.strokeStyle='#e8f2f5'; ctx.lineWidth=1.5;
  const s0=tr.pts[0], sn=Math.cos(s0.head)*tr.width*0.5, snz=-Math.sin(s0.head)*tr.width*0.5;
  ctx.beginPath();
  ctx.moveTo(ox+(s0.x-sn)*sc, oy+(s0.z-snz)*sc);
  ctx.lineTo(ox+(s0.x+sn)*sc, oy+(s0.z+snz)*sc); ctx.stroke();
  for(const c of S.cars){
    ctx.fillStyle = c.isPlayer ? '#ffffff' : c.spec.colour;
    ctx.beginPath(); ctx.arc(ox+c.x*sc, oy+c.z*sc, c.isPlayer?3.4:2.4, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

/** Radar: a timeline of the next 3 minutes read straight from the weather
 *  schedule, so the player can see a front coming and plan the stop. */
function drawRadar(x, y, w, h){
  const W2=S.weather, span=180;
  panel(x,y,w,h);
  ctx.fillStyle='#8ba3b0'; ctx.font='700 8px sans-serif';
  ctx.fillText('WEATHER  NEXT 3 MIN', x+9, y+6);
  const gx=x+9, gy=y+18, gw=w-18, gh=20;
  ctx.fillStyle='#0d151b'; ctx.fillRect(gx,gy,gw,gh);
  for (let i=0;i<gw;i+=2){
    const r = rainAt(W2, W2.t + (i/gw)*span);
    if (r<=0.01) continue;
    const hh = gh*clamp(r,0,1);
    ctx.fillStyle = r>0.62 ? '#4a9fd8' : r>0.24 ? '#7ddf64' : '#9fb9c6';
    ctx.fillRect(gx+i, gy+gh-hh, 2, hh);
  }
  ctx.strokeStyle='rgba(255,107,53,.9)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(gx+0.5,gy); ctx.lineTo(gx+0.5,gy+gh); ctx.stroke();
  // current state + what the conditions want
  const want = idealCompound(W2.wetness);
  ctx.font='700 8px sans-serif';
  ctx.fillStyle = W2.wetness>0.6?'#4a9fd8':W2.wetness>0.24?'#7ddf64':'#8ba3b0';
  const label = W2.wetness<0.08 ? 'DRY' : W2.wetness<0.24 ? 'DAMP'
              : W2.wetness<0.62 ? 'WET' : 'STANDING WATER';
  ctx.fillText(`${label} · WANTS ${TYRES[want].name.toUpperCase()}`, gx, gy+gh+3);
}

/* colour helpers */
function mix(a,b,t){
  const pa=hex(a), pb=hex(b); t=clamp(t,0,1);
  return `rgb(${Math.round(lerp(pa[0],pb[0],t))},${Math.round(lerp(pa[1],pb[1],t))},${Math.round(lerp(pa[2],pb[2],t))})`;
}
function shade(c,amt){
  const p=hex(c), k=amt<0?0:255, t=Math.abs(amt);
  return `rgb(${Math.round(lerp(p[0],k,t))},${Math.round(lerp(p[1],k,t))},${Math.round(lerp(p[2],k,t))})`;
}
function hex(h){ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }

/* ==========================================================
   12. loop
   ========================================================== */
function update(dt){
  if (S.mode!=='race' || S.paused) return;
  const tr=S.track;

  if (S.phase==='grid'){
    S.lights -= dt;
    if (S.lights <= -1.0){ S.phase='race'; S.cars.forEach(c=>c.lapStart=S.clock); }
    else { S.clock += dt; stepWeather(S.weather, tr, dt); syncCamera(false); return; }
  }

  S.clock += dt;
  stepWeather(S.weather, tr, dt);
  // follow the thumb quickly but not instantly, so a flick is not a jolt
  S.input.steer = lerp(S.input.steer, S.input.target, Math.min(1, dt*18));

  for (const c of S.cars){
    if (c.finished && c.isPlayer) continue;
    stepCar(S, c, dt);
    if (!c.isPlayer) aiPitCheck(S, c);
  }
  separate();
  orderCars();

  // spray fade
  for (let i=S.spray.length-1;i>=0;i--){
    const s=S.spray[i]; s.life -= dt*1.6; s.r += dt*4;
    if (s.life<=0) S.spray.splice(i,1);
  }
  if (S.toast) S.toast.t -= dt;

  if (S.phase==='quali'){
    S.timeLeft -= dt;
    if (S.timeLeft <= 0){ endSession(); return; }
  } else if (S.phase==='race'){
    if (S.player.finished){ endSession(); return; }
  }
  syncCamera(false);
  updatePitButton();
}

/** Keep cars from occupying the same metre of tarmac. Not a collision model —
 *  a nudge apart, which is all an arcade racer needs. */
function separate(){
  for (let i=0;i<S.cars.length;i++) for (let j=i+1;j<S.cars.length;j++){
    const a=S.cars[i], b=S.cars[j];
    if (a.inPit!==b.inPit) continue;
    const dx=b.x-a.x, dz=b.z-a.z, d=Math.hypot(dx,dz);
    if (d>3.4 || d<1e-3) continue;
    const push=(3.4-d)/2, nx=dx/d, nz=dz/d;
    a.x-=nx*push; a.z-=nz*push; b.x+=nx*push; b.z+=nz*push;
    const avg=(a.speed+b.speed)/2;
    a.speed=lerp(a.speed,avg,0.25); b.speed=lerp(b.speed,avg,0.25);
  }
}

let last=performance.now();
function frame(now){
  const dt=Math.min(0.035,(now-last)/1000); last=now;
  update(dt);
  if (S.mode==='race'||S.mode==='results'){ if(S.track) draw(); }
  requestAnimationFrame(frame);
}

/* ==========================================================
   13. input
   ========================================================== */
function hold(btn, on, off){
  const d=e=>{e.preventDefault(); btn.classList.add('down'); on();};
  const u=e=>{e.preventDefault(); btn.classList.remove('down'); off();};
  btn.addEventListener('pointerdown',d);
  btn.addEventListener('pointerup',u);
  btn.addEventListener('pointerleave',u);
  btn.addEventListener('pointercancel',u);
}
let kl=false, kr=false;
hold(el('bBrake'), ()=>{S.input.brake=true;}, ()=>{S.input.brake=false;});

/* Steering is a relative drag pad, not two buttons. Put a thumb down anywhere in
 * the left zone and that point becomes centre; how far you drag from it sets how
 * much lock. A long constant-radius corner is then a thumb held still, instead of
 * a stream of full-lock taps. */
const STEER_EXPO = 1.25;                       // fine control near centre
const steerRange = () => Math.min(120, S.W*0.17);
const zone = el('steerZone');
let steerPtr = null;
zone.addEventListener('pointerdown', e=>{
  e.preventDefault();
  steerPtr = e.pointerId;
  try { zone.setPointerCapture(e.pointerId); } catch(_){}
  S.input.active = true;
  S.input.originX = e.clientX - S.stageLeft;
  S.input.originY = e.clientY - S.stageTop;
  S.input.target = 0;
});
zone.addEventListener('pointermove', e=>{
  if (e.pointerId !== steerPtr) return;
  const t = clamp(((e.clientX - S.stageLeft) - S.input.originX)/steerRange(), -1, 1);
  S.input.target = Math.sign(t) * Math.pow(Math.abs(t), STEER_EXPO);
});
function endSteer(e){
  if (steerPtr !== null && e.pointerId !== steerPtr) return;
  steerPtr = null; S.input.active = false;
  S.input.target = kl ? -1 : kr ? 1 : 0;
}
zone.addEventListener('pointerup', endSteer);
zone.addEventListener('pointercancel', endSteer);
zone.addEventListener('lostpointercapture', endSteer);
addEventListener('keydown',e=>{
  if(e.repeat)return;
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a'){kl=true;S.input.target=-1;}
  else if(k==='arrowright'||k==='d'){kr=true;S.input.target=1;}
  else if(k===' '||k==='arrowdown'||k==='s'){S.input.brake=true;e.preventDefault();}
  else if(k==='p'){togglePit();}
  else if(k==='escape'){ if(S.mode==='race') setPaused(!S.paused); }
});
addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a'){kl=false;S.input.target=kr?1:0;}
  else if(k==='arrowright'||k==='d'){kr=false;S.input.target=kl?-1:0;}
  else if(k===' '||k==='arrowdown'||k==='s'){S.input.brake=false;}
});
addEventListener('blur',()=>{S.input.target=0;S.input.brake=false;kl=kr=false;steerPtr=null;S.input.active=false;});

function togglePit(){
  const c=S.player;
  if (S.phase!=='race' || c.inPit || c.finished) return;
  c.pitArmed = !c.pitArmed;
  if (c.pitArmed){
    c.pitTo = S.rules.weather==='dry' && !S.rules.degrade ? c.tyre
            : idealCompound(S.weather.wetness);
    S.toast={t:2.4,msg:`Box this lap — ${TYRES[c.pitTo].name}`};
  }
  updatePitButton();
}
el('bPit').addEventListener('click',togglePit);
function updatePitButton(){
  const b=el('bPit'), c=S.player;
  const usable = S.phase==='race' && !c.finished;
  b.style.display = usable ? '' : 'none';
  b.classList.toggle('armed', c.pitArmed);
  b.textContent = c.inPit ? 'IN PIT' : c.pitArmed ? `BOX · ${TYRES[c.pitTo||c.tyre].short}` : 'PIT';
}

function setPaused(p){
  S.paused=p; el('pause').hidden=!p;
  if(p){S.input.target=0;S.input.brake=false;}
}
el('bMenu').addEventListener('click',()=>setPaused(true));
el('btnResume').addEventListener('click',()=>setPaused(false));
el('btnSkip').addEventListener('click',()=>{ setPaused(false); endSession(); });
el('btnQuit').addEventListener('click',()=>{ setPaused(false); toMenu(); });

/* ==========================================================
   14. setup screen
   ========================================================== */
function trackThumb(canvas, def){
  const tr=getTrack(def.id), c=canvas.getContext('2d');
  const w=canvas.width=124, h=canvas.height=80;
  let minx=1e9,maxx=-1e9,minz=1e9,maxz=-1e9;
  for(const p of tr.pts){minx=Math.min(minx,p.x);maxx=Math.max(maxx,p.x);
                         minz=Math.min(minz,p.z);maxz=Math.max(maxz,p.z);}
  const sc=Math.min(w/(maxx-minx||1), h/(maxz-minz||1))*0.82;
  const ox=w/2-((minx+maxx)/2)*sc, oy=h/2-((minz+maxz)/2)*sc;
  c.clearRect(0,0,w,h);
  c.strokeStyle='#3d5866'; c.lineWidth=7; c.lineJoin='round';
  c.beginPath();
  for(let i=0;i<=tr.N;i+=3){const p=tr.pts[i%tr.N];
    const x=ox+p.x*sc,y=oy+p.z*sc; i===0?c.moveTo(x,y):c.lineTo(x,y);}
  c.closePath(); c.stroke();
  c.strokeStyle='#8ba3b0'; c.lineWidth=4; c.stroke();
  c.fillStyle='#ff6b35';
  c.beginPath(); c.arc(ox+tr.pts[0].x*sc, oy+tr.pts[0].z*sc, 3.5,0,TAU); c.fill();
}

function buildSetup(){
  // --- tracks ---
  const pt=el('paneTrack'); pt.innerHTML='';
  TRACKS.forEach(t=>{
    const b=document.createElement('button');
    b.className='card'+(setup.track===t.id?' on':'');
    b.innerHTML=`<canvas></canvas><div class="gr"><div class="nm">${t.name}</div>
      <div class="mt">${(getTrack(t.id).length/1000).toFixed(2)} km · ${t.laps} lap default</div>
      <div class="mt" style="text-transform:none;letter-spacing:0;color:#6f8996">${t.note}</div></div>`;
    b.onclick=()=>{ setup.track=t.id; setup.laps=t.laps; buildSetup(); };
    pt.appendChild(b); trackThumb(b.querySelector('canvas'), t);
  });
  // --- cars ---
  const pc=el('paneCar'); pc.innerHTML='';
  CARS.forEach(c=>{
    const b=document.createElement('button');
    b.className='card'+(setup.car===c.id?' on':'');
    const bar=(l,v)=>`<div class="stat"><i>${l}</i><div class="bar"><span style="width:${v*100}%;background:${c.colour}"></span></div></div>`;
    b.innerHTML=`<div class="swatch" style="background:${c.colour}"></div>
      <div class="gr"><div class="nm">${c.name}</div>
      <div class="mt" style="text-transform:none;letter-spacing:0;color:#6f8996">${c.blurb}</div></div>
      <div class="stats">${bar('Speed',c.top)}${bar('Accel',c.accel)}${bar('Grip',c.grip)}${bar('Brake',c.brake)}${bar('Tyre',1-c.wear)}</div>`;
    b.onclick=()=>{ setup.car=c.id; buildSetup(); };
    pc.appendChild(b);
  });
  // --- rules ---
  const pr=el('paneRules');
  const segs=(label,opts,cur,fn,hot)=>`<div class="opt"><div class="lbl">${label}</div>
    <div class="seg">${opts.map(o=>`<button data-v="${o.v}" class="${o.v==cur?'on':''}${hot?' hot':''}">${o.n}</button>`).join('')}</div></div>`;
  pr.innerHTML =
    segs('Difficulty', DIFFS.map(d=>({v:d.id,n:d.name})), setup.diff, 0, 1) +
    segs('Opponents', [3,5,7,9,11].map(n=>({v:n,n})), setup.rivals) +
    segs('Race laps', [2,3,5,8,12].map(n=>({v:n,n})), setup.laps) +
    segs('Qualifying', [{v:60,n:'1 min'},{v:180,n:'3 min'},{v:300,n:'5 min'}], setup.quali) +
    segs('Tyre degradation', [{v:'on',n:'On'},{v:'off',n:'Off'}], setup.degrade?'on':'off') +
    segs('Weather', WEATHERS.map(w=>({v:w.id,n:w.name})), setup.weather) +
    `<div class="hint" id="wHint"></div>`;
  const groups=pr.querySelectorAll('.seg');
  const keys=['diff','rivals','laps','quali','degrade','weather'];
  groups.forEach((g,gi)=>g.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{
      const k=keys[gi]; let v=b.dataset.v;
      if(k==='rivals'||k==='laps'||k==='quali') v=+v;
      if(k==='degrade') v = v==='on';
      setup[k]=v; buildSetup();
    };
  }));
  el('wHint').textContent = WEATHERS.find(w=>w.id===setup.weather).hint +
    (setup.degrade ? ' Tyres wear — plan at least one stop.' : ' No degradation — no stops needed unless it rains.');

  // --- summary ---
  const t=TRACKS.find(x=>x.id===setup.track), car=CARS.find(x=>x.id===setup.car);
  el('summary').innerHTML=`
    <div><span style="color:#8ba3b0">Circuit</span> &nbsp;<b>${t.name}</b></div>
    <div><span style="color:#8ba3b0">Car</span> &nbsp;<b style="color:${car.colour}">${car.name}</b></div>
    <div><span style="color:#8ba3b0">Grid</span> &nbsp;<b>${setup.rivals+1} cars</b></div>
    <div><span style="color:#8ba3b0">Race</span> &nbsp;<b>${setup.laps} laps</b></div>
    <div><span style="color:#8ba3b0">Tyres</span> &nbsp;<b>${setup.degrade?'Degradation on':'No degradation'}</b></div>
    <div><span style="color:#8ba3b0">Weather</span> &nbsp;<b>${WEATHERS.find(w=>w.id===setup.weather).name}</b></div>`;
  el('tip').textContent = setup.weather==='dynamic'
    ? 'Radar sits top-right in the race. A front takes about half a lap to soak the circuit — box before it arrives, not after.'
    : setup.weather==='wet'
    ? 'In the wet the rubbered racing line is the slippery one. Run wide of it.'
    : 'Steering is a drag pad — put a thumb anywhere on the left and slide. How far you drag is how much lock.';
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  el('paneTrack').hidden = t.dataset.tab!=='track';
  el('paneCar').hidden   = t.dataset.tab!=='car';
  el('paneRules').hidden = t.dataset.tab!=='rules';
});

el('btnQualify').onclick=()=>{ S.results=null; startSession('quali'); };
el('btnNext').onclick=()=>{
  el('results').hidden=true;
  if (S.phase==='quali') startSession('race');
  else { S.results=null; startSession('quali'); }
};
el('btnBackMenu').onclick=()=>{ el('results').hidden=true; toMenu(); };
function toMenu(){
  S.mode='setup'; S.results=null;
  el('setup').hidden=false; el('pad').hidden=true; el('bMenu').hidden=true;
  el('results').hidden=true;
}

/* ==========================================================
   15. boot
   ========================================================== */
resize();
buildSetup();
requestAnimationFrame(frame);
})();
</script>
